<meta charset="utf-8">
<title>Chicago Live Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed dark canvas map, right-hand roster, transport bar underneath. Single dark theme. */
:root {
  --bg: #0a0d13;
  --panel: #0c1017;
  --line: #161d28;
  --line-2: #212a38;
  --fg: #e8edf4;
  --mute: #7f8a9a;
  --dim: #556071;
  --chip: #e9edf3;
  --chip-fg: #0c1017;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-variant-numeric: tabular-nums;
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#selchip button { background: #ffffff10; border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); background: #ffffff1c; }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 48px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover, .row.hl { background: #10161f; }
.row.sel { background: #131b27; border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid #5d7fa6; outline-offset: -1px; }
.row .no { font: 400 11.5px var(--sans); color: var(--mute); font-variant-numeric: tabular-nums; }
.row .no.m { color: var(--c); font-weight: 500; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 28px; color: var(--mute); }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #0f151e; padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; flex: none; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stops li .tm { font: 400 10.5px var(--sans); font-variant-numeric: tabular-nums; }
#stops li .zc { font: 500 10px var(--sans); letter-spacing: .04em; opacity: .9; }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: #aab4c2; pointer-events: none;
}
#keybody { pointer-events: auto; width: min(320px, 100%); background: #0c1017ee; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: #ffffff0d; }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: #0c1017d9; border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: #131a25; }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: #0a0d13; }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: #ffffff14; color: var(--fg); }
#legend #zones { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; color: var(--mute); font-size: 11px; }
#zones.on { color: var(--fg); background: #ffffff12; }
#zones .zk { display: inline-flex; gap: 6px; font: 500 10.5px var(--sans); }
#zones .zk b { font-weight: 500; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 120px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: #0c1017e6; border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: #0c1017d9; border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: #131a25; }
#tip {
  position: absolute; pointer-events: none; background: #0f141cf2; border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px;
  color: var(--fg); max-width: 260px; z-index: 5; box-shadow: 0 6px 24px #0008; transform: translate(12px, 14px);
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#tip .z { font: 500 10.5px var(--sans); letter-spacing: .04em; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible { outline: 2px solid #5d7fa6; outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: #0c1017; flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }
  #count { font-size: 28px; }
  .row { padding: 7px 16px; grid-template-columns: 54px 1fr; }
  .row .to { font-size: 15px; }
  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <div id="mapwrap">
    <canvas id="base"></canvas>
    <canvas id="live"></canvas>
    <div id="zoomc"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Reset view">&#8962;</button></div>
    <div id="legend"></div>
    <div id="tip" hidden></div>
    <div id="loading">Loading schedule&hellip;</div>
  </div>
  <aside id="side">
    <div id="head"><span id="count">0</span><span class="lbl">running</span><span class="tag">Scheduled</span><div id="selchip" hidden></div></div>
    <div id="detail" hidden></div>
    <div id="list" role="list"></div>
  </aside>
  <div id="bar">
    <button id="play" aria-label="Pause"></button>
    <div id="clock">8:15<small>AM</small><em>CT</em></div>
    <button id="speed" title="Change speed">120&times;</button>
    <div id="hist" aria-label="Service over the day. Drag to change time."><canvas></canvas></div>
    <div class="seg" id="days" role="group" aria-label="Day type">
      <button data-d="wkd">Wkd</button><button data-d="sat">Sat</button><button data-d="sun">Sun</button>
    </div>
  </div>
</div>

wrap.addEventListener('dblclick', (e) => { if (e.target.closest('#zoomc,#legend,#sublegend')) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#zoomc,#legend,#sublegend')) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    const o = ptrs.get(e.pointerId); const dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2) {
      const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch0) zoomAt(d / pinch0, (a[0][0] + a[1][0]) / 2 - r.left, (a[0][1] + a[1][1]) / 2 - r.top); pinch0 = d;
    } else { userMoved = true; view.cx -= dx / view.s; view.cy -= dy / view.s; baseDirty = true; }
    return;
  }
  if (e.pointerType === 'touch') return;
  hit(px, py, e);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  const test = (P, si) => {
    for (let i = 1; i < P.n; i++) {
      const ax = SX(P.X[i - 1]), ay = SY(P.Y[i - 1]), bx = SX(P.X[i]), by = SY(P.Y[i]);
      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;
      if (d < bd) { bd = d; best = si; }
    }
  };
  shapeRoutes.forEach((rs, si) => { test(shapes[si], si); });
  if (best === null) return null;
  const rs = [...shapeRoutes.get(best)]; return lineForRoute(rs[0]);
}
function hit(px, py, e) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  hoverStation = null;
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(best.p.g === 0 ? 'Train ' + (best.tr.no || r.s) : r.name) + '</b> → ' + esc(headOf(best)) + '</div><div class="s">' + esc(best.p.g === 0 ? r.k : 'Scheduled train') + (best.nx < best.p.st.length ? ' · next ' + esc(stops[best.p.st[best.nx]].n) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { hoverStation = sb; tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.min(px, W - tw - 24) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {
  let h = '<div><b>' + esc(s.n) + '</b></div>';
  const names = [...new Set(s.routes.map((r) => routes[r].name))].slice(0, 4).join(' · ');
  if (s.rail && s.ci >= 0) {
    h += '<div class="s"><span class="z" style="color:' + ZCOL[s.ci] + '">' + ZNAME[s.ci].toUpperCase() + '</span></div>';
    h += '<div class="s">' + esc(names) + '</div>';
    if (s.ci === 0) h += '<div class="s">Downtown terminal · $' + FARE['1'].toFixed(2) + ' within Zone 1</div>';
    else h += '<div class="s">To or from downtown: $' + FARE[s.z].toFixed(2) + '</div>';
  } else h += '<div class="s">' + esc(names) + '</div>';
  return h;
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) { select(best.k); }
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') { t = (t + 600) % 86400; } else if (e.key === 'ArrowLeft') { t = (t + 86400 - 600) % 86400; }
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles();
  drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => { resize(); }).observe(wrap);
  new ResizeObserver(() => { const hr = hist.getBoundingClientRect(); hc.width = Math.round(hr.width * dpr); hc.height = Math.round(hr.height * dpr); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => { baseDirty = true; }); }
boot();
})();
</script>
