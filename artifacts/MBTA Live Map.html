<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>MBTA Live Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed dark map, fixed right rail listing running trains, bottom transport bar with day-histogram scrubber. Single dark look by choice (matches the Amtrak map). */
:root{
  --bg:#090c11; --panel:#0c1016; --bar:#0e1218; --line:rgba(255,255,255,.07);
  --fg:#f2f4f8; --mute:#8a92a1; --dim:#555d6b; --hover:rgba(255,255,255,.04); --sel:rgba(255,255,255,.08);
  --red:#ff4d46; --orange:#ff9a1f; --blue:#3d8bff; --green:#2fc46b; --cr:#c660d4;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; 
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 252px;grid-template-rows:minmax(0,1fr) auto}
.map{position:relative;grid-row:1;grid-column:1;min-height:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
.side{grid-row:1;grid-column:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:20px 16px 12px;display:flex;align-items:baseline;gap:8px;flex:none}
.head b{font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.head span{color:var(--mute);font-size:13px}
.list{flex:1;overflow-y:auto;padding:4px 0 24px;scrollbar-width:thin;scrollbar-color:#242a34 transparent;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 6px;align-items:start;width:100%;text-align:left;padding:9px 12px 9px 16px}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.num{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim);padding-top:3px;white-space:nowrap}
.dest{font-size:13.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--mute);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zc{font-variant-numeric:tabular-nums;font-size:10px;color:var(--dim);padding-top:4px;letter-spacing:.02em}
.empty{padding:24px 16px;color:var(--mute);font-size:13px}
.key{position:absolute;left:12px;bottom:12px;width:min(372px,calc(100% - 24px));border-radius:12px;background:rgba(14,18,24,.92);border:1px solid var(--line);backdrop-filter:blur(6px);overflow:hidden}
.kh{display:flex;align-items:center;justify-content:center;width:100%;padding:9px 14px;color:var(--mute);font-size:12.5px;font-weight:500}
.kh:hover{color:var(--fg)}
.kh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s}
.key.shut .kh svg{transform:rotate(180deg)}
.kh .fc{color:var(--fg);font-weight:500}
.kb{padding:0 8px 8px}
.key.shut .kb{display:none}
.key.shut{width:auto}
.vw{display:flex;gap:2px;padding:3px;margin:0 4px 8px;border-radius:8px;background:#11161d;border:1px solid var(--line)}
.vw button{flex:1;padding:5px 8px;border-radius:6px;color:var(--mute);font-size:12px;font-weight:500}
.vw button:hover{color:var(--fg)}
.vw button.on{background:#eef0f3;color:#0a0d12}
.tabs{display:flex;gap:2px;padding:3px;margin:0 4px 8px;border-radius:8px;background:#11161d;border:1px solid var(--line)}
.tabs button{flex:1;padding:5px 8px;border-radius:6px;color:var(--mute);font-size:12px;font-weight:500}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:#eef0f3;color:#0a0d12}
.items{display:flex;flex-wrap:wrap;gap:2px}
.lg{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12.5px;padding:5px 8px;border-radius:7px}
.lg:hover{color:var(--fg);background:var(--hover)}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.lg.on{background:var(--sel);color:var(--fg)}
.items.has .lg:not(.on){opacity:.5}
.zr{margin:8px 8px 2px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.zr .rb{display:flex;flex:1;height:4px;border-radius:2px;overflow:hidden}
.zr .rb i{flex:1}
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools .note{font-size:11px;color:var(--dim);text-align:right}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:#11161d;border:1px solid var(--line)}
.seg button{padding:5px 11px;border-radius:7px;color:var(--mute);font-size:12.5px;font-weight:500}
.seg button:hover{color:var(--fg)}
.seg button.on{background:#eef0f3;color:#0a0d12}
.card{position:absolute;left:16px;top:16px;width:min(300px,calc(100% - 32px));padding:12px 14px 12px;border-radius:12px;background:rgba(14,18,24,.92);border:1px solid var(--line);backdrop-filter:blur(6px)}
.card[hidden]{display:none}
.card .t1{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute)}
.card .t1 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.card .t1 .x{margin-left:auto;color:var(--dim);font-size:16px;line-height:1;padding:0 2px}
.card .t1 .x:hover{color:var(--fg)}
.card h3{margin:6px 0 2px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card .nx{font-size:12.5px;color:var(--mute);line-height:1.4}
.card .nx b{color:var(--fg);font-weight:500}
.card .pg{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.card .pg div{height:100%;background:var(--c);width:0}
.tip{position:absolute;pointer-events:none;padding:5px 9px;border-radius:7px;background:#171c24;border:1px solid rgba(255,255,255,.08);font-size:12px;white-space:nowrap;transform:translate(12px,12px);z-index:5}
.tip[hidden]{display:none}
.tip small{color:var(--mute);margin-left:6px}
.bar{grid-row:2;grid-column:1/3;display:flex;align-items:center;gap:22px;padding:14px max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bar);border-top:1px solid var(--line)}
.play{width:44px;height:44px;border-radius:50%;background:#eef0f3;color:#0a0d12;display:grid;place-items:center;flex:none}
.play:hover{background:#fff}
.play svg{width:18px;height:18px;fill:currentColor}
.clock{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:152px}
.clock b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.clock em{font-style:normal;font-size:15px;color:var(--mute)}
.clock small{font-size:10px;color:var(--dim);margin-left:3px}
.spd{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);padding:6px 8px;border-radius:6px;min-width:58px}
.spd:hover{color:var(--fg);background:var(--hover)}
.tl{flex:1;min-width:0;height:44px;position:relative;touch-action:none;cursor:ew-resize}
.tl canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 30vh auto}
  .side{grid-row:2;grid-column:1;border-left:0;border-top:1px solid var(--line)}
  .head{padding:10px 16px 4px}.head b{font-size:26px}
  .bar{grid-row:3;flex-wrap:wrap;gap:10px 14px}
  .clock{min-width:0}.clock b{font-size:24px}
  .tl{order:9;flex-basis:100%;height:34px}
  .key{bottom:10px}
  .tools{bottom:auto;top:12px;right:12px}.tools .note{display:none}
  .card{top:auto;bottom:80px;left:12px}
  .seg{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <div class="map" id="map">
    <canvas id="cv" aria-label="Map of MBTA subway and commuter rail trains"></canvas>
    <div class="card" id="card" hidden></div>
    <div class="key" id="key"></div>
    <div class="tools">
      <div class="note" id="note"></div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="side">
    <div class="head"><b id="count">0</b><span>running</span></div>
    <div class="list" id="list"></div>
  </aside>
  <div class="bar">
    <button class="play" id="play" aria-label="Pause"></button>
    <div class="clock" id="clock"></div>
    <button class="spd" id="spd" title="Playback speed"></button>
    <div class="tl" id="tl"><canvas id="tlc"></canvas></div>
    <div class="seg" id="days"><button data-d="wkd" class="on">Wkd</button><button data-d="sat">Sat</button><button data-d="sun">Sun</button></div>
  </div>
</div>

/* ---------- controls ---------- */
const playEl=$('play');
const ICON={pause:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>'};
function setPlay(p){st.playing=p;playEl.innerHTML=p?ICON.pause:ICON.play;playEl.setAttribute('aria-label',p?'Pause':'Play')}
playEl.onclick=()=>setPlay(!st.playing);setPlay(true);
const spdEl=$('spd');function setSp(i){st.sp=i;spdEl.textContent=SPEEDS[i]+'×'}
spdEl.onclick=()=>setSp((st.sp+1)%SPEEDS.length);setSp(2);
document.querySelectorAll('#days button').forEach(b=>b.onclick=()=>setDay(b.dataset.d));
function setDay(d){st.day=d;document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));st.sel=null;cardEl.hidden=true;lastKey='';$('note').textContent='Scheduled service · sample '+DAYNAME[d];buildTL()}
addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON/.test(document.activeElement.tagName)){e.preventDefault();setPlay(!st.playing)}if(e.key==='Escape'){if(st.sel)select(null);else if(st.focus)setFocus(null,[])}});

/* ---------- map interaction ---------- */
const ptrs=new Map();let pinch=null,moved=0,downAt=null;
function zoomAt(px,py,f){const nk=Math.min(400,Math.max(2.2,view.k*f));f=nk/view.k;
  const wx=view.cx+(px-W/2)/view.k,wy=view.cy-(py-H/2)/view.k;view.k=nk;view.cx=wx-(px-W/2)/view.k;view.cy=wy+(py-H/2)/view.k;dirty=true}
cv.addEventListener('wheel',e=>{e.preventDefault();fly=null;st.follow=false;const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)))},{passive:false});
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downAt={x:e.clientX,y:e.clientY};fly=null;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(ptrs.has(e.pointerId)){const p=ptrs.get(e.pointerId);
    if(ptrs.size===2&&pinch){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch.d);pinch.d=d;moved=9;st.follow=false}
    else if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){view.cx-=dx/view.k;view.cy+=dy/view.k;st.follow=false;cv.classList.add('drag');dirty=true}p.x=e.clientX;p.y=e.clientY}
    return}
  hoverAt(px,py,e)});
const endPtr=e=>{const wasTap=ptrs.size===1&&moved<=4;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;cv.classList.remove('drag');
  if(wasTap){const r=cv.getBoundingClientRect();const h=nearest(e.clientX-r.left,e.clientY-r.top,12);if(h)select(h,false);else{const id=trackAt(e.clientX-r.left,e.clientY-r.top,8);if(id)focusRoute(id);else select(null)}}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null});
cv.addEventListener('pointerleave',()=>{tipEl.hidden=true;st.hover=null});
cv.addEventListener('dblclick',e=>{const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,2)});
const tipEl=$('tip');
function nearest(px,py,rad){let b=null,bd=rad*rad;for(const q of hits){const d=(q.sx-px)**2+(q.sy-py)**2;if(d<bd){bd=d;b=q}}return b}
function hoverAt(px,py,e){const q=nearest(px,py,11);st.hover=q;
  if(q){const tr=q.tr;tipEl.innerHTML=`${esc(tr.head)}<small>${esc(lineLabel(tr))}${tr.r.gi===0&&tr.num?' · #'+esc(tr.num):''}</small>`;
    tipEl.hidden=false;tipEl.style.left=px+'px';tipEl.style.top=py+'px';cv.style.cursor='pointer';return}
  let sbest=null,sd=64;for(const s of stops){if(![...s.r].some(inF))continue;const d=(X(s.x)-px)**2+(Y(s.y)-py)**2;if(d<sd){sd=d;sbest=s}}
  if(sbest){const ln=[...sbest.g].sort().map(i=>GROUPS[i].name.replace(' Line','')).join(' · ');
    tipEl.innerHTML=`${esc(sbest.n)}<small>${esc(ln)}${sbest.z?' · Fare zone '+sbest.z:''}</small>`;tipEl.hidden=false;tipEl.style.left=px+'px';tipEl.style.top=py+'px'}
  else tipEl.hidden=true;cv.style.cursor=''}

/* ---------- clock ---------- */
const clockEl=$('clock');let lastClock='';
function drawClock(){const s=((st.t%86400)+86400)%86400,h=Math.floor(s/3600),m=Math.floor(s%3600/60);const h12=h%12===0?12:h%12;
  const k=h12+':'+String(m).padStart(2,'0')+(h>=12?'PM':'AM');if(k===lastClock)return;lastClock=k;
  clockEl.innerHTML=`<b>${h12}:${String(m).padStart(2,'0')}</b><em>${h>=12?'PM':'AM'}</em><small>ET</small>`}

/* ---------- loop ---------- */
let prev=performance.now();
function frame(ts){const dt=Math.min(.25,(ts-prev)/1000);prev=ts;
  if(st.playing&&!scrub){st.t+=dt*SPEEDS[st.sp];if(st.t>=T0+SPAN)st.t-=SPAN}
  stepFly(ts);
  trains=compute(st.t);
  if(st.follow&&st.sel){const c=trains.find(q=>q.tr===st.sel.tr);if(c){view.cx+=(c.x-view.cx)*.12;view.cy+=(c.y-view.cy)*.12;dirty=true}}
  if(st.sel){const c=trains.find(q=>q.tr===st.sel.tr);if(c)st.sel=c;else{st.sel=null;cardEl.hidden=true;st.follow=false}}
  if(dirty)drawStatic();
  draw(ts);updateList(ts);drawClock();drawTL();if(st.sel&&(Math.floor(ts/250)!==frame.c)){frame.c=Math.floor(ts/250);drawCard()}
  requestAnimationFrame(frame)}
new ResizeObserver(()=>resize()).observe(cv.parentElement);
resize();buildLegend();setDay(st.day);
requestAnimationFrame(frame);
})();
</script>

</body></html>
