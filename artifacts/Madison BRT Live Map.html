/* ---------- roster & detail ---------- */

/* ---------- time bar ---------- */
const playBtn = $('play');

const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';

playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {

  const hs = D.hist[day], N = 480, mxv = Math.max.apply(null, hs) || 1, bw = w / N, ph = t / 86400, lt = T === THEMES.light;
  for (let i = 0; i < N; i++) {

let seeking = false;

function drawClock() { const m = clk(t).match(/^(\d+:\d\d) (AM|PM)$/); $('clock').innerHTML = m[1] + '<small>' + m[2] + '</small><em>CT</em>'; }

/* ---------- key ---------- */
const KEY_NOTE = { all: 'Rapid Route A is the BRT. Routes B, C and D run every 15 min or better in the daytime.', brt: 'Rapid Route A runs every 15 min Mon–Sat daytime, every 30 min evenings and Sundays.', freq: 'Routes B, C and D run every 15 min or better in the daytime.' };

  $('knote').textContent = KEY_NOTE[emph] + ' ' + FARE_NOTE + '.'; markKey();
}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    const on = !!lineSel && (b.dataset.r !== undefined ? lineSel.key === 'r' + b.dataset.r : lineSel.g === +b.dataset.g);

}

    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="brt">BRT</button><button data-e="freq">Frequent</button></span></div>' +

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.35, Math.min(s0 * 60, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
const UI = '#zoomc,#legend,#sublegend,#theme';
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };

wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];

  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;

});
function lineAt(px, py) {

    const P = shapes[si];
    for (let i = 1; i < P.n; i++) {

      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      let d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2; if (routes[ri].gi === 0) d *= 0.6; if (fd(routes[ri].gi)) d += 40;
      if (d < bd) { bd = d; best = ri; }
    }
  });
  return best === null ? null : lineForRoute(best);
}
function hit(px, py) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer'; const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(headOf(best)) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';

    if (sb) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(sb.n) + '</b></div><div class="s">' + esc([...new Set(sb.routes.map((r) => routes[r].name))].join(' · ')) + '</div><div class="s">' + FARE_NOTE + '</div>'; }
    else { const l = lineAt(px, py); if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">' + esc(routes[[...l.set][0]].v.replace(/:/g, ' ↔ ').toLowerCase().replace(/(^|[\s\/\-])\w/g, (c) => c.toUpperCase())) + '</div><div class="s">Click to highlight</div>'; } else { tip.hidden = true; return; } }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = px + 14, ly = py + 16; if (lx + tw > W - 6) lx = px - tw - 14; if (ly + th > H - 6) ly = py - th - 12;
  tip.style.left = Math.max(6, lx) + 'px'; tip.style.top = Math.max(6, ly) + 'px';
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {

    for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) select(best.k);

wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;

  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();

  applyTheme(th); resize(); loadDay(); $('loading').remove();

  window.__map = { setLine, lineForRoute, lineForGroup, select, setEmph, get vehicles() { return vehicles; }, setT(v) { t = v; }, zoomAt, applyTheme };
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
</script>
