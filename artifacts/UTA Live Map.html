<meta charset="utf-8">
<title>UTA Live Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed canvas map with a right-hand roster and a transport bar underneath. Dark by default, light on toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --card: #0c1017ee; --ctl: #0c1017d9; --hover: #131a25; --row-hover: #10161f; --row-sel: #131b27; --detail: #0f151e; --seg: #0c1017;
  --tip: #0f141cf2; --shadow: #0008; --focus: #5d7fa6; --wash: #ffffff10;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f8f9fb; --line: #dde2ea; --line-2: #cbd3de;
  --fg: #141b27; --mute: #5b6677; --dim: #8791a1;
  --chip: #141b27; --chip-fg: #f4f6f9;
  --card: #fbfcfdee; --ctl: #fbfcfdd9; --hover: #e7ecf3; --row-hover: #eef2f7; --row-sel: #e4eaf3; --detail: #f1f4f8; --seg: #f8f9fb;
  --tip: #fbfcfdf2; --shadow: #1b263a33; --focus: #3d6fb0; --wash: #00000010;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app {
  height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#selchip button { background: var(--wash); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 48px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--row-hover); }
.row.sel { background: var(--row-sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 18px; color: var(--mute); font-size: 12.5px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; flex: none; }
#detail .t span { color: var(--mute); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#detail .to { margin-top: 2px; font-size: 12px; color: var(--fg); }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; min-width: 0; }
#stops li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stops li.nx { color: var(--fg); }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: min(320px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--wash); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--hover); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--wash); color: var(--fg); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 120px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--ctl); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: var(--hover); }
#themebtn { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line-2); background: var(--ctl); color: var(--mute); cursor: pointer; padding: 0; }
#themebtn:hover { color: var(--fg); background: var(--hover); }
#tip {
  position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px;
  color: var(--fg); max-width: 260px; z-index: 5; box-shadow: 0 6px 24px var(--shadow); transform: translate(12px, 14px);
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #themebtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--seg); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(0px, env(safe-area-inset-left, 0px)); }
  #head { padding: 10px 16px 6px; }
  .row { padding: 6px 16px; grid-template-columns: 54px 1fr; }
  .row .to { font-size: 14px; }
  #detail { padding: 8px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  #clock { font-size: 24px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 30px; }
  .seg { margin-left: auto; }
  .seg button { padding: 7px 11px; }
  #legend { bottom: 8px; }
  #sublegend { max-width: calc(100% - 110px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <div id="mapwrap">
    <canvas id="base"></canvas>
    <canvas id="live"></canvas>
    <div id="zoomc"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Reset view">&#8962;</button></div>
    <div id="sublegend" hidden></div>
    <button id="themebtn" aria-label="Switch to light theme" title="Theme"></button>
    <div id="legend"></div>
    <div id="tip" hidden></div>
    <div id="loading">Loading schedule&hellip;</div>
  </div>
  <aside id="side">
    <div id="head"><span id="count">0</span><span class="lbl">running</span><span class="tag">Scheduled</span><div id="selchip" hidden></div></div>

    <div id="hist" aria-label="Service over the day. Drag to change time."><canvas></canvas></div>
    <div class="seg" id="days" role="group" aria-label="Day type">
      <button data-d="wkd">Wkd</button><button data-d="sat">Sat</button><button data-d="sun">Sun</button>
    </div>
  </div>
</div>

$('themebtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('uta-theme', theme); } catch (e) {} applyTheme(); };

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.12, Math.min(s0 * 80, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2);
$('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
const UI = '#zoomc,#legend,#sublegend,#themebtn';
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    const o = ptrs.get(e.pointerId), dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2) { const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch0) zoomAt(d / pinch0, (a[0][0] + a[1][0]) / 2 - r.left, (a[0][1] + a[1][1]) / 2 - r.top); pinch0 = d; }
    else { userMoved = true; view.cx -= dx / view.s; view.cy -= dy / view.s; baseDirty = true; }
    return;
  }
  if (e.pointerType === 'touch' || e.target.closest(UI)) return;
  hit(px, py);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  shapes.forEach((s, si) => {
    const gi = shapeGroup.get(si); if (!lineSel && fd(gi)) return; if (lineSel && !inSel(shapeRoutes.get(si))) return;
    for (let i = 1; i < s.n; i++) {
      const ax = SX(s.X[i - 1]), ay = SY(s.Y[i - 1]), bx = SX(s.X[i]), by = SY(s.Y[i]);
      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;
      if (d < bd - (GROUPS[gi].m === 'bus' ? 0 : 6)) { bd = d; best = si; }
    }
  });
  if (best === null) return null;
  return lineForRoute([...shapeRoutes.get(best)][0]);
}
function nearestVehicle(px, py, lim) {
  let best = null, bd = lim;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  return best;
}
function hit(px, py) {
  const best = nearestVehicle(px, py, 100); hoverStation = null;
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = rOf(best), nxs = best.nx < best.p.st.length ? ' · next ' + esc(shortName(stById[best.p.st[best.nx]].n)) : '';
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(headOf(best)) + '</div><div class="s">' + esc(r.n) + nxs + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { hoverStation = sb; wrap.style.cursor = 'pointer'; tip.innerHTML = stationTip(sb); }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(px, W - tw - 24)) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {
  const names = [...new Set(s.routes.map((r) => GROUPS[routes[r].g].m === 'bus' ? routes[r].s : routes[r].n))].slice(0, 6).join(' · ');
  const tags = [s.term ? 'Terminal' : '', s.xfer ? 'Transfer' : ''].filter(Boolean).join(' · ');
  return '<div><b>' + esc(s.n) + '</b></div><div class="s">' + esc(names) + '</div>' + (tags ? '<div class="s">' + tags + '</div>' : '');
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, best = nearestVehicle(px, py, 196);
    if (best) select(best.k);
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') { t = (t + 600) % 86400; } else if (e.key === 'ArrowLeft') { t = (t + 86400 - 600) % 86400; }
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles(); drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  applyTheme(); resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => resize()).observe(wrap);
  new ResizeObserver(() => resizeHist()).observe(hist);
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
</script>
