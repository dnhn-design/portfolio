<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LIRR Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed map canvas, thin scrubbing timeline pinned top, one row of route chips pinned bottom. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --fg:#0f1923; --muted:#667380; --line:#d3d9df; --bar:#c4ccd4; --bar-on:#0f1923;
  --shadow:0 8px 28px rgba(15,25,35,.16);
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117; --surface:#161d25; --fg:#e9eef3; --muted:#7f8c99; --line:#27323d; --bar:#2c3844; --bar-on:#e9eef3;
    --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#161d25; --fg:#e9eef3; --muted:#7f8c99; --line:#27323d; --bar:#2c3844; --bar-on:#e9eef3;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;position:relative;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#stage{position:absolute;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}#map.hit{cursor:pointer}

.top,.bottom{position:absolute;left:0;right:0;z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.top{top:0;padding-top:10px;padding-bottom:10px;
  background:linear-gradient(var(--bg) 55%,transparent)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:14px;height:14px;fill:currentColor}
.clock{font-weight:700;font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;min-width:96px;white-space:nowrap}
.clock small{font-weight:400;font-size:12px;color:var(--muted);margin-left:3px}
.speed{font-weight:700;font-size:12px;color:var(--muted);min-width:34px;text-align:left;font-variant-numeric:tabular-nums}
.speed:hover{color:var(--fg)}
#track{flex:1 1 220px;min-width:0;height:34px;display:block;touch-action:none;cursor:ew-resize;order:0}
.days{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.days button{font-size:12px;font-weight:400;color:var(--muted);padding:6px 10px;border-radius:8px}
.days button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
@media (max-width:640px){
  #track{order:5;flex-basis:100%}
  .clock{font-size:18px}
}

.bottom{bottom:0;padding-top:14px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 45%)}
.chips{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:6px;padding:2px 0}
.chip{min-width:0;height:28px;border-radius:10px;font-weight:700;font-size:11px;letter-spacing:0;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:opacity .15s,transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip.off{opacity:.28}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}

#side{position:absolute;z-index:6;right:0;top:50%;transform:translateY(-50%);width:38px;height:68px;border-radius:14px 0 0 14px;
  display:grid;place-items:center;box-shadow:var(--shadow);padding-right:env(safe-area-inset-right,0px)}
#side[hidden]{display:none}
#side svg,.ph svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
#panel{position:absolute;z-index:7;right:max(12px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 24px));
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 28px));visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
#panel.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;flex:none}
.ph b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph span{font-size:13px;font-variant-numeric:tabular-nums}
.ph button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18);flex:none}
.ph svg{width:14px;height:14px}
#plist{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overscroll-behavior:contain}
.empty{padding:22px 16px;color:var(--muted);font-size:12px}
.tr{border-radius:12px}
.tr.open{background:var(--bg)}
.trb{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:11px;row-gap:1px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;align-items:center}
.trb:hover{background:var(--bg)}
.trb>i{grid-row:1/3;width:10px;height:10px;border-radius:3px;display:block}
.trb b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trb span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.det{display:none;padding:4px 14px 14px 31px;font-size:12px}
.tr.open .det{display:block}
.ft{display:flex;justify-content:space-between;gap:12px}
.ft>div{min-width:0;display:grid;gap:1px}
.ft .r{text-align:right}
.ft b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft span{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin:12px 4px 10px}
.bar u{position:absolute;left:0;top:0;bottom:0;border-radius:3px;text-decoration:none}
.bar i{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--surface);border:1.5px solid var(--muted);box-sizing:border-box}
.bar i.on{background:var(--fg);border-color:var(--fg)}
.left{color:var(--muted);font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 14px 12px;min-width:196px;max-width:260px;font-size:12px;opacity:0;transform:translateY(4px);
  transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.dots{display:flex;gap:4px;margin:7px 0 10px;flex-wrap:wrap}
.dots i{width:14px;height:6px;border-radius:3px;display:block}
.stat{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;color:var(--muted)}
.stat b{font-size:22px;color:var(--fg);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.next{display:grid;gap:5px}
.next div{display:flex;align-items:center;gap:8px;min-width:0}
.next i{width:8px;height:8px;border-radius:3px;flex:none}
.next b{font-variant-numeric:tabular-nums;flex:none;min-width:58px}
.next span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<div id="stage"><canvas id="map" aria-label="LIRR map"></canvas></div>

<div class="top"><div class="top-in">
  <button class="play" id="play" aria-label="Play"></button>
  <div class="clock" id="clock"></div>
  <button class="speed" id="speed" aria-label="Speed"></button>
  <canvas id="track" role="slider" tabindex="0" aria-label="Time of day"></canvas>
  <div class="days" id="days">
    <button data-d="0">Wkd</button><button data-d="1">Sat</button><button data-d="2">Sun</button>
  </div>
</div></div>

<div class="bottom"><div class="chips" id="chips"></div></div>
<button id="side" hidden aria-label="Trains on this line"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>

  <div class="empty" id="pempty" hidden>No trains running</div>
  <div id="plist"></div>
</aside>

    tctx.globalAlpha=x+bw<=x0?.55:1;
    const w=Math.max(1,bw-1.2), r=Math.min(1.5,w/2);
    rr(tctx,x,th-4-h,w,h,r);tctx.fill();
  }
  tctx.globalAlpha=1;
  tctx.fillStyle=C.fg;tctx.fillRect(Math.round(x0)-1,2,2,th-4);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,0);c.arcTo(x,y+h,x,y,0);c.arcTo(x,y,x+w,y,r);c.closePath();}
function sizeTrack(){
  const r=trk.getBoundingClientRect();tw=Math.max(40,r.width);dpr=window.devicePixelRatio||1;
  trk.width=tw*dpr;trk.height=th*dpr;tctx.setTransform(dpr,0,0,dpr,0,0);drawTrack();
}
function scrub(e){
  const r=trk.getBoundingClientRect();
  t=Math.max(0,Math.min(TMAX,(e.clientX-r.left)/r.width*TMAX));dirty=true;frame();
}
let scrubbing=false;
trk.addEventListener('pointerdown',e=>{scrubbing=true;trk.setPointerCapture(e.pointerId);scrub(e);});
trk.addEventListener('pointermove',e=>{if(scrubbing)scrub(e);});
trk.addEventListener('pointerup',()=>{scrubbing=false;});
trk.addEventListener('pointercancel',()=>{scrubbing=false;});
trk.addEventListener('keydown',e=>{
  const st=e.shiftKey?30:5;
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){t=Math.min(TMAX,t+st);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){t=Math.max(0,t-st);}
  else if(e.key==='Home'){t=0;}else if(e.key==='End'){t=TMAX;}else return;
  e.preventDefault();dirty=true;frame();
});
addEventListener('keydown',e=>{if(e.code==='Space'&&!/BUTTON|CANVAS/.test(document.activeElement.tagName)){e.preventDefault();$('play').click();}});

/* ---------- map ---------- */
function sx(wx){return cx0+(wx-view.vx)*view.s;}
function sy(wy){return cy0-(wy-view.vy)*view.s;}
let cy0=0, cx0=0, topPad=70, botPad=58;
function fitView(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  shapes.forEach(s=>{for(let i=0;i<s.n;i++){x0=Math.min(x0,s.wx[i]);x1=Math.max(x1,s.wx[i]);y0=Math.min(y0,s.wy[i]);y1=Math.max(y1,s.wy[i]);}});
  const tr=$('track').getBoundingClientRect(), top=document.querySelector('.top').getBoundingClientRect().height;
  topPad=top+6;botPad=document.querySelector('.bottom').getBoundingClientRect().height+4;
  const rp=panelOpen&&W>=760?352:0, aw=W-48-rp, ah=H-topPad-botPad;
  cx0=24+aw/2;
  panel.style.top=topPad+'px';panel.style.bottom=botPad+'px';
  fit=Math.min(aw/(x1-x0),ah/(y1-y0));
  view={vx:(x0+x1)/2,vy:(y0+y1)/2,s:fit};
  cy0=topPad+ah/2;
}
function refit(){const was=Math.abs(view.s/fit-1)<1e-6,o={...view};fitView();if(!was)view=o;}
function layoutChips(){
  const el=$('chips'), w=el.clientWidth, n=chipEls.length, gap=6, minW=96;
  const per=Math.max(1,Math.floor((w+gap)/(minW+gap))), rows=Math.ceil(n/per);
  el.style.setProperty('--cols',Math.ceil(n/rows));
}
function resize(){
  layoutChips();
  const r=$('stage').getBoundingClientRect();W=r.width;H=r.height;dpr=window.devicePixelRatio||1;
  map.width=W*dpr;map.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const keep=view.s/fit, c=(view.vx), d=(view.vy);
  const wasFit=!fit||Math.abs(keep-1)<1e-6;
  const old={...view,fit};
  fitView();
  if(!wasFit&&old.fit){view.s=fit*keep;view.vx=old.vx;view.vy=old.vy;}
  sizeTrack();dirty=true;
}
function trainPos(tr,tm){
  const st=tr.st, n=st.length;
  if(tm<st[0].d||tm>st[n-1].a)return null;
  let arc;
  if(tm>=st[n-1].a)arc=st[n-1].arc;
  else{
    arc=st[0].arc;
    for(let i=0;i<n;i++){
      const p=st[i];
      if(tm<=p.d){arc=p.arc;break;}
      const q=st[i+1];
      if(tm<q.a){const f=(tm-p.d)/Math.max(1e-6,q.a-p.d);arc=p.arc+(q.arc-p.arc)*f;break;}
      if(tm<=q.d){arc=q.arc;break;}
    }
  }
  const sh=shapes[tr.sh];
  if(arc>=sh.cum[sh.n-1])return [sh.wx[sh.n-1],sh.wy[sh.n-1]];
  let lo=0,hi=sh.n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(sh.cum[m]<=arc)lo=m;else hi=m;}
  const sg=sh.cum[hi]-sh.cum[lo], f=sg>0?(arc-sh.cum[lo])/sg:0;
  return [sh.wx[lo]+(sh.wx[hi]-sh.wx[lo])*f, sh.wy[lo]+(sh.wy[hi]-sh.wy[lo])*f];
}
const lit=r=>focus.size===0||focus.has(r);
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';
  const z=view.s/fit;
  // lines: dim first, lit on top
  for(const pass of [0,1]){
    shapes.forEach(s=>{
      if(lit(s.r)!==(pass===1))return;
      ctx.beginPath();
      for(let i=0;i<s.n;i++){const x=sx(s.wx[i]),y=sy(s.wy[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.strokeStyle=routes[s.r].col;ctx.globalAlpha=pass?0.85:0.14;ctx.lineWidth=pass?2.4:1.8;ctx.stroke();
    });
  }
  ctx.globalAlpha=1;
  // stations
  ctx.font='400 10.5px '+getComputedStyle(document.body).fontFamily;ctx.textBaseline='middle';
  stops.forEach((s,i)=>{
    const x=sx(s.wx),y=sy(s.wy);
    if(x<-20||x>W+20||y<-20||y>H+20)return;
    const on=focus.size===0||s.rs.some(r=>focus.has(r));
    const r=(s.hub?4.2:2.8)+Math.min(2,Math.log2(Math.max(1,z))*.5);
    ctx.globalAlpha=on?1:.25;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=C.bg;ctx.fill();
    ctx.lineWidth=i===hover||i===sel?2.4:1.4;ctx.strokeStyle=i===hover||i===sel?C.fg:C.muted;ctx.stroke();
    if(on&&((s.hub&&z>=2.2)||z>=7||i===hover||i===sel)){
      ctx.fillStyle=C.fg;ctx.strokeStyle=C.bg;ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText(s.name,x+r+5,y);ctx.fillText(s.name,x+r+5,y);
    }
  });
  ctx.globalAlpha=1;
  // trains
  counts.fill(0);hits=[];
  const tr=days[day].trips, rad=3.6+Math.min(2.4,Math.log2(Math.max(1,z))*.6), dim=selTrain>=0?.3:1;
  const trail=(T,x,y,steps,step,al,w)=>{
    ctx.beginPath();
    for(let j=steps;j>=1;j--){const q=trainPos(T,Math.max(T.t0,t-j*step));if(!q)continue;const qx=sx(q[0]),qy=sy(q[1]);j===steps?ctx.moveTo(qx,qy):ctx.lineTo(qx,qy);}
    ctx.lineTo(x,y);ctx.strokeStyle=routes[T.r].col;ctx.globalAlpha=al;ctx.lineWidth=w;ctx.stroke();ctx.globalAlpha=1;
  };
  for(let k=0;k<tr.length;k++){
    const T=tr[k];
    if(t<T.t0||t>T.t1)continue;
    counts[T.r]++;
    if(!lit(T.r))continue;
    const p=trainPos(T,t);if(!p)continue;
    const x=sx(p[0]),y=sy(p[1]);
    if(x<-30||x>W+30||y<-30||y>H+30)continue;
    hits.push([x,y,k]);
    if(k===selTrain)continue;
    if(t-T.t0>0.2)trail(T,x,y,4,0.4,.4*dim,rad*1.5);
    ctx.globalAlpha=dim;
    ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fillStyle=routes[T.r].col;ctx.fill();
    ctx.lineWidth=1.6;ctx.strokeStyle=C.bg;ctx.stroke();ctx.globalAlpha=1;
  }
  if(selTrain>=0){
    const T=tr[selTrain], h=hits.find(a=>a[2]===selTrain);
    if(T&&h){
      const x=h[0],y=h[1],col=routes[T.r].col,ph=reduce?0:(performance.now()%1600)/1600;
      if(t-T.t0>0.2)trail(T,x,y,8,0.5,.55,rad*2);
      if(!reduce){ctx.beginPath();ctx.arc(x,y,rad*1.7+ph*rad*3.2,0,7);ctx.strokeStyle=col;ctx.globalAlpha=.6*(1-ph);ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;}
      ctx.beginPath();ctx.arc(x,y,rad*1.9,0,7);ctx.strokeStyle=C.fg;ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,rad*1.3,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.bg;ctx.stroke();
      ctx.font='700 11.5px '+getComputedStyle(document.body).fontFamily;ctx.textBaseline='middle';
      ctx.fillStyle=C.fg;ctx.strokeStyle=C.bg;ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(D.heads[T.h],x+rad*2.9,y);ctx.fillText(D.heads[T.h],x+rad*2.9,y);
    }
  }
}

/* ---------- loop ---------- */
let last=0, raf=0;
function frame(ts){
  if(raf)return;
  raf=requestAnimationFrame(tick);
}
function tick(ts){
  raf=0;
  if(playing){
    if(last){t+=(ts-last)/1000*SPEEDS[spd]/60;if(t>=TMAX)t=0;}
    last=ts;dirty=true;
  }else last=0;
  const pulse=selTrain>=0&&!reduce;if(pulse)dirty=true;
  if(dirty){
    dirty=false;setClock();draw();drawTrack();if(sel>=0)placeTip(sel,lastPt);
    if(panelOpen){const n=performance.now();if(panelDirty||!playing||n-lastPanel>300){renderPanel();lastPanel=n;panelDirty=false;}}
  }
  if(playing||pulse)raf=requestAnimationFrame(tick);
}

/* ---------- interaction ---------- */
let lastPt={x:0,y:0}, drag=null;
function nearest(x,y){
  let b=-1,bd=14*14;
  stops.forEach((s,i)=>{
    if(focus.size&&!s.rs.some(r=>focus.has(r)))return;
    const dx=sx(s.wx)-x,dy=sy(s.wy)-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i;}
  });
  return b;
}
function tipHTML(i){
  const s=stops[i], dep=days[day].dep[i];
  const nx=[];for(const e of dep){if(e[0]>=t&&!e[3]){nx.push(e);if(nx.length===3)break;}}
  const f=m=>fmt(m).join(' ');
  return '<h3>'+s.name+'</h3><div class="dots">'+s.rs.map(r=>'<i style="background:'+routes[r].col+'"></i>').join('')+'</div>'
   +'<div class="stat"><b>'+dep.length+'</b><span>trains</span></div>'
   +'<div class="next">'+(nx.length?nx.map(e=>'<div><i style="background:'+routes[e[1]].col+'"></i><b>'+f(e[0])+'</b><span>'+D.heads[e[2]]+'</span></div>').join(''):'<div><span>–</span></div>')+'</div>';
}
let tipFor=-1;
function placeTip(i,pt){
  if(tipFor!==i||playing){tip.innerHTML=tipHTML(i);tipFor=i;}
  const r=tip.getBoundingClientRect(), s=stops[i];
  let x=sx(s.wx)+16, y=sy(s.wy)-r.height/2;
  if(x+r.width>innerWidth-8)x=sx(s.wx)-16-r.width;
  y=Math.max(topPad,Math.min(innerHeight-botPad-r.height,y));
  tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px';tip.classList.add('on');
}
function hideTip(){tip.classList.remove('on');tipFor=-1;}
map.addEventListener('pointerdown',e=>{
  map.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,vx:view.vx,vy:view.vy,moved:false};
});
map.addEventListener('pointermove',e=>{
  lastPt={x:e.clientX,y:e.clientY};
  if(drag){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;map.classList.add('drag');}
    if(drag.moved){view.vx=drag.vx-dx/view.s;view.vy=drag.vy+dy/view.s;hover=-1;hideTip();sel=-1;dirty=true;frame();}
    return;
  }
  if(e.pointerType==='touch')return;
  const h=nearest(e.clientX,e.clientY);
  if(h!==hover){hover=h;dirty=true;
    if(h>=0){sel=h;placeTip(h,lastPt);}else{sel=-1;hideTip();}
    frame();}
  map.classList.toggle('hit',h>=0||pickTrain(e.clientX,e.clientY)>=0);
});
map.addEventListener('pointerup',e=>{
  const d=drag;drag=null;map.classList.remove('drag');
  if(d&&!d.moved){
    const k=pickTrain(e.clientX,e.clientY);
    if(k>=0){clickTrain(k);return;}
  }
  if(d&&!d.moved&&e.pointerType==='touch'){
    const h=nearest(e.clientX,e.clientY);hover=h;sel=h;
    if(h>=0)placeTip(h,lastPt);else hideTip();dirty=true;frame();
  }
});
map.addEventListener('pointerleave',e=>{if(!drag&&e.pointerType!=='touch'){hover=-1;sel=-1;hideTip();dirty=true;frame();}});
map.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0016), ns=Math.max(fit*.8,Math.min(fit*60,view.s*f));
  const wx=view.vx+(e.clientX-cx0)/view.s, wy=view.vy+(cy0-e.clientY)/view.s;
  view.s=ns;view.vx=wx-(e.clientX-cx0)/ns;view.vy=wy-(cy0-e.clientY)/ns;
  hover=-1;sel=-1;hideTip();dirty=true;frame();
},{passive:false});
map.addEventListener('dblclick',()=>{fitView();hideTip();dirty=true;frame();});

/* ---------- route panel ---------- */
const panel=$('panel'), plist=$('plist'), side=$('side'), rowEls=new Map();
const f12=m=>fmt(m).join(' ');
function pickTrain(x,y){
  let b=-1,bd=13*13;
  for(const h of hits){const dx=h[0]-x,dy=h[1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=h[2];}}
  return b;
}
function clearRows(){rowEls.clear();plist.innerHTML='';}
function setSelRoute(i){
  selRoute=i;focus.clear();if(i>=0)focus.add(i);
  selTrain=-1;clearRows();if(i<0)panelOpen=false;
  syncChips();syncPanel();dirty=true;frame();
}
function syncPanel(){
  const r=selRoute>=0?routes[selRoute]:null;
  side.hidden=!(r&&!panelOpen);
  if(r){
    side.style.background=r.col;side.style.color=r.txt;
    $('phead').style.background=r.col;$('phead').style.color=r.txt;$('pname').textContent=r.name;
  }
  panel.classList.toggle('open',panelOpen);panel.setAttribute('aria-hidden',String(!panelOpen));
  if(panelOpen!==lastOpen){lastOpen=panelOpen;refit();}
  panelDirty=true;dirty=true;frame();
}
side.onclick=()=>{panelOpen=true;syncPanel();};
$('pclose').onclick=()=>{panelOpen=false;syncPanel();};
addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(selTrain>=0){selectTrain(-1);}else if(panelOpen){panelOpen=false;syncPanel();}
});
function selectTrain(k){
  selTrain=k;panelDirty=true;dirty=true;
  if(panelOpen){renderPanel();const el=rowEls.get(k);if(el)el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
  frame();
}
function clickTrain(k){
  const T=days[day].trips[k];
  if(selRoute!==T.r)setSelRoute(T.r);
  const again=selTrain===k&&panelOpen;
  panelOpen=true;syncPanel();selectTrain(again?-1:k);
}
plist.addEventListener('click',e=>{
  const row=e.target.closest('.tr');if(!row)return;
  const k=+row.dataset.k;selectTrain(selTrain===k?-1:k);
});
function makeRow(k){
  const T=days[day].trips[k], st=T.st, col=routes[T.r].col, span=Math.max(1,T.t1-T.t0);
  const el=document.createElement('div');el.className='tr';el.dataset.k=k;
  el.innerHTML='<button class="trb" aria-expanded="false"><i style="background:'+col+'"></i><b></b><span></span></button>'
   +'<div class="det"><div class="ft"><div><b></b><span></span></div><div class="r"><b></b><span></span></div></div>'
   +'<div class="bar"><u style="background:'+col+'"></u>'+st.map(p=>'<i style="left:'+((p.a-T.t0)/span*100).toFixed(2)+'%"></i>').join('')+'</div>'
   +'<div class="left"></div></div>';
  const q=x=>el.querySelector(x), fb=el.querySelectorAll('.ft b'), fs=el.querySelectorAll('.ft span');
  q('.trb b').textContent=D.heads[T.h];
  fb[0].textContent=stops[st[0].s].name;fs[0].textContent=f12(T.t0);
  fb[1].textContent=stops[st[st.length-1].s].name;fs[1].textContent=f12(T.t1);
  el._r={sub:q('.trb span'),btn:q('.trb'),fill:q('.bar u'),dots:el.querySelectorAll('.bar i'),left:q('.left'),sub0:'',left0:''};
  return el;
}
function updateRow(el,k){
  const T=days[day].trips[k], st=T.st, n=st.length, R=el._r;
  let sub;
  if(t<T.t0)sub='Departs '+f12(T.t0);
  else if(t>T.t1)sub='Arrived';
  else{
    sub='';
    for(let i=0;i<n;i++){
      if(t<st[i].a){sub='Next '+stops[st[i].s].name+' \u00b7 '+f12(st[i].a);break;}
      if(t<=st[i].d){sub=i===n-1?'Arrived':'At '+stops[st[i].s].name;break;}
    }
  }
  if(sub!==R.sub0){R.sub.textContent=sub;R.sub0=sub;}
  const open=k===selTrain;
  if(el.classList.contains('open')!==open){el.classList.toggle('open',open);R.btn.setAttribute('aria-expanded',String(open));}
  if(open){
    const pc=Math.max(0,Math.min(1,(t-T.t0)/Math.max(1,T.t1-T.t0)));
    R.fill.style.width=(pc*100).toFixed(2)+'%';
    let left=0;R.dots.forEach((d,i)=>{const on=t>=st[i].a;d.classList.toggle('on',on);if(!on)left++;});
    const lt=t<T.t0?'':t>T.t1?'':left+(left===1?' stop left':' stops left');
    if(lt!==R.left0){R.left.textContent=lt;R.left0=lt;}
  }
}
function renderPanel(){
  if(!panelOpen||selRoute<0)return;
  const trips=days[day].trips, act=[];
  for(let k=0;k<trips.length;k++){const T=trips[k];if(T.r===selRoute&&t>=T.t0&&t<=T.t1)act.push(k);}
  act.sort((a,b)=>trips[a].t0-trips[b].t0||a-b);
  let ids=act;
  if(selTrain>=0&&trips[selTrain].r===selRoute&&!act.includes(selTrain))ids=[selTrain,...act];
  $('pcount').textContent=act.length;
  $('pempty').hidden=ids.length>0;
  const keep=new Set(ids);
  for(const [k,el] of rowEls)if(!keep.has(k)){el.remove();rowEls.delete(k);}
  let prev=null;
  for(const k of ids){
    let el=rowEls.get(k);
    if(!el){el=makeRow(k);rowEls.set(k,el);}
    const want=prev?prev.nextSibling:plist.firstChild;
    if(el!==want)plist.insertBefore(el,want);
    prev=el;updateRow(el,k);
  }
}

new ResizeObserver(()=>{resize();frame();}).observe($('stage'));
addEventListener('resize',()=>{resize();frame();});
syncPlay();syncSpeed();syncDays();syncChips();resize();frame();
})();
</script>
