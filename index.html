<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transit-pedia</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.dataset.theme=t;
try{var sbs=localStorage.getItem('sb');if(sbs!=='0'&&innerWidth>900)document.documentElement.classList.add('sb-open')}catch(e){if(innerWidth>900)document.documentElement.classList.add('sb-open')}
var H=document.documentElement,rm=matchMedia('(prefers-reduced-motion: reduce)').matches,sp=!location.hash.slice(1);
if(!rm)H.classList.add('intro');
if(sp)H.classList.add('splash');
window.__splash=new Promise(function(res){window.__splashGo=function(){res();if(!rm)setTimeout(function(){H.classList.remove('intro')},9000)};if(!sp)window.__splashGo()});})();
</script>
<style>
#splash{position:fixed;inset:0;z-index:9999;--sc:0,0,0;--sf:255,255,255;background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(var(--sc),.97) 0%,rgba(var(--sc),.93) 40%,rgba(var(--sc),.78) 100%);color:rgb(var(--sf));display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;cursor:pointer;font-family:Inter,system-ui,sans-serif;transition:opacity 1.4s ease}
html.splash #splash{display:flex}
html[data-theme=light] #splash{--sc:255,255,255;--sf:17,17,17}
#splash.out{opacity:0;pointer-events:none}
#splash p{margin:0;opacity:0;animation:spIn 1.6s ease forwards}
#splash .s1{font-size:clamp(22px,3.4vw,40px);font-weight:500;letter-spacing:-.01em}
#splash .s2{font-size:clamp(13px,1.3vw,16px);color:rgba(var(--sf),.55);animation-delay:1.9s}
@keyframes spIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash p{animation:none;opacity:1}#splash{transition:none}}
[data-theme=light]{color-scheme:light;--bg:#f7f6f2;--ink:#15171a;--muted:#5b616a;--hover:#ebe9e2;--state:#d3d0c5;--accent:#0a58ca;--live:#0a6b3d;--pop:#ffffff;--panel:#fbfaf7;--line:#e3e0d6}
[data-theme=dark]{color-scheme:dark;--bg:#0d1015;--ink:#eceff4;--muted:#9aa4b2;--hover:#1d242d;--state:#2b3440;--accent:#6cb6ff;--live:#5fd394;--pop:#171c23;--panel:#0f141b;--line:#1a212b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 14px/1.35 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

header{position:fixed;top:0;left:0;right:0;height:56px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-left));background:var(--bg)}
.brand{font-weight:600;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:6px}
#about{position:fixed;top:58px;right:max(16px,env(safe-area-inset-right));z-index:6;width:min(290px,calc(100vw - 32px));padding:14px 16px;background:var(--pop);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.22);font-size:13px;line-height:1.45}
#about[hidden]{display:none}
#about b{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
#about p{margin:0;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon:hover{background:var(--hover)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[data-theme=light] .moon,[data-theme=dark] .sun{display:none}

/* collapsible list of live maps (same shape as the roster inside each map) */
html.sb-open{--sbw:clamp(240px,18vw,300px)}
html #mapwrap,html #kids,html #cards{right:var(--sbw,0px)}
html #mapwrap{transition:opacity .3s,right .4s cubic-bezier(.2,.8,.2,1)}
html #kids,html #cards{transition:right .4s cubic-bezier(.2,.8,.2,1)}
/* the roster looks like the panel inside each live map: big count, flat full-width rows, a thin line on the left */
#sb{position:fixed;top:56px;right:0;bottom:0;width:clamp(240px,18vw,300px);z-index:4;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s,background-color .3s}
html.sb-open #sb{transform:none;visibility:visible;transition-delay:0s}
body.live #sb,html.sb-open body.live #sb{transform:translateX(100%);visibility:hidden}
.sbd{margin:0;padding:14px 18px 0;font-size:12.5px;color:var(--muted)}
.sbh{padding:14px 18px 8px;display:flex;align-items:baseline;gap:8px}
.sbh b{font-size:28px;line-height:1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sbh span{color:var(--muted);font-size:12.5px}
#sblist{overflow:auto;padding:0 0 12px;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sbr{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 18px;border-left:2px solid transparent;font-weight:500;font-size:13px;letter-spacing:-.005em}
.sbr:hover,.sbr.hl{background:var(--hover);color:var(--live);border-left-color:var(--live)}
.sbr i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;transition:background-color .2s,transform .2s}
.sbr.ca i{background:#e4572e}
.sbr.in{padding-left:34px}
.sbr.in i{background:var(--live)}
.sbr:hover i,.sbr.hl i{background:var(--live);transform:scale(1.35)}
.sbr .nm small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px;transition:color .2s}
.sbr:hover .nm small,.sbr.hl .nm small{color:inherit;opacity:.8}
.sbx{width:100%;text-align:left;font:inherit}
.sbx svg{margin-left:auto;width:12px;height:12px;flex:none;color:var(--muted);transition:transform .2s}
.sbx[aria-expanded=true] svg{transform:rotate(180deg)}
.sbsub[hidden]{display:none}
.sbg{display:block;width:100%;text-align:left;margin-top:8px;padding:9px 18px 5px;border-left:2px solid transparent;font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
button.sbg:hover,button.sbg.hl{color:var(--live)}
.pin.hl .dot,.pin:hover .dot{fill:var(--live)}
.pin.hl .dot{r:15}
@media (max-width:700px){html.sb-open{--sbw:0px}#sb{width:min(320px,86vw);box-shadow:-12px 0 40px rgba(0,0,0,.2)}}
/* theme changes fade instead of snapping */
.nation,.states{transition:stroke .3s}
#plabels text{transition:opacity .1s,fill .3s,stroke .3s}
#menu,#stlabel,#tip,.card,.row,.sbr,.sbg{transition-property:background-color,color,box-shadow,opacity,scale,translate,rotate,transform}
#menu,.card,#tip{transition-duration:.3s}

#mapwrap{position:fixed;left:0;right:0;top:56px;bottom:0;display:flex;align-items:center;overflow:auto}
#usmap{flex:none;width:100%;height:100%;display:block}
.nation{fill:none;stroke:var(--ink);stroke-width:2.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.states{fill:none;stroke:var(--state);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pin{cursor:pointer}
.pin .dot{fill:var(--accent);stroke:var(--bg);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:r .15s,scale .6s cubic-bezier(.3,1.6,.5,1) var(--pd,0s),fill .3s,stroke .3s}
.pin.ca .dot,.pin.ca .ring{fill:#e4572e;stroke-opacity:1}
.pin.ca .ring{fill:none;stroke:#e4572e}
.pin .ring{fill:none;stroke:var(--accent);stroke-width:2.5}
#plabels text{font:600 17px 'Inter',system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .1s}
#plabels text.on{opacity:1;fill:var(--live);transition:opacity .15s .3s}
.pin.ca.hl .dot,.pin.ca:hover .dot{fill:var(--live)}
.pin:hover .dot,.pin[aria-pressed=true] .dot{r:13}
.pin:focus{outline:none}
.pin:focus-visible .dot{stroke:var(--ink)}

/* menu: drops from the top bar (docks left when the map zooms) */
#menu{position:fixed;z-index:4;top:56px;left:50%;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:var(--pop);border-radius:14px;padding:12px 8px 8px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
#menu[hidden]{display:none}
#menu.side{left:16px;transform:none;width:min(440px,calc(100vw - 32px))}
#menu h2{margin:0 0 6px;padding:0 10px;font-size:18px;font-weight:600;letter-spacing:-.01em}
#menu ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
#menu.side ul{grid-template-columns:repeat(3,minmax(0,1fr))}
#menu ul+ul{margin-top:8px}
.row{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:10px;font-weight:500;font-size:12px;line-height:1.25;text-align:center}
.row:hover{background:var(--hover)}
.row .ic{aspect-ratio:1/1;width:100%;border-radius:8px;flex:none;overflow:hidden;background:var(--hover);display:grid;place-items:center}
.row .ic img{width:100%;height:100%;object-fit:cover;display:block}
.row .ic i{width:14px;height:14px;border-radius:50%;background:var(--live)}
.row .ic.lv{aspect-ratio:2.4/1}
.row .ic.pdf{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
#menu.side.right{left:auto;right:16px}
#menu.stack{width:min(360px,calc(100vw - 24px))}
@media (max-width:520px){#menu ul,#menu.side ul{grid-template-columns:repeat(3,minmax(0,1fr))}#menu.side{left:12px;right:12px;width:auto;max-height:42vh}}
#menu ul.stack{grid-template-columns:1fr;gap:2px}
#menu ul.stack+ul.stack{margin-top:18px}
.stack .row{flex-direction:row;align-items:center;gap:12px;text-align:left;font-size:14px;padding:6px 10px}
.stack .row .ic,.stack .row .ic.lv{width:48px;aspect-ratio:1/1}

/* zoomed view: hub + separate dots for items tied to a specific place */
#kids,#cards{position:fixed;left:0;right:0;top:56px;bottom:0;z-index:2;pointer-events:none}
.hub,.kid{--s:30px;position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;pointer-events:auto;display:block;background:var(--accent)}
.hub{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent);opacity:0;transition:opacity .3s}
#kids.out .hub{opacity:1}
.kid{box-shadow:0 0 0 3px var(--bg);transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1) var(--d,0s),opacity .3s var(--d,0s)}
.kid.lv{background:var(--live)}
#kids.out .kid{transform:none;opacity:1}
#kids.settled .kid{transition-delay:0s}
#kids.out .kid:hover,#kids.out .kid:focus-visible{transform:scale(1.3)}
@media (max-width:520px){.hub,.kid{--s:26px}}
/* outline card: swings out from under the dot, overshoots slightly, settles; reverses on close */
.card{--cw:150px;--rot:-4deg;position:absolute;width:var(--cw);padding:8px;border-radius:14px;pointer-events:auto;
  transform:translateX(-50%);transform-origin:50% 0;
  translate:0 -26px;rotate:var(--rot);scale:.9;opacity:0;
  transition:translate .75s cubic-bezier(.3,1.5,.5,1),rotate .9s cubic-bezier(.3,1.7,.5,1),scale .6s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.card.in{translate:0 0;rotate:0deg;scale:1;opacity:1}
.card.up{transform:translateX(-50%) translateY(-100%);transform-origin:50% 100%;translate:0 26px}
.card.up.in{translate:0 0}
.card.leaving{translate:0 -18px;rotate:calc(var(--rot) * -.8);scale:.92;opacity:0;pointer-events:none;transition:translate .35s ease-in,rotate .35s ease-in,scale .35s ease-in,opacity .3s ease-in}
.card.up.leaving{translate:0 18px}
/* the panel is a pseudo-element so fare cards (negative z-index) can sit behind it and peek out */
.card::before,#tip::before{content:'';position:absolute;inset:0;z-index:0;background:var(--pop);border-radius:inherit;transition:box-shadow .3s,background-color .3s}
.card::before{box-shadow:0 10px 36px rgba(0,0,0,.2)}
a.card:hover::before{box-shadow:0 12px 40px rgba(0,0,0,.3)}
.card img.ol{position:relative;z-index:1;display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
/* small fare cards on the edge of the card nearest the dot (in front of it, fanned from a corner); text-only tips keep them tucked behind the panel instead */
.fares{position:absolute;inset:0;z-index:2;pointer-events:none}
.fares img{position:absolute;display:block;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.38);opacity:0;
  transform:translateY(var(--sl)) rotate(0deg);
  transition:transform .8s cubic-bezier(.3,1.5,.5,1) calc(.28s + var(--i) * .07s),opacity .2s calc(.28s + var(--i) * .07s)}
.card.in .fares img,#tip.fin .fares img{transform:translateY(0) rotate(var(--r));opacity:1}
.fares.behind{z-index:auto}
.fares.behind img{z-index:-1;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.3);transform-origin:50% 0}
.fares.behind.up img{transform-origin:50% 100%}
[data-theme=dark] img.ol{filter:invert(1)}
@media (max-width:520px){.card{--cw:118px}}
#tip{position:fixed;z-index:6;pointer-events:none;color:var(--ink);border-radius:10px;padding:6px;font-weight:500;font-size:12px;text-align:center;max-width:170px}
#tip[hidden]{display:none}
#tip:not([hidden]){animation:tipin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes tipin{from{opacity:0;translate:0 -12px;rotate:-4deg}to{opacity:1;translate:0 0;rotate:0deg}}
#tip.ol-only{padding:6px}
#tip::before{box-shadow:0 8px 28px rgba(0,0,0,.25)}
#tip.ol-only>img{margin-bottom:0}
#tip>img{position:relative;z-index:1;display:block;width:150px;height:150px;object-fit:cover;border-radius:6px;margin-bottom:6px}
#tip>img.ol{object-fit:contain;padding:4px}
#tip>span{position:relative;z-index:1;display:block;padding:0 4px 2px}
body.fan .pin,body.fan #plabels{opacity:0;pointer-events:none;transition:opacity .15s}
.pin{transition:opacity .3s var(--pd,0s)}
/* Amtrak stations: driven by a small animation loop (twinkle that eases out, then a quiet resting state that reacts to the cursor) */
#stn{pointer-events:none;transition:opacity .4s;fill:color-mix(in srgb,var(--accent) calc(var(--a,0) * 100%),var(--ink))}
body.fan #stn{opacity:0}
#stlabel{position:fixed;left:0;top:0;z-index:7;pointer-events:none;white-space:nowrap;padding:5px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-weight:600;font-size:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);transform-origin:50% 0;opacity:0;scale:.15;transition:opacity .4s ease .05s,scale .7s cubic-bezier(.25,1.45,.45,1)}
#stlabel.on{transition-delay:0s,0s}
#stlabel.on{opacity:1;scale:1}
html.intro .pin,html.intro #plabels{opacity:0;pointer-events:none}
html.intro .pin .dot{scale:0}
#mapwrap{transition:opacity .3s}

/* live maps open inside the page: the camera zooms into the city, then the map fades in over it */
html[data-theme=light] #liveFrame{background:#edf0f5}
#liveFrame{position:fixed;z-index:3;top:56px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 56px);border:0;background:#0c1016;
  opacity:0;visibility:hidden;scale:1.06;transition:opacity .55s ease,scale .9s cubic-bezier(.2,.8,.2,1),visibility 0s .55s}
#liveFrame.show{opacity:1;visibility:visible;scale:1;transition:opacity .55s ease,scale .9s cubic-bezier(.2,.8,.2,1),visibility 0s}
body.live-done #mapwrap{visibility:hidden}
.b-home{display:inline-flex;align-items:center;gap:9px}
.b-logo{width:24px;height:24px;border-radius:2px;display:block}
.b-txt{position:relative;top:0;line-height:1}
.b-back{display:none}
body.live .b-home{display:none!important}
body.live .b-back{display:inline}
body.live .brand{cursor:pointer}
#kids.away{opacity:0;transition:opacity .3s}
@media (max-width:700px){.pin .dot{r:13}.pin:hover .dot,.pin[aria-pressed=true] .dot{r:16}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== fare cards: a fan of cards tucked in the bottom-left corner of the home view; click it to deal them out over a backdrop ===== */
#fc{--fg:var(--ink);--shadow:rgba(20,24,40,.28);--shadow-soft:rgba(20,24,40,.14);position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .3s,visibility 0s,z-index 0s .45s}
[data-theme=dark] #fc{--shadow:rgba(0,0,0,.65);--shadow-soft:rgba(0,0,0,.4)}
#fc.open{z-index:20;pointer-events:auto;transition:opacity .3s,visibility 0s,z-index 0s}
.fcbg{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .45s}
#fc.open .fcbg{opacity:.97}
body.live #fc{opacity:0;visibility:hidden;pointer-events:none}
.fcard{position:absolute;left:0;top:0;border-radius:21px;transform-style:preserve-3d;will-change:transform;pointer-events:auto;
  box-shadow:0 1px 2px var(--shadow-soft),0 10px 26px -8px var(--shadow);cursor:pointer;outline:none;user-select:none;-webkit-user-select:none}
.fcard img{position:absolute;left:0;top:0;display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fcard img.back{transform:rotateY(180deg)}
.fcard:focus-visible{box-shadow:0 0 0 3px var(--ink),0 10px 26px -8px var(--shadow)}
.fcard.dead{pointer-events:none}
.flbl{position:absolute;left:0;top:0;width:200px;margin-left:-100px;text-align:center;font-size:12px;letter-spacing:.05em;color:var(--muted);opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
.flbl.on{opacity:1}
#fcap{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center;font-size:13px;letter-spacing:.04em;color:var(--ink);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#fcap.on{opacity:1}
#fcap small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="splash" role="button" tabindex="0" aria-label="Explore the Transit systems of the US. Click anywhere to dive in."><p class="s1">Explore the Transit systems of the US</p><p class="s2">Click anywhere to dive in</p></div>
<script>(function(){var sp=document.getElementById('splash'),done=false;function go(){if(done)return;done=true;sp.classList.add('out');window.__splashGo&&window.__splashGo();setTimeout(function(){document.documentElement.classList.remove('splash')},1500)}sp.addEventListener('click',go);sp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});sp.focus&&sp.focus()})();</script>
<header>
  <a class="brand" href="./"><span class="b-home"><img class="b-logo" src="icon.png" alt="" width="24" height="24"><span class="b-txt">Transit-pedia</span></span><span class="b-back">&larr; Back to Main</span></a>
  <div class="tools">
    <button type="button" class="icon" id="aboutBtn" aria-label="About Transit-pedia" aria-expanded="false" aria-controls="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 17h.01"/></svg></button>
    <button type="button" class="icon" id="sbBtn" aria-label="Show or hide the list of live maps" aria-expanded="false" aria-controls="sb"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    <button type="button" class="icon" id="themeBtn" aria-label="Toggle light / dark">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
  </div>

function setVB(v){ if(!(v[2]>0&&v[3]>0)) return; vb=v; svg.setAttribute('viewBox',v.join(' ')); }
function flyTo(to,done,o={}){
  cancelAnimationFrame(anim);
  const from=vb.slice(), t0=performance.now(), D=reduce?0:(o.D||650);
  const ease=o.inout?(p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2):(p=>1-Math.pow(1-p,3));
  const step=now=>{const p=D?Math.min(1,(now-t0)/D):1, e=ease(p);
    setVB(from.map((f,i)=>f+(to[i]-f)*e));
    if(o.onProgress) o.onProgress(p);
    if(p<1) anim=requestAnimationFrame(step); else if(done) done();};
  anim=requestAnimationFrame(step);
}
/* zoomed view that keeps the hub clear of the menu: right of it on desktop, below it on phones */
function zoomTarget(pt){
  const r=wrap.getBoundingClientRect(), mob=r.width<=520, w=r.width/(mob?11:18), h=w*r.height/r.width;
  const ax=mob?.38:.62, ay=mob?.8:.6;
  return [pt[0]-ax*w, pt[1]-ay*h, w, h];
}
/* the svg letterboxes its viewBox (xMidYMid meet): scale = the smaller ratio, and the leftover space is split evenly */
const mapScale=(v,r=wrap.getBoundingClientRect())=>Math.min(r.width/v[2],r.height/v[3]);
const toScreen=(p,v)=>{const r=wrap.getBoundingClientRect(),s=mapScale(v,r);return [(r.width-v[2]*s)/2+(p[0]-v[0])*s,(r.height-v[3]*s)/2+(p[1]-v[1])*s]};

function showTip(a,it){
  clearTimeout(tipT);
  tipT=setTimeout(()=>{
    tip.replaceChildren(); if(it.outline) tip.append(el('img',{class:'ol',src:OUTLINE(it.outline),alt:''})); else if(it.img) tip.append(el('img',{src:THUMB(it.img),alt:''}));
    if(!it.outline) tip.append(el('span',{text:it.t})); tip.classList.toggle('ol-only',!!it.outline); tip.classList.remove('fin'); tip.hidden=false;
    const r=a.getBoundingClientRect(), below=r.top<230||!!it.outline;
    if(it.s&&FARE_ID[it.s]){ tip.append(fareStack(FARE_ID[it.s],150,!below,it.outline?162:30,it.outline?'front':'behind','l')); requestAnimationFrame(()=>requestAnimationFrame(()=>tip.classList.add('fin'))); }
    tip.style.left=Math.min(Math.max(r.left+r.width/2,90),innerWidth-90)+'px';
    tip.style.top=(below?r.bottom+10:r.top-10)+'px';
    tip.style.transform=below?'translate(-50%,0)':'translate(-50%,-100%)';
  },200);
}

function hideCard(){
  cards.querySelectorAll('.card:not(.leaving)').forEach(c=>{c.classList.remove('in');c.classList.add('leaving');setTimeout(()=>c.remove(),450)});
}
/* the card hangs below its dot, or above it when there is no room below; the gap from the dot's edge is the same either way */
const CARD_GAP=14, DOT_R=13;
function showCard(r,v){
  if(!r.card) return;
  const [x,y]=toScreen(r.pt,v), rect=wrap.getBoundingClientRect();
  const only=r.live.length===1?LIVE(r.live[0].s):null;
  const c=el(only?'a':'div',{class:'card'},[el('img',{class:'ol',src:OUTLINE(r.card),alt:only?r.name+' live map':r.name})]);
  if(only){c.href=only;c.target='_blank';c.rel='noopener';c.addEventListener('click',e=>go(e,r.live[0].s))}
  c.style.setProperty('--rot',((Math.random()<.5?-1:1)*(3+Math.random()*2.5)).toFixed(1)+'deg');
  const mob=rect.width<=520, cw=mob?118:150, gap=DOT_R*mapScale(v,rect)+CARD_GAP, up=y+gap+cw+16+10>rect.height;
  c.style.left=Math.min(Math.max(x,cw/2+8),rect.width-cw/2-8)+'px';
  c.style.top=(up?y-gap:y+gap)+'px'; if(up) c.classList.add('up');
  if(FARE_ID[r.id]) c.append(fareStack(FARE_ID[r.id],cw,up,cw+16,'front',r.anchor==='start'?'l':'r'));
  cards.append(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('in')));
}
/* separate dots for place-specific items, splitting out of the main dot */
function splitOut(r,v){
  kids.replaceChildren();
  const [hx,hy]=toScreen(r.pt,v);
  const hub=el('button',{type:'button',class:'hub','aria-label':'Close '+r.name});
  hub.style.left=hx+'px'; hub.style.top=hy+'px'; hub.addEventListener('click',close); kids.append(hub);
  r.sub.forEach((it,i)=>{
    const [x,y]=toScreen(it.pt,v);
    const a=el('a',{class:'kid'+(it.s?' lv':''),href:hrefOf(it),target:'_blank',rel:'noopener','aria-label':it.t});
    if(it.s) a.addEventListener('click',e=>go(e,it.s));
    a.style.left=x+'px'; a.style.top=y+'px';
    a.style.setProperty('--fx',(hx-x)+'px'); a.style.setProperty('--fy',(hy-y)+'px'); a.style.setProperty('--d',(i*80)+'ms');
    const tipItem={t:it.t,outline:it.outline,img:it.img,s:it.s};
    a.addEventListener('mouseenter',()=>showTip(a,tipItem)); a.addEventListener('focus',()=>showTip(a,tipItem));
    a.addEventListener('mouseleave',hideTip); a.addEventListener('blur',hideTip);
    kids.append(a);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{kids.classList.add('out');setTimeout(()=>kids.classList.add('settled'),1200)}));
}

/* ===== live maps inside the page =====
   Enter: hide the city UI, set the iframe loading, zoom the camera into the place, and fade the map in near the end of the zoom.
   Leave: fade it out, unload it, and zoom back to the city view you came from. Nothing loads until you enter a map. */
function liveTarget(pt){
  const r=wrap.getBoundingClientRect(), w=r.width/(r.width<=520?14:28), h=w*r.height/r.width;
  return [pt[0]-w/2, pt[1]-h/2, w, h];
}
function go(e,slug){                      // plain clicks open in-page; modified clicks keep the normal link behavior
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;
  e.preventDefault(); hideTip(); const m=LIVEMETA[slug]; openLive(slug,m.pt,m.ret);
}
function openLive(slug,pt,ret,instant){
  if(live) return;
  live={slug,ret};
  const body=document.body; body.classList.add('live','fan');
  hideCard(); menu.hidden=true; hideTip(); kids.classList.add('away');
  try{ history[instant?'replaceState':'pushState']({live:slug},'','#'+slug); }catch(e){}
  let shown=false, loaded=false, p=pt&&!instant?0:1;
  const show=()=>{ if(shown||!live||live.slug!==slug||!loaded||p<.7) return; shown=true;
    frame.classList.add('show'); setTimeout(()=>{ if(live&&live.slug===slug) body.classList.add('live-done'); },instant?0:900); };
  if(frame) frame.remove();
  frame=document.createElement('iframe'); frame.id='liveFrame'; frame.title=LIVEMETA[slug].t;
  frame.onload=()=>{ loaded=true; show(); sendLiveSb(); $('#sbBtn').setAttribute('aria-expanded',String(liveSb));
    try{ frame.contentWindow.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!e.defaultPrevented) exitLive(); }); frame.contentWindow.focus(); }catch(err){} };   // Esc works even when the map has keyboard focus
  frame.src=LIVE(slug); document.body.append(frame);
  if(pt&&!instant) flyTo(liveTarget(pt),()=>{p=1;show()},{D:1150,inout:true,onProgress:q=>{p=q;if(q>=.7)show()}});
}

/* ===== Amtrak stations =====
   Startup: all stations twinkle until the page has loaded, then the twinkle eases out over ~2.4s into tiny quiet dots
   and the city dots pop in. Afterwards the dots grow as the cursor nears them, and a label with a little
   pendulum physics hangs under the cursor when it is on a station. One rAF loop drives all of it and sleeps when idle. */
(function stations(){
  const root=document.documentElement, g=$('#stn'), lab=$('#stlabel');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const R0=1.1, RP=2.6, BASE=.3;                 // resting radius (svg units), twinkle radius, resting opacity

  STN.forEach(([x,y],i)=>{const c=sv('circle',{cx:x,cy:y,r:R0,opacity:BASE}); g.append(c); els.push(c); ph[i]=Math.random(); per[i]=.7+Math.random()*.7;});

  let intro=root.classList.contains('intro'), A=intro?1:0, tRel=0, revealed=!intro, raf=0, hot=new Set();
  const order=[...Object.values(pins)].sort((a,b)=>+a.dataset.x-+b.dataset.x);
  if(intro){
    order.forEach((p,i)=>p.style.setProperty('--pd',(i*.07).toFixed(2)+'s'));
    const loaded=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r));
    const fonts=document.fonts?document.fonts.ready:Promise.resolve();
    Promise.all([loaded,fonts,window.__splash,new Promise(r=>setTimeout(r,1700))]).then(()=>{tRel=performance.now();wake();});
  }

  /* cursor + label state */
  const M={x:0,y:0,in:false}, L={x:0,y:0,vx:0,ang:0,av:0,w:0,sel:-1,shown:false,hideAt:0,home:[0,0]};
  const idle=()=>document.body.classList.contains('fan')||document.body.classList.contains('live');
  addEventListener('pointermove',e=>{
    M.x=e.clientX; M.y=e.clientY;
    const t=e.target; M.in = !idle() && t && t.closest && !!t.closest('#usmap') && !t.closest('.pin');
    wake();
  },{passive:true});
  document.addEventListener('pointerleave',()=>{M.in=false;wake()});
  addEventListener('blur',()=>{M.in=false;wake()});

  function tick(now){
    raf=0; let more=false;
    /* twinkle amplitude: 1 while loading, then a smooth cosine ease to 0 */
    if(intro){
      if(tRel){ const u=Math.min(1,(now-tRel)/2400); A=(1+Math.cos(Math.PI*u))/2;
        if(!revealed && now-tRel>700){ revealed=true; root.classList.remove('intro'); setTimeout(()=>order.forEach(p=>p.style.removeProperty('--pd')),1500); }
        if(u>=1){ intro=false; A=0; } }
      more=true; g.style.setProperty('--a',A.toFixed(3));
    }
    /* cursor proximity (screen px) */
    const m=svg.getScreenCTM(), sc=m?m.a:1, RANGE=95, HIT=11;
    let best=-1, bd=1e9;
    for(let i=0;i<n;i++){
      let target=0;
      if(M.in&&m){ const dx=STN[i][0]*m.a+m.e-M.x, dy=STN[i][1]*m.d+m.f-M.y, d=Math.hypot(dx,dy);
        if(d<RANGE){ const f=1-d/RANGE; target=f*f; }
        if(d<HIT&&d<bd){bd=d;best=i;} }
      const prev=k[i]; k[i]+=(target-prev)*(reduce?1:.16);
      const active=k[i]>.004||target>0;
      if(intro||active||hot.has(i)){
        if(!active) k[i]=0;
        const p=.5+.5*Math.sin(2*Math.PI*(now/1000/per[i]+ph[i]));
        const pulse=intro?p*A:0, b=BASE*(1-A);
        els[i].setAttribute('r',((R0+(RP-R0)*pulse)*(1+2.4*k[i])).toFixed(2));
        els[i].setAttribute('opacity',Math.min(1,b+(1-b)*pulse+.5*k[i]).toFixed(3));
        if(active) {hot.add(i);more=true;} else hot.delete(i);
      }
    }
    /* label: grows out of the station it belongs to, hangs under the cursor like a pendulum, and shrinks back into its station */
    const sel=M.in?best:-1;
    if(sel!==L.sel){
      const was=L.sel; L.sel=sel;
      if(sel>=0){
        lab.textContent=STN[sel][2]; L.w=lab.offsetWidth;
        const hx=STN[sel][0]*m.a+m.e, hy=STN[sel][1]*m.d+m.f; L.home=[hx,hy];
        if(!L.shown){ L.x=hx; L.y=hy; L.vx=0; L.ang=0; L.av=0; }          // start exactly on the station
        L.shown=true; L.hideAt=0; lab.classList.add('on');
        if(!reduce) L.av+=(Math.random()<.5?-1:1)*(3+Math.random()*4);   // small random kick so the angle differs every time
      } else if(was>=0){ lab.classList.remove('on'); L.hideAt=now; }
    }
    if(L.shown){
      const live=L.sel>=0, lerp=reduce?1:(live?.2:.3);
      const tx=live?Math.min(Math.max(M.x,L.w/2+8),innerWidth-L.w/2-8):L.home[0], ty=live?M.y+18:L.home[1];
      const nx=L.x+(tx-L.x)*lerp; L.vx=nx-L.x; L.x=nx; L.y+=(ty-L.y)*lerp;
      if(!reduce){                       // angular spring toward a lean opposite the motion, with damping and overshoot
        const lean=Math.max(-24,Math.min(24,-L.vx*1.1));

        L.ang+=L.av;
      } else { L.ang=0; L.av=0; }
      lab.style.left=(L.x-L.w/2).toFixed(1)+'px'; lab.style.top=L.y.toFixed(1)+'px';   // position via left/top: the pop-in scale must not scale the offset
      lab.style.transform='rotate('+L.ang.toFixed(2)+'deg)';
      if(live) more=true;
      else if(now-L.hideAt>800){ L.shown=false; L.hideAt=0; } else more=true;
    }
    if(more) raf=requestAnimationFrame(tick);
  }
  function wake(){ if(!raf) raf=requestAnimationFrame(tick); }
  wake();
})();

  var top=(vh-best.rows*best.ch)/2;
  piles.forEach(function(p,i){
    var row=Math.floor(i/best.cols), inRow=Math.min(best.cols,n-row*best.cols), col=i%best.cols;
    var x0=(vw-inRow*best.cw)/2;
    p.x=x0+best.cw*(col+.5); p.y=top+best.ch*row+best.L*.63/2+4;
  });
  layout=best;
}
function pileCardTarget(o,p,i,hov){
  var L=layout.L, d=Math.min(i,4), s=(o.portrait?L*.72:L)/B;
  var jx=(((o.seed*13)%1)-.5)*L*.05, jr=(((o.seed*29)%1)-.5)*7;
  var x=p.x+d*L*.012+jx*(i?1:.2), y=p.y-d*L*.016, r=(i?jr:jr*.3);
  if(hov&&i===0){y-=L*.06;r+=-1.5}
  if(hov&&i>0){r+=i%2?2:-2}
  return {x:x,y:y,r:r,sc:s,o:i>5?0:1};
}
function applyPiles(delayBase){
  computeLayout();
  piles.forEach(function(p,pi){
    var hov=hoverPile===p;
    p.order.forEach(function(id,i){var o=cards[id];
      var t=pileCardTarget(o,p,i,hov); setZ(o,100+pi*40+(40-i));
      set(o,t,delayBase?delayBase+pi*38+i*14:0); o.el.classList.toggle('dead',i!==0); o.el.tabIndex=i===0?0:-1;
    });
    var lt=p.y+layout.L*.63/2+22; p.lbl.style.transform='translate('+p.x+'px,'+lt+'px)';
    p.lbl.textContent=p.name;
    setTimeout(function(){if(state==='piles')p.lbl.classList.add('on')},delayBase?delayBase+pi*38+250:0);
  });
  cap.classList.remove('on');
}

function viewGeom(){
  var land=Math.min(vw-40,500,vh*.5/.63), port=Math.min(vh*.5,(vw-40)/.63,500);
  return {land:land,port:port,cx:vw/2,cy:vh*.46};
}
// loose spread of one pile's cards
var spread=null;
function computeSpread(p){
  var n=p.home.length, aw=vw-32, ah=vh*.74, best=null;
  for(var L=210;L>=44;L-=4){
    var cw=L*1.1, ch=L*.74, cols=Math.max(1,Math.floor(aw/cw)), rows=Math.ceil(n/cols);
    cols=Math.min(cols,n); rows=Math.ceil(n/cols);
    if(rows*ch<=ah){best={L:L,cw:cw,ch:ch,cols:cols,rows:rows};break}
  }
  if(!best){var L2=44;best={L:L2,cw:L2*1.1,ch:L2*.74,cols:Math.max(1,Math.min(n,Math.floor(aw/(L2*1.1)))),rows:0};best.rows=Math.ceil(n/best.cols)}
  // balance rows so the last row isn't a lone card
  var per=Math.ceil(n/best.rows); best.cols=per;
  var top=vh*.47-best.rows*best.ch/2+best.ch/2, pos={};
  p.home.forEach(function(id,i){
    var o=cards[id],row=Math.floor(i/per),inRow=Math.min(per,n-row*per),col=i%per;
    var x0=(vw-inRow*best.cw)/2+best.cw/2;
    var jx=(((o.seed*13)%1)-.5)*best.L*.07, jy=(((o.seed*31)%1)-.5)*best.L*.06, jr=(((o.seed*29)%1)-.5)*8;
    pos[id]={x:x0+col*best.cw+jx,y:top+row*best.ch+jy,r:jr,sc:(o.portrait?best.L*.72:best.L)/B,o:1};
  });
  spread=best; spread.pos=pos; spread.bottom=top+(best.rows-1)*best.ch+best.ch/2;
}
function applySpread(delayBase){
  var p=cur; computeSpread(p);
  piles.forEach(function(q){
    q.lbl.classList.remove('on');
    if(q===p)return;
    q.order.forEach(function(id){var o=cards[id];set(o,{x:q.x,y:q.y+8,r:o.t.r,sc:o.t.sc*.8,o:0});o.el.classList.add('dead')});
  });
  p.home.forEach(function(id,i){var o=cards[id];
    var t=Object.assign({},spread.pos[id]);
    if(hoverCard===id){t.y-=spread.L*.05;t.sc*=1.07;t.r*=.3}
    setZ(o,500+(hoverCard===id?50:i)); set(o,t,delayBase?delayBase+i*35:0); o.el.classList.remove('dead'); o.el.tabIndex=0;
  });
  showCap(hoverCard?cards[hoverCard].name:p.name, spread.bottom+spread.ch*.5+8, null);
}
function applyView(){
  var p=cur, g=viewGeom(), sel=cards[selId];
  if(p.home.length>1){
    computeSpread(p);
    p.home.forEach(function(id){var o=cards[id]; if(id===selId)return;
      var t=Object.assign({},spread.pos[id]);t.o=.12;t.sc*=.92;set(o,t);setZ(o,500);o.el.classList.remove('dead')});
  }else{
    piles.forEach(function(q){q.lbl.classList.remove('on');if(q===p)return;
      q.order.forEach(function(id){var o=cards[id];set(o,{x:q.x,y:q.y+8,r:o.t.r,sc:o.t.sc*.8,o:0});o.el.classList.add('dead')})});
  }
  piles.forEach(function(q){q.lbl.classList.remove('on')});
  var L=sel.portrait?g.port:g.land;
  set(sel,{x:g.cx,y:g.cy,r:0,sc:L/B,o:1,fy:flipped?180:0}); setZ(sel,900); sel.el.classList.remove('dead');
  var H=sel.portrait?g.port:g.land*.63;
  showCap(sel.name+'', g.cy+H/2+26, p.home.length>1?(p.home.indexOf(selId)+1)+' / '+p.home.length:null);
}
function showCap(text,top,sub){
  cap.classList.remove('on');
  clearTimeout(showCap.t);
  showCap.t=setTimeout(function(){
    cap.style.top=top+'px'; cap.innerHTML=text+(sub?'<small>'+sub+'</small>':''); cap.classList.add('on');
  },90);
}
function step2(dir){
  if(state!=='view'||cur.home.length<2)return;
  var i=cur.home.indexOf(selId); flipped=false; selId=cur.home[(i+dir+cur.home.length)%cur.home.length]; applyView();
}

function toFan(){state='fan';sync();hoverPile=null;cur=null;applyFan(0);stage.style.cursor=''}
function toPiles(fromFan){state='piles';sync();cur=null;hoverCard=null;applyPiles(fromFan?30:0)}
function toSpread(p){state='spread';sync();cur=p;hoverPile=null;hoverCard=null;applySpread(20)}
function toView(p,id){flipped=false;state='view';sync();cur=p;hoverPile=null;selId=id;applyView()}
function openPile(p){ if(p.home.length>1)toSpread(p); else toView(p,p.home[0]) }
function back(){
  flipped=false;
  if(state==='view'){ if(cur.home.length>1){state='spread';selId=null;applySpread(0)} else toPiles(false) }
  else if(state==='spread')toPiles(false);
  else if(state==='piles')toFan();
}

// ---- events
stage.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('.fcard');
  if(!el){back();return}
  var o=el._c;
  if(state==='fan'){toPiles(true)}
  else if(state==='piles'){openPile(o.pile)}
  else if(state==='spread'){toView(cur,o.id)}
  else if(state==='view'){ if(o.id===selId){ if(o.back){flipped=!flipped;applyView()} else back() } else if(o.pile===cur){flipped=false;selId=o.id;applyView()} }
});
stage.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch')return;
  var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest&&el.closest('.fcard'), o=c&&c._c;
  if(state==='fan'){
    var h=(o&&o.fanIdx!==undefined)?o.fanIdx:-1;
    if(h!==hoverFan){hoverFan=h;applyFan(0);stage.style.cursor=h>=0?'pointer':''}
  }else if(state==='piles'){
    var hp=o?o.pile:null;
    if(hp!==hoverPile){hoverPile=hp;applyPiles(0);}
  }else if(state==='spread'){
    var hc=o?o.id:null;
    if(hc!==hoverCard){hoverCard=hc;applySpread(0)}
  }
});
stage.addEventListener('pointerout',function(e){
  if(state==='fan'&&hoverFan!==-1){var t=e.relatedTarget; if(!(t&&t.closest&&t.closest('.fcard'))){hoverFan=-1;applyFan(0)}}
});
stage.addEventListener('pointerleave',function(){
  if(state==='fan'&&hoverFan!==-1){hoverFan=-1;applyFan(0)}
  if(state==='piles'&&hoverPile){hoverPile=null;applyPiles(0)}
  if(state==='spread'&&hoverCard){hoverCard=null;applySpread(0)}
});
addEventListener('keydown',function(e){
  if(state==='fan'&&e.key!=='Enter')return;
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();back()}
  else if(e.key==='ArrowRight')step2(1);
  else if(e.key==='ArrowLeft')step2(-1);
  else if(e.key==='Enter'&&document.activeElement&&document.activeElement._c){document.activeElement.click()}
},true);
function resize(){
  vw=innerWidth;vh=innerHeight;
  if(state==='fan')applyFan(0); else if(state==='piles')applyPiles(0); else if(state==='spread')applySpread(0); else if(state==='view')applyView();
}
addEventListener('resize',resize);

// ---- boot: cards slide in from the corner
vw=innerWidth;vh=innerHeight;
(function(){
  var g=fanGeom();
  for(var id in cards){var o=cards[id];o.s={x:-g.L,y:vh+g.L*.4,r:-80,sc:g.L/B,o:0,fy:0};}
  applyFan(0);
  FAN.forEach(function(id,i){var o=cards[id];o.t=Object.assign({fy:0},fanTarget(o));setTimeout(function(){o.s.o=1;kick()},150+i*90);o.t.x=o.t.x;o.s.x=-g.L*.3+i*8;o.s.y=vh+g.L*.2;});
  kick();
})();
})();
</script>
</body>
