/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default with a light toggle. */
:root {

* { box-sizing:border-box; }
html,body { height:100%; }

#head { padding:14px 16px 8px; display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; flex:none; }

#selchip button:hover { color:var(--fg); }

.row { display:grid; grid-template-columns:44px minmax(0,1fr); gap:0 6px; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:4px 16px; cursor:pointer; align-items:baseline; border-left:2px solid transparent; }

.k-row { display:flex; align-items:center; gap:8px; }
.emph-l { color:var(--dim); font-size:10px; letter-spacing:.07em; text-transform:uppercase; flex:none; }

const PLAY='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>',PAUSE='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 2h2.8v10H3zM8.2 2H11v10H8.2z" fill="currentColor"/></svg>';
let lastMin=-1;window.addEventListener('clkmode',()=>{lastMin=-1});
__clk.live({tz:'America/Denver',get:()=>state.T,set:v=>{state.T=v;state.speed=1;$('speed').innerHTML='1&times;'},on:()=>state.play,spd:()=>state.speed===1});
function updateClock(){const m=Math.floor(state.T/60);if(m===lastMin)return;lastMin=m;$('clock').innerHTML=__clk.html(state.T,'America/Denver');drawHist();}
const hc=document.querySelector('#hist canvas'),hx=hc.getContext('2d');let HW=0,HH=0;
function drawHist(force){const box=$('hist'),r=box.getBoundingClientRect();if(force||r.width!==HW||r.height!==HH){HW=Math.round(r.width);HH=Math.round(r.height);hc.width=HW*dpr;hc.height=HH*dpr;hc.style.width=HW+'px';hc.style.height=HH+'px';}
  if(!HW)return;const c=hx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,HW,HH);const hs=D.hist[state.day],mxv=Math.max(...hs,1),bw=3,gap=1,nb=Math.floor(HW/(bw+gap)),per=1440/nb;const ph=Math.min(1,state.T/86400)*HW;
  const css=getComputedStyle(root);const hi=css.getPropertyValue('--fg').trim(),lo=css.getPropertyValue('--line-2').trim();
  for(let i=0;i<nb;i++){let s=0,n=0;for(let m=Math.floor(i*per);m<Math.floor((i+1)*per);m++){s+=hs[m];n++;}const v=n?s/n:0;const h=Math.max(2,Math.round((v/mxv)*(HH-8)));const x=i*(bw+gap);c.fillStyle=x+bw<=ph?hi:lo;c.globalAlpha=x+bw<=ph?.8:1;c.fillRect(x,HH-h-2,bw,h);}
  c.globalAlpha=1;c.fillStyle=hi;c.fillRect(Math.round(ph)-1,0,2,HH);
  c.font=`500 9px ${getComputedStyle(root).getPropertyValue('--sans')}`;c.fillStyle=css.getPropertyValue('--dim').trim();c.textBaseline='top';[[6,'6a'],[12,'12p'],[18,'6p']].forEach(([h,t])=>{const x=h/24*HW;c.fillText(t,x+3,0);});}
/* ---------- interaction ---------- */
function zoomAt(f,px,py){const nz=Math.max(fitZ*.6,Math.min(fitZ*70,view.z*f));f=nz/view.z;const wx=view.cx+(px-W/2)/view.z,wy=view.cy+(py-H/2)/view.z;view.z=nz;view.cx=wx-(px-W/2)/view.z;view.cy=wy-(py-H/2)/view.z;userMoved=true;viewVer++;dirty=true;}
const pts=new Map();let drag=null,pinch=null,moved=0;
liveC.addEventListener('pointerdown',e=>{liveC.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;
  if(pts.size===1)drag={x:e.offsetX,y:e.offsetY};else if(pts.size===2){const a=[...pts.values()];pinch={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};drag=null;}wrap.classList.add('drag');});
liveC.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)){const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);
    if(pts.size===2&&pinch){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);zoomAt(d/pinch.d,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);pinch.d=d;moved=9;}
    else if(drag&&pts.size===1){const dx=e.offsetX-prev[0],dy=e.offsetY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){view.cx-=dx/view.z;view.cy-=dy/view.z;userMoved=true;viewVer++;dirty=true;hideTip();}}}
  else hover(e.offsetX,e.offsetY,e);});
const up=e=>{const was=pts.size;pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){wrap.classList.remove('drag');if(drag&&moved<=4&&e.type==='pointerup')click(e.offsetX,e.offsetY);drag=null;}};
liveC.addEventListener('pointerup',up);liveC.addEventListener('pointercancel',up);
liveC.addEventListener('pointerleave',()=>{if(!pts.size){hideTip();setHov(null);}});
liveC.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)),e.offsetX,e.offsetY);},{passive:false});
liveC.addEventListener('dblclick',e=>{zoomAt(2,e.offsetX,e.offsetY);});
$('zin').onclick=()=>zoomAt(1.6,W/2,H/2);$('zout').onclick=()=>zoomAt(1/1.6,W/2,H/2);$('zfit').onclick=()=>{userMoved=false;fit();};
function hitVeh(x,y){let b=null,bd=12;live.forEach(v=>{const d=Math.hypot(v.x-x,v.y-y);if(d<bd){bd=d;b=v;}});return b;}
function hitStation(x,y){let b=null,bd=11;stLabels.forEach(s=>{const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;b=s;}});return b;}
function hitLine(x,y){let best=null,bd=7;const hl=hlSet();R.forEach((r,ri)=>{if(!inFocus(ri)||(hl&&!hl.has(ri)))return;(screenPts[ri]||[]).forEach(l=>{for(let i=0;i<l.X.length-1;i++){const ax=l.X[i],ay=l.Y[i],dx=l.X[i+1]-ax,dy=l.Y[i+1]-ay,L=dx*dx+dy*dy||1e-9;let u=((x-ax)*dx+(y-ay)*dy)/L;u=u<0?0:u>1?1:u;const d=Math.hypot(x-(ax+u*dx),y-(ay+u*dy))-(r.m==='brt'?.8:0);if(d<bd){bd=d;best=ri;}}});});return best;}
function setHov(t){if(state.hovT!==t){state.hovT=t;}}
function tipAt(x,y,html){const t=$('tip');t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;let l=x+14,tp=y+16;if(l+w>W-6)l=x-w-12;if(tp+h>H-6)tp=y-h-12;t.style.left=Math.max(4,l)+'px';t.style.top=Math.max(4,tp)+'px';}
function hideTip(){$('tip').hidden=true;}
function hover(x,y){if(pts.size)return;const v=hitVeh(x,y);
  if(v){setHov(v.ti);wrap.className='ptr';const tr=currentTrips()[v.ti],p=tr.p,vp=vehPos(tr,state.T);const nx=Math.min(p.n-1,Math.max(1,(vp?vp.i:0)+1));
    tipAt(x,y,`<b style="color:${R[tr.r].col}">${esc(R[tr.r].m==='brt'?R[tr.r].l:R[tr.r].s)}</b> to ${esc(p.h)}<div class="s">Next: ${esc(SMS[p.st[nx]].name)} · ${fmtT(tr.s+p.arr[nx])}</div>`);return;}
  setHov(null);const s=hitStation(x,y);
  if(s){wrap.className='ptr';const c=s.c;tipAt(x,y,`<b>${esc(c.name)}</b><div class="s">${[...c.routes].map(r=>esc(R[r].m==='brt'?R[r].l:R[r].s)).join(' · ')}</div><div class="s">${c.term.size?'Terminal · ':''}${c.xfer?'Transfer point · ':''}${D.meta.fare==='0'?'Fare $0.00':'Fare per ABQ RIDE'}</div>`);return;}
  const ln=hitLine(x,y);
  if(ln!=null){wrap.className='ptr';const n=currentTrips().filter(t=>t.r===ln).length,run=curRows.filter(v=>v.tr.r===ln).length;tipAt(x,y,`<b style="color:${R[ln].col}">${esc(rName(ln))}</b><div class="s">${n} scheduled trips · ${run} running now</div>`);return;}
  wrap.className='';hideTip();}
function click(x,y){const v=hitVeh(x,y);if(v){selectTrip(v.ti);return;}const ln=hitLine(x,y);
  if(ln!=null){const g=gOf[ln];selectGroup(g.id,g.rs.length>1?ln:null);return;}
  if(state.selT!=null){state.selT=null;dirty=true;}}
function selectTrip(ti){state.selT=state.selT===ti?null:ti;dirty=true;tripLblKey='';rosterKey='';$('detail').dataset.k='';}
function selectGroup(id,sub){if(state.hlG===id&&(state.hlSub===(sub??null)))clearHl();else{state.hlG=id;state.hlSub=sub??null;const g=G.find(x=>x.id===id);if(state.focus!=='all'&&g.m!==state.focus)state.focus='all';}dirty=true;viewVer++;buildKey();updateChip();}
function clearHl(){state.hlG=null;state.hlSub=null;dirty=true;buildKey();updateChip();}
$('list').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)selectTrip(+b.dataset.t);});
$('list').addEventListener('mouseover',e=>{const b=e.target.closest('.row');setHov(b?+b.dataset.t:null);});
$('list').addEventListener('mouseleave',()=>setHov(null));
$('detail').addEventListener('click',e=>{if(e.target.closest('[data-x]'))selectTrip(state.selT);});
$('selchip').addEventListener('click',e=>{if(e.target.closest('[data-clr]'))clearHl();});
$('sublegend').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.hlSub=b.dataset.sub===''?null:+b.dataset.sub;dirty=true;buildKey();updateChip();});
$('legend').addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){state.focus=f.dataset.f;if(state.hlG){const g=G.find(x=>x.id===state.hlG);if(state.focus!=='all'&&g.m!==state.focus)clearHl();}dirty=true;buildKey();return;}
  const g=e.target.closest('[data-g]');if(g){selectGroup(g.dataset.g,g.dataset.s!=null?+g.dataset.s:null);return;}
  if(e.target.closest('#keytog')){state.keyMin=!state.keyMin;$('legend').className=state.keyMin?'min':'';}});
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('abq-theme',theme)}catch(e){}applyTheme();drawHist(true);};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.selT!=null)selectTrip(state.selT);else if(state.hlG)clearHl();}else if(e.key===' '&&e.target===document.body){e.preventDefault();$('play').click();}});
/* transport */
function setPlay(p){state.play=p;$('play').innerHTML=p?PAUSE:PLAY;$('play').setAttribute('aria-label',p?'Pause':'Play');}
$('play').onclick=()=>setPlay(!state.play);
$('speed').onclick=()=>{state.speed=SPEEDS[(SPEEDS.indexOf(state.speed)+1)%SPEEDS.length];$('speed').innerHTML=state.speed+'&times;';};
function setDay(d){state.day=d;state.selT=null;lastMin=-1;rosterKey='';$('detail').dataset.k='';document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));dirty=true;}
$('days').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setDay(b.dataset.d);});
let scrub=false;const scrubTo=e=>{const r=$('hist').getBoundingClientRect();state.T=Math.max(0,Math.min(86399,(e.clientX-r.left)/r.width*86400));lastMin=-1;};
$('hist').addEventListener('pointerdown',e=>{scrub=true;$('hist').setPointerCapture(e.pointerId);scrubTo(e);});
$('hist').addEventListener('pointermove',e=>{if(scrub)scrubTo(e);});
['pointerup','pointercancel'].forEach(n=>$('hist').addEventListener(n,()=>{scrub=false;}));
/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(state.play&&!scrub)state.T=(state.T+dt*state.speed)%86400;
  updateClock();if(dirty)drawBase();drawLive();acc+=dt;if(acc>.15||rosterKey===''){acc=0;updateRoster();}updateDetail();requestAnimationFrame(frame);}
/* init */
applyTheme();setPlay(true);setDay(state.day);buildKey();resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;viewVer++;});
$('loading').remove();requestAnimationFrame(frame);
window.__abq={state,view,selectGroup,selectTrip,DAYS,R,fit};
})();
</script>
