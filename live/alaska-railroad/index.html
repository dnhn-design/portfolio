<title>Alaska Railroad Live Map</title>

<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38; --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017; --raise: #10161f; --raise2: #131b27; --card: #0c1017ee; --tipbg: #0f141cf2;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #ffffff; --line: #e1e6ee; --line-2: #ccd3de; --fg: #141a24; --mute: #5d6878; --dim: #8a94a4;
  --chip: #141a24; --chip-fg: #ffffff; --raise: #f3f6fa; --raise2: #e9eef5; --card: #ffffffee; --tipbg: #ffffffF2;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; } #mapwrap.hov { cursor: pointer; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; background: var(--c); }
#selchip button { margin-left: auto; background: var(--raise); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 56px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--raise); } .row.sel { background: var(--raise2); border-left-color: var(--c); }
.row:focus-visible, button:focus-visible { outline: 2px solid #5d7fa6; outline-offset: -1px; }
.row .no { font-size: 11.5px; color: var(--c); font-weight: 500; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 18px; color: var(--mute); font-size: 12.5px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--raise); padding: 10px 18px 9px; }
#detail .t { display: flex; gap: 8px; align-items: baseline; }
#detail .t b { font-weight: 600; font-size: 13.5px; } #detail .t span { color: var(--mute); font-size: 11.5px; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow-y: auto; scrollbar-width: thin; }
#stops li { display: grid; grid-template-columns: 66px 1fr; gap: 6px; font-size: 11.5px; color: var(--mute); }
#stops li.nx { color: var(--fg); } #stops li.gone { opacity: .45; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: min(250px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px; display: grid; gap: 1px; backdrop-filter: blur(6px); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--raise); }
#keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--card) !important; border: 1px solid var(--line-2) !important; border-radius: 8px !important; }
#keytog svg { transition: transform .2s; } #legend.min #keytog svg { transform: rotate(180deg); }
.k-b { display: flex; align-items: center; gap: 8px; padding: 5px 8px; text-align: left; white-space: nowrap; }
.k-b i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
.k-b.off { opacity: .45; } .k-b.act { background: var(--raise2); color: var(--fg); }
.k-b em { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--dim); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 130px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--card); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover, #themeb:hover { color: var(--fg); }
#themeb { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 8px; background: var(--card); border: 1px solid var(--line-2); color: var(--mute); cursor: pointer; display: grid; place-items: center; padding: 0; }
#tip { position: absolute; pointer-events: none; background: var(--tipbg); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; max-width: 260px; z-index: 5; box-shadow: 0 6px 24px #0006; transform: translate(12px, 14px); }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; min-width: 44px; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#segs { display: flex; gap: 10px; flex: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); } .seg button:not(.on):hover { color: var(--fg); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; } .row { padding: 7px 16px; grid-template-columns: 56px 1fr; } .row .to { font-size: 14.5px; } #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px) max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; } #clock { font-size: 28px; } #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; } #segs { order: 4; flex-basis: 100%; justify-content: space-between; } #speed { margin-left: auto; } .seg button { padding: 8px 10px; font-size: 13px; }
  #legend { bottom: 8px; } #sublegend { top: 50px; left: max(14px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 28px); }
}
</style>

document.querySelectorAll('#seasons button').forEach(b => b.onclick = () => { st.season = b.dataset.s; setDay(false); });
function setDay(first) { loadDay(); if (first) st.t = __nowSec('America/Anchorage'); if (st.hl >= 0 && !activeG.has(st.hl) && false) st.hl = -1; rosterKey = detailKey = ''; clockKey = ''; syncControls(); buildLegend(); dirty = true; }
$('themeb').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; ls.set('akrr-theme', theme); applyTheme(); clockKey = ''; dirty = true; };
$('list').addEventListener('click', e => { const b = e.target.closest('.row'); if (b) select(st.sel === +b.dataset.id ? null : +b.dataset.id); });

/* ---------- map interaction ---------- */
function zoomAt(px, py, f) { const k = Math.min(fitK * 900, Math.max(fitK * 0.6, view.k * f)), x = wx(px), y = wy(py); view.k = k; view.cx = x - (px - W / 2) / k; view.cy = y - (H / 2 - py) / k; userMoved = true; dirty = true; }
$('zin').onclick = () => zoomAt(W / 2, H / 2, 1.6); $('zout').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.6);
$('zfit').onclick = () => { userMoved = false; fit(); dirty = true; };
mapwrap.addEventListener('wheel', e => { e.preventDefault(); const r = mapwrap.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0016))); }, { passive: false });
mapwrap.addEventListener('dblclick', e => { const r = mapwrap.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 2); });
const ptrs = new Map(); let moved = 0, pinch0 = 0;
mapwrap.addEventListener('pointerdown', e => { if (e.target.closest('button,#legend,#sublegend')) return; mapwrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; pinch0 = 0; mapwrap.classList.add('drag'); });
mapwrap.addEventListener('pointermove', e => {
  const r = mapwrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (!ptrs.has(e.pointerId)) { hover(px, py, e); return; }
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, d / pinch0); pinch0 = d; moved = 99; return;
  }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 4) { view.cx -= dx / view.k; view.cy += dy / view.k; userMoved = true; dirty = true; hideTip(); }
});
function endPtr(e) {
  const was = ptrs.has(e.pointerId); ptrs.delete(e.pointerId); pinch0 = 0; if (!ptrs.size) mapwrap.classList.remove('drag');
  if (was && e.type === 'pointerup' && moved <= 4 && !ptrs.size) { const r = mapwrap.getBoundingClientRect(); clickAt(e.clientX - r.left, e.clientY - r.top); }
}
mapwrap.addEventListener('pointerup', endPtr); mapwrap.addEventListener('pointercancel', endPtr);
mapwrap.addEventListener('pointerleave', () => hideTip());
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (st.sel != null) select(null); else highlight(-1); } });

function hitVehicle(px, py) { let b = null, bd = 13; for (const q of vis) { const d = Math.hypot(q.x - px, q.y - py); if (d < bd && !dimmed(q.v.tr)) { bd = d; b = q; } } return b; }
function hitStation(px, py) { let b = null, bd = 10; for (const q of visSt) { const d = Math.hypot(q.x - px, q.y - py); if (d < bd) { bd = d; b = q; } } return b; }
function hitLine(px, py) {
  let best = null, bd = 9;
  for (let gi = 0; gi < D.groups.length; gi++) for (const sh of GSH[gi]) {
    const s = S[sh];
    for (let i = 0; i < s.n - 1; i++) {
      const ax = sx(s.X[i]), ay = sy(s.Y[i]), bx2 = sx(s.X[i + 1]), by = sy(s.Y[i + 1]);
      if (Math.max(ax, bx2) < px - bd || Math.min(ax, bx2) > px + bd || Math.max(ay, by) < py - bd || Math.min(ay, by) > py + bd) continue;
      const dx = bx2 - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)), d = Math.hypot(ax + dx * t - px, ay + dy * t - py) - (activeG.has(gi) ? 0.5 : 0) - (gi === st.hl ? 0.5 : 0);
      if (d < bd) { bd = d; best = gi; }
    }
  }
  return best;
}
function clickAt(px, py) {
  const v = hitVehicle(px, py); if (v) { select(v.v.tr.id === st.sel ? null : v.v.tr.id); return; }
  const g = hitLine(px, py); if (g != null) { highlight(g === st.hl ? -1 : g); return; }
  if (st.sel != null) select(null);
}
const tip = $('tip');
function hideTip() { tip.hidden = true; }
function showTip(html, px, py) { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth; tip.style.left = Math.min(px, W - w - 24) + 'px'; tip.style.top = py + 'px'; }
function hover(px, py) {
  const v = hitVehicle(px, py);
  if (v) { const tr = v.v.tr, p = tr.p, nx = Math.min(v.v.nx, p.s.length - 1); mapwrap.classList.add('hov'); showTip(`<b>${p.h}</b><div class="s">${tr.gn} &middot; ${p.sub}</div><div class="s">${v.v.mv ? 'Next' : 'At'}: ${ST[p.s[nx]].name} ${fmt(tr.s0 + p.a[nx])}</div>`, px, py); return; }
  const s = hitStation(px, py);
  if (s) { const so = ST[s.si]; mapwrap.classList.add('hov'); showTip(`<b>${so.name}</b><div class="s">${so.g.map(g => D.groups[g].n).join(', ')}</div>`, px, py); return; }
  const g = hitLine(px, py);
  if (g != null) { mapwrap.classList.add('hov'); showTip(`<b>${D.groups[g].n}</b><div class="s">${activeG.has(g) ? 'Runs on this day type' : 'No service on this day type'}</div>`, px, py); return; }
  mapwrap.classList.remove('hov'); hideTip();
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (st.playing && !scrubbing) { st.t += dt * SPEEDS[st.speed]; if (st.t >= 86400) st.t -= 86400; }
  if (dirty) { drawBase(); dirty = false; }
  const vs = running(); drawLive(vs); updateRoster(vs); updateDetail(vs); updateClock();
  requestAnimationFrame(frame);
}
applyTheme(); loadDay(); st.t = __nowSec('America/Anchorage'); syncControls(); buildLegend(); highlight(-1);
new ResizeObserver(resize).observe(mapwrap); window.addEventListener('resize', resize);
resize(); requestAnimationFrame(frame);
window.__akrr = { st, view, trips: () => trips, highlight, select, zoomAt, setDay: (s, d) => { st.season = s; st.day = d; setDay(true); }, fit: () => { userMoved = false; fit(); dirty = true; }, ST, sx, sy, mx, my };
})();
</script>
