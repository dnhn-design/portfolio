<meta charset="utf-8">
<title>Austin Live Map</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via the toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071; --chip: #e9edf3; --chip-fg: #0c1017;
  --row-hover: #10161f; --row-sel: #131b27; --detail: #0f151e; --glass: #0c1017ee; --glass-hov: #131a25;
  --focus: #5d7fa6; --tipbg: #0f141cf2; --soft: #ffffff10; --soft-2: #ffffff1c; --keytxt: #aab4c2;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f8fafc; --line: #dfe5ec; --line-2: #cdd6e0;
  --fg: #141c27; --mute: #566273; --dim: #8794a5; --chip: #141c27; --chip-fg: #f8fafc;
  --row-hover: #edf1f6; --row-sel: #e4eaf2; --detail: #f1f4f8; --glass: #fafbfdee; --glass-hov: #eaeff5;
  --focus: #3b6fb0; --tipbg: #fbfcfdf2; --soft: #00000010; --soft-2: #0000001c; --keytxt: #3d4959;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
#app { height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#selchip button { background: var(--soft); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); background: var(--soft-2); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 44px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--row-hover); }
.row.sel { background: var(--row-sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 12px var(--sans); color: var(--c); }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 18px; color: var(--mute); font-size: 12.5px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail .t { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; flex: none; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail .fare { flex: none; font: 500 10px var(--sans); letter-spacing: .04em; color: var(--mute); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 6px; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; flex: none; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stops li.nx { color: var(--fg); }
#stops li .zc { font: 500 10px var(--sans); letter-spacing: .02em; opacity: .85; }
#stops li.gone { opacity: .45; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--keytxt); pointer-events: none; }
#keybody { pointer-events: auto; width: min(320px, 100%); background: var(--glass); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--soft); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--glass-hov); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; }
.k-lines button { display: flex; align-items: center; gap: 8px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-lines button small { color: var(--dim); font-size: 10.5px; margin-left: auto; padding-left: 8px; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--soft); color: var(--fg); }
.k-fare { border-top: 1px solid var(--line); padding: 6px 6px 0; color: var(--mute); font-size: 11px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.k-fare b { color: var(--fg); font-weight: 500; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 150px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend button { background: var(--glass); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--glass); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: var(--glass-hov); }
#theme { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; padding: 0; }
#theme:hover { color: var(--fg); background: var(--glass-hov); }
#theme:focus-visible, #play:focus-visible, .seg button:focus-visible, #speed:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#tip { position: absolute; pointer-events: none; background: var(--tipbg); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--fg); max-width: 260px; z-index: 5; box-shadow: 0 6px 24px #0006; transform: translate(12px, 14px); }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); }
  #head { padding: 12px 16px 6px; }
  .row { padding: 7px 16px; grid-template-columns: 50px 1fr; }
  .row .to { font-size: 14px; }
  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px) max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #sublegend { max-width: calc(100% - 150px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

</div>

listEl.addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(+b.dataset.k); });

function select(k) { selected = (k === selected) ? -1 : k; showDetail(); lastSig = ''; }

const fareTxt = (r) => '$' + r.fare.toFixed(2);
let detSig = '';
function showDetail() {

  const p = pats[trips[selected].p], r = routes[p.r];

  el.innerHTML = '<div class="t"><b style="color:' + gc(p.g) + '">' + esc(r.s) + '</b><span>' + esc(shortName(p.h)) + '</span><i class="fare">' + fareTxt(r) + ' flat</i><button class="x" aria-label="Close">&times;</button></div><ul id="stops"></ul>';

}

    h += '<li class="' + cls + '"><span>' + clk(tr.t0 + p.a[i]) + '</span><span>' + esc(shortName(s.n)) + '</span>' + oc + '</li>';

/* ---------- time bar ---------- */
const playBtn = $('play');
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function drawHist() {
  const g = hctx, w = hc.width, h = hc.height; g.clearRect(0, 0, w, h); if (!w) return;
  const hs = D.hist[day], N = 480, mxv = Math.max.apply(null, hs) || 1, bw = w / N, ph = t / 86400;
  for (let i = 0; i < N; i++) {

let seeking = false;
function seekFrom(e) { const r = hist.getBoundingClientRect(); t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86399; lastSig = ''; }
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });
hist.addEventListener('pointermove', (e) => { if (seeking) seekFrom(e); });
hist.addEventListener('pointerup', () => { seeking = false; });
hist.addEventListener('pointercancel', () => { seeking = false; });
function drawClock() { const m = clk(t).match(/^(\d+:\d\d) (AM|PM)$/); $('clock').innerHTML = m[1] + '<small>' + m[2] + '</small><em>CT</em>'; }

/* ---------- key ---------- */
function renderKey() {
  const box = $('klines'); if (!box) return; const items = [];
  const cnt = (g) => routes.filter((r) => r.g === g).length;
  if (emph === 'rail') {

  } else {
    GROUPS.forEach((g, i) => { if (emph === 'bus' && i === 0) return; items.push('<button data-g="' + i + '" style="--c:' + gc(i) + '" title="Highlight this line"><i></i>' + g.n + (i ? '<small>' + cnt(i) + ' routes</small>' : '<small>550</small>') + '</button>'); });
  }
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForGroup(+b.dataset.g)));
  box.querySelectorAll('button[data-r]').forEach((b) => b.onclick = () => setLine(lineForRoute(+b.dataset.r)));

}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    const on = !!lineSel && (b.dataset.r !== undefined ? lineSel.set.has(+b.dataset.r) : lineSel.g === +b.dataset.g);
    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on);

}
function buildLegend() {
  const el = $('legend');
  el.innerHTML = '<button id="keytog" aria-label="Collapse key" title="Collapse key"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="keybody">' +
    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="rail">Rail</button><button data-e="bus">Bus</button></span></div>' +
    '<div class="k-lines" id="klines"></div>' +
    '<div class="k-fare"><span>Flat fares, no zones</span><span>Bus <b>$' + FAREFLAT.bus.toFixed(2) + '</b> · Rail <b>$' + FAREFLAT.rail.toFixed(2) + '</b></span></div></div>';
  renderKey();
  el.querySelectorAll('.emph button').forEach((b) => b.onclick = () => setEmph(b.dataset.e));
  const tog = $('keytog');
  tog.onclick = () => { const m = el.classList.toggle('min'); tog.setAttribute('aria-label', m ? 'Expand key' : 'Collapse key'); tog.title = tog.getAttribute('aria-label'); };
  if (window.matchMedia('(max-width: 820px)').matches) tog.onclick();
}

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.55, Math.min(s0 * 60, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2);
$('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
const UI = '#zoomc,#legend,#sublegend,#theme';
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;

function lineAt(px, py) {

      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;

    }
  });

}

function hit(px, py) {

    hover = best.k; wrap.style.cursor = 'pointer'; const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else { const l = lineAt(px, py); if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; } else { tip.hidden = true; return; } }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.min(px, W - tw - 24) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {

  const f = Math.max.apply(null, rs.map((r) => r.fare));
  return '<div><b>' + esc(s.n) + '</b></div><div class="s">' + esc(rs.slice(0, 6).map((r) => r.s).join(' · ')) + (rs.length > 6 ? ' +' + (rs.length - 6) : '') + '</div><div class="s">' + (s.rail ? 'Rail station · ' : '') + 'Flat fare $' + f.toFixed(2) + ' · no zones</div>';
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {

    if (best) select(best.k);

  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') t = (t + 600) % 86400; else if (e.key === 'ArrowLeft') t = (t + 86400 - 600) % 86400;

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles(); drawLive();

  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  let th = root.dataset.theme === 'light' ? 'light' : 'dark';
  try { const sv = localStorage.getItem('austin-map-theme'); if (sv === 'light' || sv === 'dark') th = sv; } catch (e) { /* ignore */ }
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  applyTheme(th, false);
  resize(); loadDay(); $('loading').remove();
  new ResizeObserver(resize).observe(wrap);
  new ResizeObserver(() => { const hr = hist.getBoundingClientRect(); hc.width = Math.round(hr.width * dpr); hc.height = Math.round(hr.height * dpr); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
