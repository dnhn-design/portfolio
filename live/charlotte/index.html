<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default with a light toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --card: #0c1017ee; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071; --chip: #e9edf3; --chip-fg: #0c1017;
  --hover: #10161f; --sel: #131b27; --detail: #0f151e; --ghostbtn: #ffffff10; --seg: #0a0d13; --tip: #0f141cf2;
  --focus: #5d7fa6; --shadow: #0008;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f9fafc; --card: #fbfcfdf2; --line: #dde2ea; --line-2: #c9d0db;
  --fg: #141a24; --mute: #5b6676; --dim: #7c8798; --chip: #172033; --chip-fg: #f4f6fa;
  --hover: #eef1f6; --sel: #e6ebf3; --detail: #f1f4f8; --ghostbtn: #00000010; --seg: #eef1f5; --tip: #ffffffF2;
  --focus: #2a63b8; --shadow: #1a284a30;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }
#app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#selchip { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; overflow-wrap: anywhere; }
#selchip button { flex: none; margin-left: auto; background: var(--ghostbtn); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 6px; width: 100%; text-align: left; background: none; border: 0;
  font: inherit; padding: 5px 16px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; overflow-wrap: anywhere; min-width: 0; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; overflow-wrap: anywhere; min-width: 0; }
.empty { padding: 20px 16px; color: var(--mute); font-size: 13px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 16px 9px; max-height: 46%; overflow-y: auto; flex: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; }
#detail .t b { font-weight: 600; font-size: 13.5px; }
#detail .t span { color: var(--mute); font-size: 11.5px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
#detail .x { flex: none; margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
#stops li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li > span:last-child { overflow-wrap: anywhere; }
#stops li.nx { color: var(--fg); font-weight: 500; }
#stops li .tm { font-size: 11px; white-space: nowrap; }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: max-content; min-width: 210px; max-width: min(360px, 100%); max-height: 46vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--ghostbtn); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.emph { display: inline-flex; flex: 0 1 auto; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--seg); }
#legend .emph button { padding: 3px 11px; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; white-space: nowrap; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.k-lines button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; text-align: left; white-space: nowrap; color: var(--fg); }
.k-lines button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend .k-lines button.off { opacity: .4; }
#legend .k-lines button.act { background: var(--ghostbtn); box-shadow: inset 0 0 0 1px var(--line-2); }
.k-note { color: var(--dim); font-size: 10.5px; line-height: 1.35; max-width: 30ch; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 38px); top: 14px; max-width: calc(100% - 240px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--card); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; padding: 0; }
#zoomc button:hover { color: var(--fg); }
#theme { position: absolute; top: 14px; right: 14px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; color: var(--mute); font: 500 11px var(--sans); cursor: pointer; white-space: nowrap; }
#theme:hover { color: var(--fg); }
#tip {
  position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; font-size: 12px;
  color: var(--fg); width: max-content; max-width: 260px; z-index: 5; box-shadow: 0 6px 24px var(--shadow); overflow-wrap: anywhere;
}
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #theme:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 500 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; white-space: nowrap; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1 1 200px; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--seg); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }
  .row { padding: 7px 16px; grid-template-columns: 50px minmax(0, 1fr); }
  .row .to { font-size: 15px; }
  #bar { gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #keybody { max-height: 34vh; }
  #sublegend { top: 48px; left: max(14px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 28px); }
  #theme span { display: none; }
  #theme { padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.55, Math.min(s0 * 60, view.s * f)); f = ns / view.s;

});
function lineAt(px, py) {

    if (fd(gi)) return; const Pp = shapes[si];

}
function nearestVehicle(px, py, lim) {

}
function hit(px, py) {

  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer'; const r = r_(best), d = dirOf(best);
    html = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name + (d ? ' · ' + d : '')) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';

function pend(e) {

wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles(); drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }

}
function boot() {

})();
