<style>
/* Layout: full-bleed map with a right-hand roster, transport bar underneath. Dark by default, light theme on the toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --row-h: #10161f; --row-sel: #131b27; --card: #0c1017ee; --card-2: #0c1017d9; --card-3: #131a25; --hov: #ffffff14; --hov-2: #ffffff0d;
  --tip: #0f141cf2; --detail: #0f151e; --focus: #5d7fa6; --amber: #f2b84b;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef1f5; --panel: #f8f9fb; --line: #dde2ea; --line-2: #cbd3de;
  --fg: #172030; --mute: #5b6778; --dim: #7d8898;
  --chip: #172030; --chip-fg: #f4f6f9;
  --row-h: #eef1f6; --row-sel: #e4e9f1; --card: #fbfcfdee; --card-2: #fbfcfdd9; --card-3: #edf0f5; --hov: #1720301a; --hov-2: #1720300f;
  --tip: #ffffffee; --detail: #f1f4f8; --focus: #3b6ea8; --amber: #b87400;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f8f9fb; --line: #dde2ea; --line-2: #cbd3de;
  --fg: #172030; --mute: #5b6778; --dim: #7d8898;
  --chip: #172030; --chip-fg: #f4f6f9;
  --row-h: #eef1f6; --row-sel: #e4e9f1; --card: #fbfcfdee; --card-2: #fbfcfdd9; --card-3: #edf0f5; --hov: #1720301a; --hov-2: #1720300f;
  --tip: #ffffffee; --detail: #f1f4f8; --focus: #3b6ea8; --amber: #b87400;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { font-variant-numeric: tabular-nums; margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#head .tag.sp { color: var(--amber); }
#daynote { flex-basis: 100%; font-size: 11px; color: var(--amber); line-height: 1.35; }
#daynote[hidden] { display: none; }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#selchip button { background: var(--hov-2); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); background: var(--hov); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 48px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--row-h); }
.row.sel { background: var(--row-sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln b { color: var(--amber); font-weight: 500; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; margin-left: 5px; }
.empty { padding: 24px 28px; color: var(--mute); font-size: 13px; line-height: 1.45; }
.empty b { color: var(--fg); font-weight: 500; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; }
#detail .t b { font-weight: 600; font-size: 13.5px; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .tm { font: 400 10.5px var(--sans); }
#stops li.gone { opacity: .45; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: min(330px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; max-height: 46vh; overflow: auto; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--hov-2); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--card-3); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mute); }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.sq i { border-radius: 2px; }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--hov); color: var(--fg); }
.k-note { color: var(--dim); font-size: 10.5px; line-height: 1.35; padding: 2px 6px 0; border-top: 1px solid var(--line); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 130px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: var(--bg); }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--card-2); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: var(--card-3); }
#themetog { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; padding: 0; }
#themetog:hover { color: var(--fg); background: var(--card-3); }
#tip { position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--fg); max-width: 270px; z-index: 5; box-shadow: 0 6px 24px #0004; transform: translate(12px, 14px); }
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#tip .sp { color: var(--amber); font-size: 10.5px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }

#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }

#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
#dayctl { position: relative; display: flex; gap: 6px; flex: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#spec.on { background: var(--amber); color: #1a1405; }
#specmenu { position: absolute; right: 0; bottom: calc(100% + 8px); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px; min-width: 220px; z-index: 6; box-shadow: 0 8px 28px #0005; }
#specmenu[hidden] { display: none; }
#specmenu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font: 500 12.5px var(--sans); padding: 7px 10px; border-radius: 7px; cursor: pointer; }
#specmenu button small { display: block; color: var(--mute); font-weight: 400; font-size: 11px; margin-top: 1px; }
#specmenu button:hover { background: var(--hov); }
#specmenu button.on { background: var(--hov); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }
  .row { padding: 7px 16px; grid-template-columns: 54px 1fr; }
  .row .to { font-size: 15px; }
  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  #dayctl { margin-left: auto; }
  .seg button { padding: 8px 11px; font-size: 14px; }
  #legend { bottom: 8px; }
  #keybody { max-height: 38vh; }

    tip.innerHTML = '<div><b>' + esc(isRailG(best.g) && best.tr.no ? 'Car ' + best.tr.no : r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>' + (nt ? '<div class="sp">' + esc(nt) + '</div>' : '');
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    const io = indAt(px, py);
    if (sb) { hoverStation = sb; wrap.style.cursor = 'pointer'; const names = [...new Set(sb.routes.map((r) => routes[r].m === 'bus' ? 'Route ' + routes[r].s : routes[r].name))].slice(0, 6).join(' · ');
      tip.innerHTML = '<div><b>' + esc(sb.n) + '</b></div><div class="s">' + esc(names) + '</div>' + (sb.rail ? '' : '<div class="s">DDOT flat fare $2.00</div>'); }
    else if (io) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(io.n) + '</b></div><div class="s">' + esc(io.d) + '</div><div class="s">Static, approximate marker. No schedule data.</div>'; }
    else { const l = lineAt(px, py); if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; } else { tip.hidden = true; return; } }
  }
  tip.hidden = false; const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(px, W - tw - 24)) + 'px'; tip.style.top = Math.min(py, H - 90) + 'px';
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) select(best.k);
    else { const io = indAt(px, py); if (io) setLine(lineForInd(io.i)); else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); } }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') t = (t + 600) % 86400; else if (e.key === 'ArrowLeft') t = (t + 86400 - 600) % 86400;
  else if (e.key === 'Escape') { if (!specMenu.hidden) specMenu.hidden = true; else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  stepAnim(now);
  if (baseDirty) drawBase();
  computeVehicles(); drawLive(now);
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  applyTheme(); buildLegend(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => { resize(); }).observe(wrap);
  new ResizeObserver(() => { const hr = hist.getBoundingClientRect(); hc.width = Math.round(hr.width * dpr); hc.height = Math.round(hr.height * dpr); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
</script>
