<style>
/* Layout: full-bleed map with a right-hand roster, transport bar underneath. Dark only. */
:root {
  --bg: #0a0d13;
  --panel: #0c1017;
  --line: #161d28;
  --line-2: #212a38;
  --fg: #e8edf4;
  --mute: #7f8a9a;
  --dim: #556071;
  --chip: #e9edf3;
  --chip-fg: #0c1017;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-variant-numeric: tabular-nums;
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 12px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
#head .lbl { color: var(--mute); font-size: 12px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; }
#selchip button { background: #ffffff10; border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; }
#selchip button:hover { color: var(--fg); background: #ffffff1c; }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 44px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 4px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover, .row.hl { background: #10161f; }
.row.sel { background: #131b27; border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid #5d7fa6; outline-offset: -1px; }
.row .no { font: 400 11px var(--sans); color: var(--mute); font-variant-numeric: tabular-nums; }
.row .no.m { color: var(--c); font-weight: 600; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 18px; color: var(--mute); font-size: 12.5px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #0f151e; padding: 9px 18px 8px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; }
#detail .t b { font-weight: 600; font-size: 13px; white-space: nowrap; }
#detail .t span { color: var(--mute); font-size: 11.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 9px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .tm { font: 400 10.5px var(--sans); font-variant-numeric: tabular-nums; }
#stops li .zc { font: 600 9.5px var(--sans); letter-spacing: .04em; display: inline-flex; gap: 4px; }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: #aab4c2; pointer-events: none;
}
#keybody { pointer-events: auto; width: min(320px, 100%); background: #0c1017ee; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: #ffffff0d; }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: #0c1017d9; border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: #131a25; }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: #0a0d13; }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: #ffffff14; color: var(--fg); }
#knote { color: var(--dim); font-size: 10.5px; line-height: 1.4; border-top: 1px solid var(--line); padding: 6px 4px 0; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: #0c1017d9; border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: #131a25; }
#tip {
  position: absolute; pointer-events: none; background: #0f141cf2; border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px;
  color: var(--fg); max-width: 260px; z-index: 5; box-shadow: 0 6px 24px #0008; transform: translate(12px, 14px);
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 16px;
  padding: 6px max(20px, env(safe-area-inset-right, 0px)) 7px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible { outline: 2px solid #5d7fa6; outline-offset: 2px; }
#clock { font: 500 24px/1 var(--sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
#clock small { font-size: 13px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; font-variant-numeric: tabular-nums; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 34px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: #0c1017; flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12px var(--sans); padding: 5px 12px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 10px 16px 6px; }
  #count { font-size: 26px; }
  .row { padding: 6px 16px; grid-template-columns: 50px 1fr; }
  .row .to { font-size: 14px; }
  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 42px; height: 42px; }
  #clock { font-size: 26px; }
  #clock small { font-size: 15px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 30px; }
  .seg { margin-left: auto; }
  .seg button { padding: 7px 12px; font-size: 13px; }
  #legend { bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
