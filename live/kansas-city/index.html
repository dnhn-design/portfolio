<title>Kansas City Live Map</title>

<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark default, light toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #8590a0; --dim: #5c6879;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --glass: #0c1017ee; --glass-2: #131a25; --hover: #10161f; --sel: #131b27; --detail: #0f151e; --soft: #ffffff14;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #ffffff; --line: #e1e6ed; --line-2: #cfd7e2;
  --fg: #141b26; --mute: #596475; --dim: #8892a2;
  --chip: #141b26; --chip-fg: #ffffff;
  --glass: #ffffffee; --glass-2: #eef2f7; --hover: #f2f5f9; --sel: #e9eef5; --detail: #f5f7fa; --soft: #0000000f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: var(--sans); }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
#mapwrap.ptr { cursor: pointer; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#selchip button { flex: none; background: var(--soft); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 16px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid #5d7fa6; outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 20px 16px; color: var(--mute); font-size: 12.5px; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 16px 9px; max-height: 46%; overflow-y: auto; flex: none; scrollbar-width: thin; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
#detail .tt { flex: 1; min-width: 0; }
#detail .tt b { display: block; font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
#detail .tt span { display: block; color: var(--mute); font-size: 11.5px; overflow-wrap: anywhere; }
#detail .x { flex: none; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 0 2px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 9px 0 0; padding: 0; display: grid; gap: 4px; }
#stops li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .tm { white-space: nowrap; }
#stops li .nm { overflow-wrap: anywhere; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); max-height: calc(100% - 100px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: min(300px, 100%); max-height: 100%; overflow-y: auto; min-height: 0; background: var(--glass); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; scrollbar-width: thin; backdrop-filter: blur(6px); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--soft); }
#legend #keytog { flex: none; width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.emph-l { flex: none; color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; min-width: 0; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); }
#legend .emph button { flex: 1 1 auto; min-width: 0; padding: 4px 6px; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; white-space: nowrap; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 5px 6px; text-align: left; min-width: 0; }
.k-lines button span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#legend .k-lines i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend .k-lines button.act { background: var(--soft); color: var(--fg); }
.k-note { color: var(--dim); font-size: 10.5px; line-height: 1.35; }
.k-fare { border-top: 1px solid var(--line); padding: 7px 2px 0; display: grid; gap: 3px; font-size: 11px; color: var(--mute); }
.k-fare .fr { display: flex; justify-content: space-between; gap: 10px; min-width: 0; }
.k-fare .fr span:first-child { min-width: 0; overflow-wrap: anywhere; }
.k-fare .fr b { font-weight: 500; color: var(--fg); white-space: nowrap; }
.k-fare .fh { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.k-fare .fs { color: var(--dim); font-size: 10.5px; line-height: 1.35; overflow-wrap: anywhere; }
.k-fare a { color: var(--mute); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 36px); top: 14px; max-width: calc(100% - 190px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--glass); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button, #themebtn { background: var(--glass); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; padding: 0; }
#zoomc button { width: 26px; height: 24px; }
#zoomc button:hover, #themebtn:hover { color: var(--fg); background: var(--glass-2); }
#themebtn { position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 8px; }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--glass); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--fg); width: max-content; max-width: min(260px, 70%); z-index: 5; box-shadow: 0 6px 24px #0006; overflow-wrap: anywhere; }
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 16px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(9px) max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #themebtn:focus-visible { outline: 2px solid #5d7fa6; outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 500 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; min-width: 40px; text-align: center; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1 1 120px; height: 36px; min-width: 100px; cursor: ew-resize; touch-action: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-right: 0; }
  #head { padding: 10px max(16px, env(safe-area-inset-left, 0px)) 6px max(16px, env(safe-area-inset-right, 0px)); }
  .row { padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); grid-template-columns: 54px minmax(0, 1fr); }
  .row .to { font-size: 14.5px; }
  #detail { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); max-height: 60%; }
  #bar { flex-wrap: wrap; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 26px; }
  #clock em { display: none; }
  #hist { order: 5; flex: 1 0 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; max-height: calc(100% - 70px); }
  #sublegend { max-width: calc(100% - 100px); top: 48px; left: max(14px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

</div>

wrap.addEventListener('pointermove', e => {
  const rect = wrap.getBoundingClientRect(), px = e.clientX - rect.left, py = e.clientY - rect.top;
  if (ptrs.has(e.pointerId)) {
    ptrs.set(e.pointerId, { x: px, y: py });
    if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((pinch.s * d / pinch.d) / view.s, (a.x + b.x) / 2, (a.y + b.y) / 2); moved = 99; }
    else if (drag) { const dx = px - drag.x, dy = py - drag.y; moved = Math.max(moved, Math.hypot(dx, dy)); if (moved > 4) { view.x = drag.vx - dx / view.s; view.y = drag.vy + dy / view.s; userView = true; baseDirty = true; } }

function endPtr(e) {

wrap.addEventListener('pointerup', endPtr); wrap.addEventListener('pointercancel', endPtr);
wrap.addEventListener('pointerleave', () => { tip.hidden = true; });
function click(px, py) {
  const v = hitVeh(px, py); if (v) { selectVeh(v.id); return; }
  const l = hitLine(px, py);
  if (l >= 0) { const g = RT[l].g; if (selGroup === g && GBY[g].routes.length > 1) { selRoute = selRoute === l ? null : l; updateSel(); baseDirty = true; } else { selGroup = g; selRoute = null; buildLegend(); updateSel(); baseDirty = true; } return; }
  if (selVeh != null) { selVeh = null; baseDirty = true; updateDetail(); rebuildList(); }
}
wrap.addEventListener('wheel', e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
wrap.addEventListener('dblclick', e => { if (e.target.closest('#zoomc,#legend,#sublegend,#themebtn')) return; const r = wrap.getBoundingClientRect(); zoomAt(1.9, e.clientX - r.left, e.clientY - r.top); });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2);
$('zfit').onclick = () => { userView = false; fit(); };
$('themebtn').onclick = () => { themeName = themeName === 'dark' ? 'light' : 'dark'; applyTheme(); drawHist(); };
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (selVeh != null) { selVeh = null; baseDirty = true; updateDetail(); rebuildList(); } else if (selGroup) clearSel(); }
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setPlay(!playing); }
  else if (e.target === document.body && e.key === 'ArrowRight') { t = (t + 600) % 86400; } else if (e.target === document.body && e.key === 'ArrowLeft') { t = (t + 86400 - 600) % 86400; }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '', lastListAt = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  computeVehicles();
  if (baseDirty) { if (W > 10) { drawBase(); } }
  drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vVis(v) ? 1 : 0), 0);
  const c = clk(t).join(' '); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {

  resize(); $('loading').remove();
  new ResizeObserver(() => resize()).observe(wrap);
  new ResizeObserver(() => { const r = hist.getBoundingClientRect(); hc.width = Math.round(r.width * dpr); hc.height = Math.round(r.height * dpr); hc.style.width = r.width + 'px'; hc.style.height = r.height + 'px'; drawHist(); }).observe(hist);
  computeVehicles(); rebuildList(); requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
