<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via the toggle at top right. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38; --fg: #e8edf4; --mute: #8693a5; --dim: #5d697c;
  --chip: #e9edf3; --chip-fg: #0c1017; --hover: #10161f; --sel: #131b27; --detail: #0f151e; --glass: #0c1017ee; --glass2: #0c1017d9;
  --tip: #0f141cf2; --focus: #5d7fa6; --veil: #ffffff10; --veil2: #ffffff1c; --seg: #0c1017; --shadow: #0008;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e9edf2; --panel: #f6f8fb; --line: #d6dde7; --line-2: #c3ccd8; --fg: #101826; --mute: #556176; --dim: #78849a;
  --chip: #101826; --chip-fg: #f6f8fb; --hover: #edf1f6; --sel: #e4eaf2; --detail: #eef2f7; --glass: #f6f8fbf0; --glass2: #f6f8fbe0;
  --tip: #fbfcfdf5; --focus: #3b6ea8; --veil: #10182614; --veil2: #1018261f; --seg: #eef2f7; --shadow: #1018262e;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app { height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#selchip button { background: var(--veil); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); background: var(--veil2); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 48px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--c, var(--fg)); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 28px; color: var(--mute); }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; flex: none; }
#detail .t span { color: var(--mute); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; flex: none; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .tm { font-size: 10.5px; }
#stops li .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#stops li .zc { display: inline-flex; gap: 3px; align-items: center; }
#stops li .zc i, .tdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
#stops li.gone { opacity: .45; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: min(320px, 100%); background: var(--glass); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--veil); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--glass2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--seg); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; max-height: 38vh; overflow-y: auto; scrollbar-width: thin; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button i.quad { background: conic-gradient(var(--c1) 0 25%, var(--c2) 0 50%, var(--c3) 0 75%, var(--c4) 0); }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--veil2); color: var(--fg); }
.k-note { color: var(--dim); font-size: 10.5px; line-height: 1.35; padding: 0 2px; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 120px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--glass); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--glass2); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); }
#themetog { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: grid; place-items: center; background: var(--glass2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; padding: 0; }
#themetog:hover { color: var(--fg); }
#themetog svg { display: block; }
#tip { position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--fg); max-width: 260px; z-index: 5; box-shadow: 0 6px 24px var(--shadow); transform: translate(12px, 14px); }
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #themetog:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--seg); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-right: 0; }
  #head { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
  .row { padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); grid-template-columns: 54px 1fr; }
  .row .to { font-size: 15px; }
  #detail { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #themetog { right: max(14px, env(safe-area-inset-right, 0px)); }
  #sublegend { max-width: calc(100% - 130px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } #legend #keytog svg { transition: none; } }

<script>
(function () {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);

/* ---------- constants ---------- */
const KX = D.meta.kx, KY = D.meta.ky;                    // same equirectangular constants as the Python preprocessing
const M_PER_UNIT = 40075016 * Math.cos(33.8 * Math.PI / 180);
const GROUPS = [
  { k: 'rail', n: 'MARTA Rail', m: 'rail' },
  { k: 'sc', n: 'Atlanta Streetcar', m: 'tram' },
  { k: 'bus', n: 'Frequent Bus', m: 'bus' }
];
const GI = { rail: 0, tram: 1, bus: 2 };
const LAT_OFF = { RED: -1.4, GOLD: 1.4, BLUE: -1.4, GREEN: 1.4 }; // px: shared-track lines run side by side
const COUNTY_STYLE = '500 11px Inter, sans-serif';

/* ---------- theme ---------- */
const PD = { bg: '#0a0d13', cnty: 'rgba(120,140,170,0.20)', river: 'rgba(70,115,170,0.24)', ghost: '130,150,180', ghostA: 0.085, cname: 'rgba(140,155,180,0.30)',
  halo: 'rgba(10,13,19,0.94)', txt: 'rgba(232,238,247,0.96)', core: '#ffffff', ring: '#ffffff', shade: 0, railN: '#cdd6e4', hi: 0.95, histPast: 'rgba(214,222,234,0.62)', histFut: 'rgba(150,164,186,0.26)', histHead: '#f4f7fb', quad: '#e9eef6' };
const PL = { bg: '#e9edf2', cnty: 'rgba(70,85,110,0.30)', river: 'rgba(70,130,195,0.38)', ghost: '90,105,130', ghostA: 0.17, cname: 'rgba(70,85,110,0.42)',
  halo: 'rgba(233,237,242,0.95)', txt: 'rgba(16,24,38,0.96)', core: '#0b1220', ring: '#0b1220', shade: 0.24, railN: '#3a4658', hi: 1, histPast: 'rgba(30,42,62,0.62)', histFut: 'rgba(70,85,110,0.24)', histHead: '#101826', quad: '#26303f' };
let P = PD, light = false;
const root = document.documentElement;
try { const sv = localStorage.getItem('marta-theme'); light = sv ? sv === 'light' : root.getAttribute('data-theme') === 'light'; } catch (e) { light = root.getAttribute('data-theme') === 'light'; }

/* ---------- colour helpers (hex in, hex or rgba out) ---------- */
function hex3(n) { return '#' + [16, 8, 0].map((s) => ((n >> s) & 255).toString(16).padStart(2, '0')).join(''); }
function mixHex(a, b, f) { const p = parseInt(a.slice(1), 16), q = parseInt(b.slice(1), 16); const c = (s) => Math.round(((p >> s) & 255) * (1 - f) + ((q >> s) & 255) * f); return hex3((c(16) << 16) | (c(8) << 8) | c(0)); }
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rcol = (ri) => P.shade ? mixHex(routes[ri].c, '#000000', P.shade) : routes[ri].c;
const letterSpace = (s) => s.split('').join(' ');

/* ---------- geometry ---------- */
const mx = (lon) => (lon + 180) / 360;
const my = (lat) => 0.5 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / (2 * Math.PI);
function decode(a, q) {
  const n = a.length / 2, X = new Float64Array(n), Y = new Float64Array(n), lon = new Float64Array(n), lat = new Float64Array(n);
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) { x += a[2 * i]; y += a[2 * i + 1]; lon[i] = x / q; lat[i] = y / q; X[i] = mx(lon[i]); Y[i] = my(lat[i]); }
  return { X, Y, lon, lat, n };
}
const shapes = D.shapes.map((a) => {
  const s = decode(a, 1e5), cum = new Float64Array(s.n);
  for (let i = 1; i < s.n; i++) cum[i] = cum[i - 1] + Math.hypot((s.lon[i] - s.lon[i - 1]) * KX, (s.lat[i] - s.lat[i - 1]) * KY);
  s.cum = cum; return s;
});
function bsearch(arr, v) { // last index with arr[i] <= v
  let lo = 0, hi = arr.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (arr[m] <= v) lo = m; else hi = m - 1; }
  return lo;
}
function posAt(s, d, o) {
  const c = s.cum, n = s.n; let i;
  if (d <= 0) { i = 0; d = 0; } else if (d >= c[n - 1]) { i = n - 2; d = c[n - 1]; } else i = bsearch(c, d);
  const f = (d - c[i]) / ((c[i + 1] - c[i]) || 1);
  o.x = s.X[i] + (s.X[i + 1] - s.X[i]) * f; o.y = s.Y[i] + (s.Y[i + 1] - s.Y[i]) * f;
  o.a = Math.atan2(s.Y[i + 1] - s.Y[i], s.X[i + 1] - s.X[i]);
  return o;
}
function subPath(s, d0, d1) {
  const xs = [], ys = [], o = {};
  posAt(s, d0, o); xs.push(o.x); ys.push(o.y);
  for (let i = 0; i < s.n; i++) if (s.cum[i] > d0 && s.cum[i] < d1) { xs.push(s.X[i]); ys.push(s.Y[i]); }
  posAt(s, d1, o); xs.push(o.x); ys.push(o.y);
  return { X: xs, Y: ys };
}

/* ---------- routes, patterns, stations ---------- */
const routes = D.routes;

}
listEl.addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(+b.dataset.k); });

function select(k) { selected = (k === selected) ? -1 : k; detSig = ''; showDetail(); lastSig = ''; }
function clk(sec) { sec = ((sec % 86400) + 86400) % 86400; let h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0') + ' ' + ap; }

    h += '<li class="' + cls + '"><span class="tm">' + clk(tr.t0 + p.a[i]) + '</span><span class="nm">' + esc(shortName(s.n)) + '</span><span class="zc">' + dots + '</span></li>';

/* ---------- time bar ---------- */
const playBtn = $('play');
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {
  const g = hctx, w = hc.width, h = hc.height; g.clearRect(0, 0, w, h); if (!w) return;
  const hs = D.hist[day], N = 480, mxv = Math.max.apply(null, hs) || 1, bw = w / N, ph = t / 86400;
  for (let i = 0; i < N; i++) {
    let v = 0; for (let j = 0; j < 3; j++) v = Math.max(v, hs[i * 3 + j]);

}
function seekFrom(e) { const r = hist.getBoundingClientRect(); t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86399; }
let seeking = false;
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });

function drawClock() { const m = clk(t).match(/^(\d+:\d\d) (AM|PM)$/); $('clock').innerHTML = m[1] + '<small>' + m[2] + '</small><em>ET</em>'; }

/* ---------- key ---------- */
function btnG(g, label, title) {

  const q = g === 0 ? 'class="quad" style="--c1:' + rcol(0) + ';--c2:' + rcol(1) + ';--c3:' + rcol(2) + ';--c4:' + rcol(3) + '"' : '';
  return '<button data-g="' + g + '" style="' + c + '" title="' + title + '"><i ' + q + '></i>' + label + '</button>';
}
function btnR(ri, label) { return '<button data-r="' + ri + '" style="--c:' + rcol(ri) + '" title="' + esc(routeTitle(routes[ri])) + '"><i></i>' + esc(label) + '</button>'; }
function renderKey() {
  const box = $('klines'); if (!box) return; const items = [];
  if (emph === 'rail') {
    items.push(btnG(0, 'All MARTA Rail', 'Highlight all four rail lines'));
    routes.forEach((r, i) => { if (r.g < 2) items.push(btnR(i, r.m === 'rail' ? r.l.replace(/ Line$/, '') : r.l)); });
  } else if (emph === 'bus') {

  } else {

  }
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForGroup(+b.dataset.g)));
  box.querySelectorAll('button[data-r]').forEach((b) => b.onclick = () => setLine(lineForRoute(+b.dataset.r)));
  markKey();
}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    let on = false;
    if (lineSel) on = b.dataset.r !== undefined ? lineSel.key === 'r' + b.dataset.r : emph === 'all' ? lineSel.g === +b.dataset.g : lineSel.key === 'g' + b.dataset.g;
    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on);

}
function buildLegend() {
  const el = $('legend');
  el.innerHTML = '<button id="keytog" aria-label="Collapse key" title="Collapse key"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="keybody">' +
    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="rail">Rail</button><button data-e="bus">Bus</button></span></div>' +
    '<div class="k-lines" id="klines"></div>' +

/* ---------- theme toggle ---------- */
const ICON_SUN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
const ICON_MOON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>';
function applyTheme() {
  P = light ? PL : PD; root.setAttribute('data-theme', light ? 'light' : 'dark');
  const b = $('themetog'); b.innerHTML = light ? ICON_MOON : ICON_SUN; b.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
  if (lineSel) { const k = lineSel.key; lineSel = null; setLine(k[0] === 'g' ? lineForGroup(+k.slice(1)) : lineForRoute(+k.slice(1))); }
  renderKey(); baseDirty = true; lastSig = ''; drawHist();
}
$('themetog').onclick = () => { light = !light; try { localStorage.setItem('marta-theme', light ? 'light' : 'dark'); } catch (e) {} applyTheme(); };

/* ---------- interaction ---------- */
const tip = $('tip');
const UI = '#zoomc,#legend,#sublegend,#themetog';
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.55, Math.min(s0 * 40, view.s * f));
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}

$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };

const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;

  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];

  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;

    return;
  }

  hit(px, py);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  routes.forEach((r, ri) => {
    if (fd(r.g) && !lineSel) return;
    routeShapes[ri].forEach((si) => { const Pt = shapes[si];
      for (let i = 1; i < Pt.n; i++) {
        const ax = SX(Pt.X[i - 1]), ay = SY(Pt.Y[i - 1]), bx = SX(Pt.X[i]), by = SY(Pt.Y[i]);
        if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
        const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;

      } });
  });
  return best === null ? null : lineForRoute(best);
}
function nearestVehicle(px, py, lim) {
  let best = null, bd = lim;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  return best;
}
function hit(px, py) {
  const best = nearestVehicle(px, py, 100);
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';

    if (sb) { tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(px, W - tw - 24)) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';

function stationTip(s) {

  const dots = s.r.map((q) => '<span class="tdot" style="background:' + rcol(q) + '"></span> ' + esc(routes[q].m === 'bus' ? 'Route ' + routes[q].s : routes[q].l)).join(' &nbsp;');
  h += '<div class="s">' + dots + '</div>';

  if (rails > 1) h += '<div class="s">Rail transfer station</div>';

wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const best = nearestVehicle(px, py, 196);
    if (best) select(best.k);
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') { t = (t + 600) % 86400; } else if (e.key === 'ArrowLeft') { t = (t + 86400 - 600) % 86400; }
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles();
  drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  applyTheme(); resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => { resize(); }).observe(wrap);
  new ResizeObserver(() => { const hr = hist.getBoundingClientRect(); hc.width = Math.round(hr.width * dpr); hc.height = Math.round(hr.height * dpr); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => { baseDirty = true; }); }
boot();
})();
</script>
