<style>
/* Layout: full-bleed schematic map; top bar = play, clock, speed, density scrubber, day switch; thin centered line buttons at the bottom; slide-over train list on the right. */
:root{
  --bg:#F3F4F6; --ink:#10141B; --ink2:#667082; --dim:#CDD2DA; --trunk:#4C5668;
  --card:#FFFFFF; --cardb:#D9DDE4; --shadow:0 10px 30px rgba(16,20,27,.14);
  --seg:#E6E8EC; --bar:rgba(16,20,27,.22); --baron:#10141B; --onink:#F3F4F6;
  --b1:#009B3A; --b2:#0039A6; --b3:#EE0034; --b4:#E0457B; --b5:#F26B3A; --b6:#A8102B;
  --c1:#009B3A; --c2:#0039A6; --c3:#EE0034; --c4:#E0457B; --c5:#F26B3A; --c6:#A8102B;
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif; --tlh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14; --ink:#F2F4F8; --ink2:#8B94A5; --dim:#262C38; --trunk:#A9B1C0;
  --card:#141922; --cardb:#2A3140; --shadow:0 12px 34px rgba(0,0,0,.55);
  --seg:#141922; --bar:rgba(242,244,248,.20); --baron:#E9ECF2; --onink:#0B0E14;
  --c2:#4C84FF; --c3:#FF2D55; --c4:#FF6E9F; --c5:#FF8A57; --c6:#E0405A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E14; --ink:#F2F4F8; --ink2:#8B94A5; --dim:#262C38; --trunk:#A9B1C0;
  --card:#141922; --cardb:#2A3140; --shadow:0 12px 34px rgba(0,0,0,.55);
  --seg:#141922; --bar:rgba(242,244,248,.20); --baron:#E9ECF2; --onink:#0B0E14;
  --c2:#4C84FF; --c3:#FF2D55; --c4:#FF6E9F; --c5:#FF8A57; --c6:#E0405A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:400;overflow:hidden;overflow:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
b{font-weight:700}
#app{position:relative;height:100%;width:100%;overflow:hidden;overflow:clip}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#map.pan{cursor:grabbing}#map.ptr{cursor:pointer}

/* top bar */
#tl{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));z-index:5}
#play{width:38px;height:38px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none;transition:transform .15s}
#play:hover{transform:scale(1.06)}
#play svg{width:13px;height:13px;fill:var(--onink)}
#play .pa{display:none}#play.on .pl{display:none}#play.on .pa{display:block}
#clock{display:flex;align-items:baseline;gap:5px;cursor:pointer;user-select:none;min-width:98px;font-variant-numeric:tabular-nums}
#hm{font-weight:700;font-size:23px;letter-spacing:-.02em}
#ap{font-size:13px;color:var(--ink2)}
#spd{font-weight:700;font-size:13px;color:var(--ink2);min-width:46px;text-align:left;font-variant-numeric:tabular-nums;border-radius:8px;padding:4px 0}
#spd:hover{color:var(--ink)}
#trk{position:relative;flex:1 1 200px;min-width:0;height:40px;cursor:pointer;touch-action:none;outline:none}
#trk:focus-visible{outline:2px solid var(--ink2);outline-offset:3px;border-radius:6px}
#bars{position:absolute;inset:2px 0 0 0;width:100%;height:calc(100% - 2px);display:block}
#ph{position:absolute;top:-2px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--ink)}
#seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--seg);border:1px solid var(--cardb);flex:none}
#seg button{height:30px;padding:0 14px;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink2);transition:background .2s,color .2s}
#seg button:hover{color:var(--ink)}
#seg button.on{background:var(--ink);color:var(--onink)}
@media (max-width:640px){#trk{order:5;flex:1 1 100%;height:34px}#seg{margin-left:auto}#clock{min-width:88px}}

/* map */
.seg{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:3;transition:stroke .35s,opacity .35s}
.seg.c1{stroke:var(--c1)}.seg.c2{stroke:var(--c2)}.seg.c3{stroke:var(--c3)}.seg.c4{stroke:var(--c4)}.seg.c5{stroke:var(--c5)}.seg.c6{stroke:var(--c6)}
.seg.cn{stroke:var(--trunk)}
.seg.off{stroke:var(--dim);stroke-width:1.5;opacity:.55}
.st{transition:opacity .35s}
.st circle.d{fill:var(--bg);stroke:var(--ink);stroke-width:1.5;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.st.off{opacity:.1;pointer-events:none}
.st.hov circle.d{transform:scale(1.7)}
.st.key circle.d{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.st text{font-size:11px;fill:var(--ink2);font-family:var(--f);pointer-events:none}
.st text.x{display:none}#stations.z .st text.x{display:block}
.pulse{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite;pointer-events:none}
.pulse.b{animation-delay:1.4s}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(4);opacity:0}}
.tr{transition:opacity .25s;pointer-events:none}
.tr.o{stroke:var(--bg);stroke-width:1.5}
.tr.i{fill:var(--bg);stroke-width:2.5}
.tr.r1.o{fill:var(--c1)}.tr.r2.o{fill:var(--c2)}.tr.r3.o{fill:var(--c3)}.tr.r4.o{fill:var(--c4)}.tr.r5.o{fill:var(--c5)}.tr.r6.o{fill:var(--c6)}
.tr.r1.i{stroke:var(--c1)}.tr.r2.i{stroke:var(--c2)}.tr.r3.i{stroke:var(--c3)}.tr.r4.i{stroke:var(--c4)}.tr.r5.i{stroke:var(--c5)}.tr.r6.i{stroke:var(--c6)}
#trains.focus .tr:not(.sel){opacity:.28}
.tr.sel{r:6.5px}
#halo{fill:none;stroke:var(--ink);stroke-width:2;pointer-events:none;display:none}
#halo.on{display:block;transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
@keyframes halo{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#hl{fill:none;stroke:var(--ink);stroke-width:1.5;pointer-events:none}

/* hover card */
#tip{position:absolute;left:0;top:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--card);border:1px solid var(--cardb);border-radius:14px;box-shadow:var(--shadow);padding:11px 13px;font-size:12px;min-width:160px;max-width:calc(100% - 24px)}
#tip.on{opacity:1}
#tip.gct{width:300px;padding:14px 15px 13px;border-radius:18px}
.th{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.th b{font-size:14px}
.gct .th b{font-size:18px;letter-spacing:-.01em}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dots{display:flex;gap:3px;margin-left:auto}
.rw{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:baseline;padding:2.5px 0}
.rw b{font-variant-numeric:tabular-nums}
.m{color:var(--ink2);font-variant-numeric:tabular-nums}
.rw span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft{margin-top:8px;padding-top:8px;border-top:1px solid var(--cardb);color:var(--ink2);font-size:11px;display:flex;align-items:baseline;gap:6px}
.ft b{color:var(--ink);font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.gct .rw{grid-template-columns:22px auto 1fr auto;padding:3.5px 0;font-size:13px}
.trk{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:6px;color:#fff;font-weight:700;font-size:11px;align-self:center}
.hist{display:flex;align-items:flex-end;gap:2px;height:30px;margin:11px 0 3px}
.hist i{flex:1;background:var(--dim);border-radius:2px 2px 0 0;min-height:2px}
.hist i.now{background:var(--ink)}
.stats{display:flex;gap:20px;margin-top:9px;padding-top:9px;border-top:1px solid var(--cardb)}
.stats div{display:flex;flex-direction:column;gap:1px}
.stats b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stats small{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mix{display:flex;height:4px;border-radius:3px;overflow:hidden;gap:2px;margin-top:9px}
.mix i{display:block}

/* slide-over */
.ib{position:absolute;z-index:6;width:34px;height:34px;border-radius:11px;border:1.5px solid var(--dim);background:var(--bg);display:grid;place-items:center;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s,border-color .2s}
.ib.show{opacity:1;visibility:visible}.ib:hover{border-color:var(--ink2)}
.ib svg{width:15px;height:15px}
#mb{top:calc(var(--tlh) + 8px);right:max(16px,env(safe-area-inset-right,0px))}
#fit{top:calc(var(--tlh) + 8px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 42px)}
#pn{position:absolute;z-index:7;top:calc(var(--tlh) + 50px);bottom:66px;right:max(12px,env(safe-area-inset-right,0px));width:min(332px,calc(100% - 24px));
  background:var(--card);border:1px solid var(--cardb);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 30px));visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s}
#pn.open{transform:none;visibility:visible}
#app.nhsel #pn{bottom:112px}
#pnh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-size:15px}
#pnh .m{margin-left:auto;font-size:13px}
#pnl{overflow:auto;padding:0 8px 8px;flex:1;min-height:0;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:11px;font-size:13px}
.row:hover{background:var(--seg)}
.row.sel{background:var(--seg)}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.dt{padding:2px 10px 12px 24px;background:var(--seg);border-radius:0 0 11px 11px;margin:-6px 0 4px;font-size:12px}
.od{display:flex;gap:6px;align-items:baseline;padding-top:8px;font-weight:700;font-size:13px}
.od span.a{color:var(--ink2);font-weight:400}
.pg{height:4px;border-radius:3px;background:var(--dim);margin:9px 0 5px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--rc);border-radius:3px}
.pt{display:flex;justify-content:space-between;color:var(--ink2);font-size:11px;font-variant-numeric:tabular-nums}
.sl{margin-top:8px}
.sr{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:3px 0;color:var(--ink2)}
.sr.nx{color:var(--ink);font-weight:700}
.sr.nx .m{color:var(--ink)}
.none{padding:18px 10px;color:var(--ink2);font-size:13px}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));z-index:6}
.ln{position:relative;flex:1 1 0;min-width:0;max-width:138px;height:38px;border-radius:13px;color:#fff;font-weight:700;font-size:14px;transition:opacity .25s,transform .2s,box-shadow .25s}
.ln[data-l="1"]{background:var(--b1)}.ln[data-l="2"]{background:var(--b2)}.ln[data-l="3"]{background:var(--b3)}

.ln.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.nh{position:relative;flex:1 1 0;min-width:0;max-width:138px;display:flex}
.nh .ln{flex:1}
#br{position:absolute;bottom:calc(100% + 10px);left:50%;display:flex;gap:6px;

.bp{height:28px;padding:0 12px;border-radius:10px;color:#fff;font-weight:700;font-size:12px;white-space:nowrap;transition:opacity .25s,box-shadow .25s}
.bp[data-l="4"]{background:var(--b4)}.bp[data-l="5"]{background:var(--b5)}.bp[data-l="6"]{background:var(--b6)}

  const pt=tlh+34,pb=(sel===3?150:112),px=W<600?70:Math.max(34,W*.06),pr=px+($('#pn').classList.contains('open')&&W>760?345:0);
  const aw=W-px-pr,ah=H-pt-pb,bw=Math.max(bb.b-bb.a,1),bh=Math.max(bb.d-bb.c,1);
  const s=Math.min(aw/bw,ah/bh);
  fitS=s;manual=false;$('#fit').classList.remove('show');
  Vt.s=s;Vt.x=px+(aw-bw*s)/2-bb.a*s;Vt.y=pt+(ah-bh*s)/2-bb.c*s;viewDirty=true}
function applySel(){
  vis=visMask();
  for(const k in G){const g=G[k],m=g.mask&vis;let c;
    if(!m)c='off';else{const f=fam(m);
      if(f===1)c='c1';else if(f===2)c='c2';else if(f===4){c=(m&8)?'c3':(m&16)?'c4':(m&32)?'c5':(m&64)?'c6':'c3'}else c='cn'}
    g.path.setAttribute('class','seg '+c)}
  S.forEach(s=>{s.vis=!!(s.mask&vis);s.g.classList.toggle('off',!s.vis)});
  document.querySelectorAll('.ln').forEach(b=>b.classList.toggle('sel',+b.dataset.l===sel));
  $('#bar').classList.toggle('has',sel!==null);$('#app').classList.toggle('nhsel',sel===3);
  document.querySelectorAll('.bp').forEach(b=>b.classList.toggle('sel',+b.dataset.l===br));
  $('#br').classList.toggle('has',br!==null);$('#br').classList.toggle('on',sel===3);
  if(selTr&&!(vis&(1<<selTr.r)))selTr=null;
  const show=sel!==null||menuShown;$('#mb').classList.toggle('show',show);if(!show)setPanel(false);
  computeFit();clampBr();drawBars();setHover(null);lastPn=-1}
function clampBr(){const b=$('#br');b.style.setProperty('--sx','0px');
  const r=b.getBoundingClientRect(),m=14;let sx=0;
  if(r.left<m)sx=m-r.left;else if(r.right>innerWidth-m)sx=innerWidth-m-r.right;
  b.style.setProperty('--sx',sx+'px')}
document.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;sel=sel===l?null:l;br=null;menuShown=false;applySel()});
document.querySelectorAll('.bp').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;br=br===l?null:l;applySel()});
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{if(b.dataset.d!==day)loadDay(b.dataset.d)});

/* ---------- top bar ---------- */
const trk=$('#trk'),B=5;
const pct=m=>(m-T0)/(T1-T0)*100;
function drawBars(){const n=Math.ceil((T1-T0)/B),c=new Array(n).fill(0);
  TR.forEach(tr=>{if(!((1<<tr.r)&vis))return;for(let b=Math.floor((tr.t0-T0)/B);b<=Math.floor((tr.t1-T0)/B);b++)if(b>=0&&b<n)c[b]++});
  const mx=Math.max(1,...c);let d='';
  c.forEach((v,i)=>{const h=Math.max(2,v/mx*36);d+=`M${i+.18} 40h.64v${-h.toFixed(1)}h-.64z`});
  const bs=$('#bars');bs.setAttribute('viewBox',`0 0 ${n} 40`);bs.querySelector('path').setAttribute('d',d)}
function setT(v){t=Math.min(T1,Math.max(T0,v))}
function seek(ev){const r=trk.getBoundingClientRect();setT(T0+(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)))*(T1-T0))}
trk.addEventListener('pointerdown',e=>{drag=true;trk.setPointerCapture(e.pointerId);seek(e)});
trk.addEventListener('pointermove',e=>{if(drag)seek(e)});
trk.addEventListener('pointerup',()=>{drag=false});trk.addEventListener('pointercancel',()=>{drag=false});
trk.addEventListener('keydown',e=>{const k={ArrowRight:5,ArrowLeft:-5,ArrowUp:30,ArrowDown:-30}[e.key];if(k){setT(t+k);e.preventDefault()}});
$('#play').onclick=()=>{playing=!playing;$('#play').classList.toggle('on',playing)};
$('#spd').onclick=()=>{spdI=(spdI+1)%SPD.length;$('#spd').textContent=SPD[spdI]+'×'};
$('#fit').onclick=()=>computeFit();
const nowMin=()=>{const n=new Date();let m=n.getHours()*60+n.getMinutes();return m<T0?m+1440:m};
$('#clock').onclick=()=>setT(nowMin());

/* ---------- positions ---------- */
function ptAt(g,f){const d=f*g.len,c=g.cum;let i=1;while(i<c.length-1&&c[i]<d)i++;
  const u=(d-c[i-1])/((c[i]-c[i-1])||1),a=g.pts[i-1],b=g.pts[i];return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]}
function place(tr,tm){
  if(tm<tr.t0||tm>tr.t1)return null;
  const st=tr.st;let i=tr.ci;
  while(i>0&&tm<st[i][1])i--;
  while(i<st.length-1&&tm>=st[i+1][1])i++;
  tr.ci=i;
  if(tm<=st[i][2]||i===st.length-1){const s=S[st[i][0]];return{x:s.x,y:s.y,i,f:0}}
  const a=st[i],b=st[i+1],f=Math.min(1,Math.max(0,(tm-a[2])/((b[1]-a[2])||1))),L=tr.legs[i];
  const [x,y]=ptAt(L.g,L.rev?1-f:f);return{x,y,i,f}}

/* ---------- station hover card ---------- */
const tip=$('#tip');
function nextDeps(s,n,dir){const out=[];const L=s.deps;let lo=0,hi=L.length;
  while(lo<hi){const m=(lo+hi)>>1;if(L[m].t<t)lo=m+1;else hi=m}
  for(let i=lo;i<L.length&&out.length<n;i++){const tr=TR[L[i].ti];
    if(!((1<<tr.r)&vis))continue;if(dir!=null&&tr.d!==dir)continue;out.push({...L[i],tr})}
  return out}
const dotc=r=>`<span class="dot" style="background:var(--c${r})"></span>`;
function stationHTML(s){
  const rs=[1,2,3,4,5,6].filter(r=>s.mask&(1<<r));
  let rows='';
  for(const dir of [0,1]){const d=nextDeps(s,1,dir)[0];if(!d)continue;
    rows+=`<div class="rw"><b>${fmt(d.t)}</b><span class="n">${esc(d.tr.h)}</span><span class="m">${rel(d.t-t)}</span></div>`}
  if(!rows)rows='<div class="rw"><span class="m">–</span></div>';
  return`<div class="th"><b>${esc(s.name)}</b><span class="dots">${rs.map(dotc).join('')}</span></div>${rows}<div class="ft"><b>${s.cnt}</b> trains / day</div>`}
function gctHTML(){
  const L=nextDeps(GCT,6),all=GCT.deps.filter(d=>(1<<TR[d.ti].r)&vis);
  const rows=L.map(d=>`<div class="rw"><span class="trk" style="background:var(--b${d.tr.r})">${esc(d.track||'')}</span><b>${fmt(d.t)}</b><span class="n">${esc(d.tr.h)}</span><span class="m">${rel(d.t-t)}</span></div>`).join('')||'<div class="rw"><span></span><span class="m">–</span></div>';
  const h0=Math.floor(T0/60),h1=Math.floor(T1/60),hc=new Array(h1-h0+1).fill(0);
  const mix={1:0,2:0,4:0};
  all.forEach(d=>{hc[Math.floor(d.t/60)-h0]++;mix[fam(1<<TR[d.ti].r)]++});
  const mx=Math.max(1,...hc),peak=hc.indexOf(Math.max(...hc))+h0,ch=Math.floor(t/60)-h0;
  const hist=hc.map((v,i)=>`<i class="${i===ch?'now':''}" style="height:${Math.max(7,v/mx*100)}%"></i>`).join('');
  const inb=TR.filter(x=>x.vis&&x.d===1).length;
  return`<div class="th"><span class="dot" style="background:var(--ink)"></span><b>Grand Central</b></div>${rows}
  <div class="hist">${hist}</div>
  <div class="mix">${[[1,1],[2,2],[4,3]].filter(([k])=>mix[k]).map(([k,r])=>`<i style="flex:${mix[k]};background:var(--c${r})"></i>`).join('')}</div>
  <div class="stats"><div><b>${GCT.cnt}</b><small>Per day</small></div><div><b>${inb}</b><small>Inbound</small></div><div><b>${hm(peak*60)} ${ap(peak*60)}</b><small>Peak</small></div></div>`}
function refreshTip(force){
  if(!hover){tip.classList.remove('on');$('#hl').setAttribute('r',0);return}
  const mn=Math.floor(t),o=hover;
  if(force||mn!==lastMin){lastMin=mn;tip.className=(o===GCT?'gct ':'')+'on';tip.innerHTML=o===GCT?gctHTML():stationHTML(o)}
  const x=o.sx,y=o.sy,W=innerWidth,H=innerHeight,w=tip.offsetWidth,h=tip.offsetHeight;
  let px=x+18,py=y-h/2;if(px+w>W-12)px=x-18-w;px=Math.max(12,px);py=Math.min(H-86-h,Math.max($('#tl').offsetHeight+6,py));
  tip.style.transform=`translate(${px}px,${py}px)`;
  const hl=$('#hl');hl.setAttribute('cx',x);hl.setAttribute('cy',y);hl.setAttribute('r',(o===GCT||o===H125?11:7.5))}
function setHover(h){if(hover)hover.g.classList.remove('hov');hover=h;if(h)h.g.classList.add('hov');refreshTip(true)}

/* ---------- slide-over ---------- */
const pn=$('#pn');
function setPanel(on){pn.classList.toggle('open',on);$('#mb').innerHTML=on?'<svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  if(on){lastPn=-1;renderPanel(true)}else if(selTr)selectTrain(null);
  if(!manual)computeFit()}
$('#mb').onclick=()=>setPanel(!pn.classList.contains('open'));
addEventListener('keydown',e=>{if(e.key==='Escape'){if(selTr)selectTrain(null);else setPanel(false)}});
function selectTrain(tr){
  if(selTr)selTr.e.classList.remove('sel');
  selTr=tr;gTr.classList.toggle('focus',!!tr);$('#halo').classList.toggle('on',!!tr);
  if(tr){tr.e.classList.add('sel');gTr.appendChild(tr.e);
    const p=tr._p;if(p){const sx=p.x*V.s+V.x,sy=p.y*V.s+V.y,W=innerWidth,H=innerHeight,tl=$('#tl').offsetHeight+60,
      pr=pn.classList.contains('open')&&W>760?350:60;let dx=0,dy=0;
      if(sx<60)dx=60-sx;else if(sx>W-pr)dx=W-pr-sx;if(sy<tl)dy=tl-sy;else if(sy>H-110)dy=H-110-sy;
      if(dx||dy){Vt.x+=dx;Vt.y+=dy;manual=true;$('#fit').classList.add('show')}}}
  lastPn=-1;renderPanel(true)}
function rowHTML(tr){
  const p=tr._p,k=p?Math.min(p.i+(p.f>0?1:0),tr.st.length-1):0,nx=S[tr.st[k][0]].name,open=selTr===tr;
  let h=`<button class="row${open?' sel':''}" data-i="${tr.i}" aria-expanded="${open}"><span class="dot" style="background:var(--c${tr.r})"></span><span class="n"><b>${esc(tr.n)}</b>&nbsp; ${esc(tr.h)}</span><span class="m">${esc(nx)}</span></button>`;
  if(open){
    const s0=S[tr.st[0][0]].name,s1=S[tr.st[tr.st.length-1][0]].name,pc=Math.min(100,Math.max(0,(t-tr.t0)/(tr.t1-tr.t0)*100));
    let k0=p?(p.f>0?p.i+1:p.i):0,rows='';
    for(let j=k0;j<Math.min(tr.st.length,k0+6);j++){const a=tr.st[j];
      rows+=`<div class="sr${j===k0?' nx':''}"><span>${fmt(a[1])}</span><span>${esc(S[a[0]].name)}</span><span class="m">${rel(a[1]-t)}</span></div>`}
    h+=`<div class="dt" style="--rc:var(--c${tr.r})"><div class="od"><span>${esc(s0)}</span><span class="a">→</span><span>${esc(s1)}</span></div>
      <div class="pg"><i id="pgf" style="width:${pc.toFixed(1)}%"></i></div><div class="pt"><span>${fmt(tr.t0)}</span><span>${fmt(tr.t1)}</span></div><div class="sl">${rows}</div></div>`}
  return h}
function renderPanel(force){
  if(!pn.classList.contains('open')&&!force)return;
  const mn=Math.floor(t);if(!force&&mn===lastPn)return;lastPn=mn;
  const act=TR.filter(x=>x.vis).sort((a,b)=>a.t1-b.t1);
  if(selTr&&!selTr.vis){selTr.e.classList.remove('sel');selTr=null;gTr.classList.remove('focus');$('#halo').classList.remove('on')}
  const c=sel===null?'var(--ink)':`var(--c${br||sel})`,name=sel===null?'All lines':(br?RN[br]:RN[sel]);
  $('#pnh').innerHTML=`<span class="dot" style="background:${c}"></span><b>${name}</b><span class="m">${act.length}</span>`;
  const L=$('#pnl'),st=L.scrollTop;
  L.innerHTML=act.length?act.map(rowHTML).join(''):'<div class="none">No trains running</div>';L.scrollTop=st}
$('#pnl').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;const tr=TR[+r.dataset.i];selectTrain(selTr===tr?null:tr)});

/* ---------- map interaction ---------- */
const map=$('#map');
function hitStation(e){const r=map.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let best=null,bd=1e9;
  for(const s of S)if(s.vis){const d=Math.hypot(s.sx-x,s.sy-y);if(d<(s===GCT?20:15)&&d<bd){bd=d;best=s}}
  return best}
function hitTrack(e){const r=map.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let best=null,bd=9;
  for(const k in G){const g=G[k];if(!(g.mask&vis))continue;const p=g.pts;
    for(let i=1;i<p.length;i++){const ax=p[i-1][0]*V.s+V.x,ay=p[i-1][1]*V.s+V.y,bx=p[i][0]*V.s+V.x,by=p[i][1]*V.s+V.y,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
      let u=L?((px-ax)*dx+(py-ay)*dy)/L:0;u=Math.max(0,Math.min(1,u));const d=Math.hypot(px-ax-u*dx,py-ay-u*dy);if(d<bd){bd=d;best=g}}}
  return best}
function clickLine(g){
  const m=g.mask&vis,f=fam(m);
  if(f===1)sel=1;else if(f===2)sel=2;else if(f===4){sel=3;br=(m&8)?null:(m&16)?4:(m&32)?5:(m&64)?6:null}
  menuShown=true;applySel()}
const ptrs=new Map();let gd=0,panned=false;
function zoomAt(mx,my,k,inst){const ns=Math.min(fitS*80,Math.max(fitS*.7,Vt.s*k));k=ns/Vt.s;
  Vt.x=mx-(mx-Vt.x)*k;Vt.y=my-(my-Vt.y)*k;Vt.s=ns;
  if(inst){V.s=Vt.s;V.x=Vt.x;V.y=Vt.y}viewDirty=true;manual=true;$('#fit').classList.add('show')}
const rp=e=>{const r=map.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
map.addEventListener('pointerdown',e=>{map.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];gd=Math.hypot(a.x-b.x,a.y-b.y);panned=true;setHover(null)}else{panned=false;setHover(hitStation(e))}});
map.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(p){const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===2){const [a,b]=[...ptrs.values()],nd=Math.hypot(a.x-b.x,a.y-b.y),r=map.getBoundingClientRect();
      if(gd>0)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,nd/gd,true);gd=nd;
      Vt.x+=dx/2;Vt.y+=dy/2;V.x=Vt.x;V.y=Vt.y}
    else if(panned||Math.hypot(e.clientX-p.x0,e.clientY-p.y0)>5){
      if(!panned){panned=true;setHover(null);map.classList.add('pan')}
      Vt.x+=dx;Vt.y+=dy;V.x=Vt.x;V.y=Vt.y;viewDirty=true;manual=true;$('#fit').classList.add('show')}
    return}
  const h=hitStation(e);map.classList.toggle('ptr',!h&&!!hitTrack(e));
  if(h!==hover)setHover(h)});
const up=e=>{
  if(e.type==='pointerup'&&ptrs.size===1&&!panned&&!hitStation(e)){const g=hitTrack(e);if(g)clickLine(g)}
  ptrs.delete(e.pointerId);gd=0;if(!ptrs.size)map.classList.remove('pan')};
map.addEventListener('pointerup',up);map.addEventListener('pointercancel',up);
map.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!ptrs.size)setHover(null)});
map.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=rp(e);zoomAt(x,y,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)),false)},{passive:false});
map.addEventListener('dblclick',e=>{const [x,y]=rp(e);zoomAt(x,y,e.shiftKey?.5:2,false)});

/* ---------- frame loop ---------- */
let last=performance.now(),cHM='',cAP='';
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(playing&&!drag){t+=dt*SPD[spdI]/60;if(t>T1)t=T0}
  const k=1-Math.pow(0.0008,dt);
  for(const p of ['s','x','y']){const d=Vt[p]-V[p];if(Math.abs(d)>1e-4){V[p]+=d*k;viewDirty=true}else V[p]=Vt[p]}
  $('#stations').classList.toggle('z',V.s>fitS*3);
  if(viewDirty){
    gTracks.setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.s})`);
    S.forEach(s=>{s.sx=s.x*V.s+V.x;s.sy=s.y*V.s+V.y;s.g.setAttribute('transform',`translate(${s.sx.toFixed(1)} ${s.sy.toFixed(1)})`)});
    viewDirty=false}
  for(const tr of TR){
    const on=!!((1<<tr.r)&vis),p=on?place(tr,t):null;
    if(!p){if(tr.vis){tr.e.setAttribute('display','none');tr.vis=false}tr._p=null;continue}
    tr._p=p;tr.sx=p.x*V.s+V.x;tr.sy=p.y*V.s+V.y;
    if(!tr.vis){tr.e.removeAttribute('display');tr.vis=true}
    tr.e.setAttribute('cx',tr.sx.toFixed(1));tr.e.setAttribute('cy',tr.sy.toFixed(1))}
  if(selTr&&selTr.vis){const h=$('#halo');h.setAttribute('cx',selTr.sx.toFixed(1));h.setAttribute('cy',selTr.sy.toFixed(1));
    const f=$('#pgf');if(f)f.style.width=Math.min(100,Math.max(0,(t-selTr.t0)/(selTr.t1-selTr.t0)*100)).toFixed(1)+'%'}
  const pc=pct(t),a=hm(t),b=ap(t);
  $('#ph').style.left=pc+'%';
  const gs=[$('#g0'),$('#g1'),$('#g2')];gs[1].setAttribute('offset',pc/100);gs[2].setAttribute('offset',pc/100);
  if(a!==cHM){cHM=a;$('#hm').textContent=a;trk.setAttribute('aria-valuetext',a+' '+b)}if(b!==cAP){cAP=b;$('#ap').textContent=b}
  if(hover)refreshTip(false);
  renderPanel(false);
  requestAnimationFrame(frame)}

/* ---------- init ---------- */
(()=>{const n=new Date(),w=n.getDay();t=n.getHours()*60+n.getMinutes();loadDay(w===6?'sat':w===0?'sun':'wkd');setT(nowMin())})();
$('#play').classList.toggle('on',playing);
$('#spd').textContent=SPD[spdI]+'×';
V.s=Vt.s;V.x=Vt.x;V.y=Vt.y;
addEventListener('resize',()=>{if(!manual)computeFit();clampBr()});
requestAnimationFrame(frame);
</script>

</body></html>
