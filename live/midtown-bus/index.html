<style>

<script>
(function(){
const $=id=>document.getElementById(id);

// fixed route colors so they stay stable as more feeds are added

const SPEEDS=[1,10,100,300,600];
let D=null,LAND=[],trips=[],day=null,dayCache={},sel=-1,light=false;
let simT=0,speed=1,playing=true,view={cx:.5,cy:.5,z:10},W=0,H=0,dpr=1;
let T={}; // theme colors for canvas
function readTheme(){const s=getComputedStyle(document.documentElement);const g=n=>s.getPropertyValue(n).trim();
  T={bg:g('--bg'),land:g('--land'),line:g('--land-line'),halo:g('--halo'),fg:g('--fg'),mute:g('--mute'),bar:g('--bar'),barOn:g('--bar-on')};
  light=(document.documentElement.dataset.theme?document.documentElement.dataset.theme==='light':!matchMedia('(prefers-color-scheme:dark)').matches);}
function shade(h){if(!light)return h;const n=parseInt(h.slice(1),16);const f=.72;return`rgb(${(n>>16&255)*f|0},${(n>>8&255)*f|0},${(n&255)*f|0})`}
// mercator
const WX=lon=>(lon+180)/360, WY=lat=>{const r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2};
const S=()=>256*Math.pow(2,view.z);
const sx=wx=>(wx-view.cx)*S()+W/2, sy=wy=>(wy-view.cy)*S()+H/2;
function title(s){return s.toLowerCase().replace(/\b([a-z])/g,m=>m.toUpperCase()).replace(/\b(\d+)(St|Nd|Rd|Th)\b/g,(a,n,x)=>n+x.toLowerCase()).replace(/\bSbs\b/,'SBS').replace(/\b(Ne|Nw|Se|Sw|Fdr|Ny|Nyc|Cuny|Lirr|Jfk)\b/g,m=>m.toUpperCase())}
// ---- data prep
// one hue per borough; routes inside a borough get different lightness steps
const BH={Manhattan:212,Bronx:14,Brooklyn:142,Queens:280,'Staten Island':44};
const boro=id=>id.startsWith('Bx')?'Bronx':id[0]==='B'?'Brooklyn':id[0]==='M'?'Manhattan':id[0]==='Q'?'Queens':'Staten Island';
function hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12,c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
function colorize(){const g={};D.routes.forEach(r=>(g[boro(r.id)]=g[boro(r.id)]||[]).push(r));
  for(const b in g){const a=g[b],N=a.length,gcd=(x,y)=>y?gcd(y,x%y):x;let st=Math.max(1,Math.round(N*.4));while(gcd(st,N)!==1)st++;
    a.forEach((r,k)=>{const rank=N>1?(k*st)%N/(N-1):.5;r.col=hex(BH[b],86-rank*14,36+rank*38)})}}
function prep(){
  D.shW=D.shapes.map(p=>{const x=new Float64Array(p.length),y=new Float64Array(p.length),c=new Float64Array(p.length);
    for(let i=0;i<p.length;i++){x[i]=WX(p[i][1]);y[i]=WY(p[i][0]);if(i){const a=p[i-1],b=p[i],la=Math.cos((a[0]+b[0])/2*Math.PI/180);c[i]=c[i-1]+Math.hypot((b[0]-a[0])*111195,(b[1]-a[1])*111195*la)}}
    return{x,y,c}});
  D.stW=D.stops.map(s=>[WX(s[2]),WY(s[1]),title(s[0])]);
  colorize();D.routes.forEach((r,i)=>{
    const all=new Set();r.pats.forEach(p=>D.pats[p][3].forEach(s=>all.add(s)));r.all=[...all];
    const k=new Set(r.key);r.tp.forEach(s=>k.add(s));r.keyAll=[...k];r.term=new Set(r.key);
    let x0=9,y0=9,x1=0,y1=0;r.shapes.forEach(si=>{const s=D.shW[si];for(let i=0;i<s.x.length;i++){x0=Math.min(x0,s.x[i]);x1=Math.max(x1,s.x[i]);y0=Math.min(y0,s.y[i]);y1=Math.max(y1,s.y[i])}});r.bb=[x0,y0,x1,y1];r.cnt=0});
  D.bb=D.routes.reduce((a,r)=>[Math.min(a[0],r.bb[0]),Math.min(a[1],r.bb[1]),Math.max(a[2],r.bb[2]),Math.max(a[3],r.bb[3])],[9,9,0,0]);
  LAND=LAND.map(r=>r.map(p=>[WX(p[0]),WY(p[1])]));
}
function loadGrid(){fetch('grid.json').then(r=>r.json()).then(rows=>{GRID=rows.map(r=>{const n=r.length/2,x=new Float64Array(n),y=new Float64Array(n);let a=r[0],b=r[1];
  for(let i=0;i<n;i++){if(i){a+=r[2*i];b+=r[2*i+1]}x[i]=WX(a/1e4);y[i]=WY(b/1e4)}
  let x0=1,x1=0,y0=1,y1=0;for(let i=0;i<n;i++){x0=Math.min(x0,x[i]);x1=Math.max(x1,x[i]);y0=Math.min(y0,y[i]);y1=Math.max(y1,y[i])}return{x,y,x0,x1,y0,y1}})}).catch(()=>{})}
function loadDay(d){
  day=d;document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d));
  const go=rows=>{
    trips=rows.map(r=>{const pi=r[0],n=r.length-2,t=new Int32Array(n);let a=r[1];for(let i=0;i<n;i++){a+=r[i+2];t[i]=a}return{p:pi,r:D.pats[pi][0],t,s:t[0],e:t[n-1]}});
    buildHist();};
  if(dayCache[d])return go(dayCache[d]);
  fetch(d+'.json').then(r=>r.json()).then(rows=>{dayCache[d]=rows;if(day===d)go(rows)});
}
// ---- view
function fit(bb,pad){pad=pad||60;const w=Math.max(bb[2]-bb[0],1e-6),h=Math.max(bb[3]-bb[1],1e-6);
  const z=Math.log2(Math.min((W-pad*2)/w,(H-pad*2)/h)/256);view.z=Math.max(9,Math.min(16,z));view.cx=(bb[0]+bb[2])/2;view.cy=(bb[1]+bb[3])/2}
function zoomAt(px,py,z){z=Math.max(9,Math.min(18.5,z));const wx=view.cx+(px-W/2)/S(),wy=view.cy+(py-H/2)/S();view.z=z;view.cx=wx-(px-W/2)/S();view.cy=wy-(py-H/2)/S()}
function resize(){const r=$('map').getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;
  const h=hist.getBoundingClientRect();hist.width=h.width*dpr;hist.height=h.height*dpr}
// ---- sim
function pos(tr,t){const a=tr.t,n=a.length;if(t<a[0]||t>a[n-1])return null;
  let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(a[m]<=t)lo=m;else hi=m}
  const ds=D.pats[tr.p][4],f=a[hi]>a[lo]?(t-a[lo])/(a[hi]-a[lo]):0,d=ds[lo]+f*(ds[hi]-ds[lo]);
  const sh=D.shW[D.pats[tr.p][2]],c=sh.c;let l=0,h=c.length-1;while(h-l>1){const m=(l+h)>>1;if(c[m]<=d)l=m;else h=m}
  const g=c[h]>c[l]?Math.min(1,Math.max(0,(d-c[l])/(c[h]-c[l]))):0;return[sh.x[l]+(sh.x[h]-sh.x[l])*g,sh.y[l]+(sh.y[h]-sh.y[l])*g]}
// running vehicles sampled at each exact minute (same rule as the live count: start <= t <= end)
let HL={N:1,pitch:1};
function buildHist(){const R=D.routes.length,br=Array.from({length:R},()=>new Int32Array(1440)),tot=new Int32Array(1440);
  for(const tr of trips)for(let k=0;k<2;k++){const o=k*86400,lo=Math.max(0,Math.ceil((tr.s-o-30)/60)),hi=Math.min(1439,Math.floor((tr.e-o-30)/60));for(let m=lo;m<=hi;m++){br[tr.r][m]++;tot[m]++}}
  D.binsR=br;D.tot=tot;D.maxR=br.map(a=>Math.max(1,...a));D.maxTot=Math.max(1,...tot)}
// ---- draw
function line(si,w,col,al){const s=D.shW[si];ctx.beginPath();for(let i=0;i<s.x.length;i++){const x=sx(s.x[i]),y=sy(s.y[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.globalAlpha=1}
// static base layer (land + local bus grid), redrawn only when the view or theme changes
const base=document.createElement('canvas');let baseKey='',GRID=[];
let pinned=null,hov=null;const hits=[];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function busAt(px,py){let best=11,r=null;for(const h of hits){const d=Math.hypot(h[0]-px,h[1]-py);if(d<best){best=d;r={tr:h[2],k:h[3]}}}return r}
function drawTip(){const b=pinned||hov,tip=$('tip');if(!b){tip.hidden=true;return}
  const tt=simT+b.k*86400,p=pos(b.tr,tt);if(!p){if(b===pinned)pinned=null;tip.hidden=true;return}
  const tr=b.tr,r=D.routes[tr.r],st=D.pats[tr.p][3],x=sx(p[0]),y=sy(p[1]);
  let i=0;while(i<tr.t.length-1&&tr.t[i]<=tt)i++;
  const mins=Math.ceil((tr.t[i]-tt)/60),dest=D.stW[st[st.length-1]][2],nx=D.stW[st[i]][2];
  ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.lineWidth=1.8;ctx.strokeStyle=T.fg;ctx.stroke();
  const html='<b style="color:'+shade(r.col)+'">'+esc(r.id)+'</b><span>→ '+esc(dest)+'</span><div>'+esc(nx)+' · <em>'+(mins<=0?'now':mins+' min')+'</em></div>';
  if(tip.dataset.h!==html){tip.dataset.h=html;tip.innerHTML=html}
  tip.classList.toggle('l',x>W-260);tip.style.left=x+'px';tip.style.top=Math.max(30,Math.min(H-30,y))+'px';tip.hidden=false}
function drawBase(){const g=base.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle=T.bg;g.fillRect(0,0,W,H);
  g.fillStyle=T.land;g.strokeStyle=T.line;g.lineWidth=1;
  for(const r of LAND){g.beginPath();r.forEach((p,i)=>i?g.lineTo(sx(p[0]),sy(p[1])):g.moveTo(sx(p[0]),sy(p[1])));g.closePath();g.fill();g.stroke()}
  g.beginPath();const x0=view.cx-W/2/S()-.01,x1=view.cx+W/2/S()+.01,y0=view.cy-H/2/S()-.01,y1=view.cy+H/2/S()+.01;
  for(const l of GRID){if(l.x1<x0||l.x0>x1||l.y1<y0||l.y0>y1)continue;for(let i=0;i<l.x.length;i++){const x=sx(l.x[i]),y=sy(l.y[i]);i?g.lineTo(x,y):g.moveTo(x,y)}}
  g.globalAlpha=light?.5:.4;g.strokeStyle=light?'#aab3bd':'#4a5766';g.lineWidth=.8;g.lineJoin='round';g.stroke();g.globalAlpha=1}
function draw(){
  const bk=[view.cx,view.cy,view.z,W,H,dpr,T.bg,T.land,GRID.length].join();
  if(bk!==baseKey){baseKey=bk;base.width=W*dpr;base.height=H*dpr;drawBase()}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(base,0,0);ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!D)return;
  const R=D.routes;
  // lines
  R.forEach((r,i)=>{const on=sel<0||sel===i;if(!on)return;r.shapes.forEach(si=>line(si,sel===i?3.2:2.2,shade(r.col),sel===i?.95:.8))});
  R.forEach((r,i)=>{if(sel<0||sel===i)return;r.shapes.forEach(si=>line(si,1.5,shade(r.col),.16))});
  // stops
  const rects=[];
  const label=(x,y,t,strong)=>{ctx.font=(strong?'600 ':'500 ')+'11.5px Inter,system-ui,sans-serif';const w=ctx.measureText(t).width,rc=[x+8,y-7,x+8+w,y+7];
    for(const q of rects)if(rc[0]<q[2]&&rc[2]>q[0]&&rc[1]<q[3]&&rc[3]>q[1])return;rects.push(rc);
    ctx.lineWidth=3;ctx.strokeStyle=T.halo;ctx.lineJoin='round';ctx.strokeText(t,x+8,y+4);ctx.fillStyle=strong?T.fg:T.mute;ctx.fillText(t,x+8,y+4)};
  if(sel>=0){const r=R[sel],col=shade(r.col),all=true;
    const draws=[];
    if(all)r.all.forEach(s=>{if(!r.keyAll.includes(s))draws.push([s,0])});
    r.keyAll.forEach(s=>{if(!r.term.has(s))draws.push([s,1])});
    r.key.forEach(s=>draws.push([s,2]));
    for(const [s,k] of draws){const p=D.stW[s],x=sx(p[0]),y=sy(p[1]);if(x<-20||y<-20||x>W+20||y>H+20)continue;
      ctx.beginPath();ctx.arc(x,y,k===2?5.5:k?4:2.6,0,7);ctx.fillStyle=k?T.bg:col;ctx.fill();if(k){ctx.lineWidth=k===2?2.6:2;ctx.strokeStyle=col;ctx.stroke()}}
    // labels in priority order
    [2,1,0].forEach(k=>{if(k===0&&!all)return;for(const [s,kk] of draws){if(kk!==k)continue;const p=D.stW[s],x=sx(p[0]),y=sy(p[1]);if(x<-20||y<-20||x>W+160||y>H+20)continue;label(x,y,p[2],k>0)}})
  }
  // buses
  const counts=new Array(R.length).fill(0);let tot=0;hits.length=0;
  for(const tr of trips){for(let k=0;k<2;k++){const p=pos(tr,simT+k*86400);if(!p)continue;counts[tr.r]++;tot++;
    const on=sel<0||sel===tr.r,x=sx(p[0]),y=sy(p[1]);if(x<-10||y<-10||x>W+10||y>H+10)continue;if(on)hits.push([x,y,tr,k]);
    const col=shade(R[tr.r].col);ctx.globalAlpha=on?1:.3;
    ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fillStyle=T.land;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1}}
  drawTip();updateUI(counts,tot);
}
// ---- ui
let lastKey='';const rows=[],groups=[];
function buildList(){const ul=$('list');
  const gname=id=>id.startsWith('Bx')?'Bronx':id[0]==='B'?'Brooklyn':id[0]==='M'?'Manhattan':id[0]==='Q'?'Queens':'Staten Island',gm={};
  ['Manhattan','Bronx','Brooklyn','Queens','Staten Island'].forEach(n=>{const li=document.createElement('li');li.className='grp';li.dataset.c='0';
    const h=document.createElement('button');h.className='gh';h.setAttribute('aria-expanded','true');
    h.innerHTML='<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg><span></span><span class="n">0</span>';
    h.children[1].textContent=n;const gl=document.createElement('ul');gl.className='gl';
    h.onclick=()=>{const c=li.dataset.c==='1'?'0':'1';li.dataset.c=c;h.setAttribute('aria-expanded',c==='0')};
    li.append(h,gl);ul.appendChild(li);gm[n]={ul:gl,ids:[],n:h.children[2]};groups.push(gm[n])});
  D.routes.forEach((r,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='row';gm[gname(r.id)].ids.push(i);b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="dot"></span><span class="nm"></span><span class="lg"></span><span class="n">0</span>`;
  b.querySelector('.nm').textContent=r.id;b.querySelector('.lg').textContent=title(r.long);
  b.onclick=()=>select(sel===i?-1:i);li.appendChild(b);gm[gname(r.id)].ul.appendChild(li);rows.push(b)});
  paintDots()}
function paintDots(){D.routes.forEach((r,i)=>rows[i].querySelector('.dot').style.background=shade(r.col))}
let sdir='0';
function select(i){sel=i;rows.forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  $('list').hidden=i>=0;$('stops').hidden=i<0;$('side').classList.toggle('sel',i>=0);lastKey='';
  if(i>=0){const r=D.routes[i];sdir=r.mainStops['0']?'0':'1';fit(r.bb,70);renderStops()}else fit(D.bb,50)}
function renderStops(){const r=D.routes[sel],box=$('stops'),dirs=Object.keys(r.mainStops),col=shade(r.col);
  const nm=s=>D.stW[s][2];
  box.innerHTML='';box.style.setProperty('--rc',col);
  const rh=document.createElement('div');rh.className='rh';
  rh.innerHTML='<button aria-label="Back to routes"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 2.5 4 7l4.5 4.5"/></svg></button><b></b><span></span>';
  rh.querySelector('b').textContent=r.id;rh.querySelector('b').style.color=col;rh.querySelector('span').textContent=title(r.long);rh.querySelector('button').onclick=()=>select(-1);box.appendChild(rh);
  const dv=document.createElement('div');dv.className='dirs';
  dirs.forEach(d=>{const ms=r.mainStops[d],b=document.createElement('button');b.textContent='→ '+nm(ms[ms.length-1]);b.title=b.textContent;b.setAttribute('aria-pressed',d===sdir);b.onclick=()=>{sdir=d;renderStops()};dv.appendChild(b)});
  box.appendChild(dv);
  const ul=document.createElement('ul');ul.className='stl';ul.style.setProperty('--rc',col);const ms=r.mainStops[sdir],key=new Set(r.keyAll);
  ms.forEach((s,k)=>{const li=document.createElement('li'),b=document.createElement('button'),isK=key.has(s)||k===0||k===ms.length-1;if(isK)li.className='k';
    b.innerHTML='<span class="pt"><i></i></span><span></span>';b.lastChild.textContent=nm(s);
    b.onclick=()=>{const p=D.stW[s];view.cx=p[0];view.cy=p[1];if(view.z<15)view.z=15};li.appendChild(b);ul.appendChild(li)});
  box.appendChild(ul);box.scrollTop=0}
function updateUI(c,tot){const key=c.join(',')+'|'+tot+'|'+sel;if(key!==lastKey){lastKey=key;$('count').textContent=sel>=0?c[sel]:tot;groups.forEach(g=>{g.n.textContent=g.ids.reduce((a,i)=>a+c[i],0)});c.forEach((n,i)=>{const e=rows[i].querySelector('.n');e.textContent=n;e.classList.toggle('on',n>0)})}
  clockText();
  drawHist()}
// fixed-width bars on whole device pixels so every screen shows identical, even strokes
function drawHist(){if(!D||!D.binsR)return;__hist.draw(hx,sel>=0?D.binsR[sel]:D.tot,Math.min(.9999,simT/86400),{past:T.barOn,fut:T.bar,cur:T.fg})}
// ---- input
const ptrs=new Map();let moved=0,startPt=null,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;startPt=[e.offsetX,e.offsetY];if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId),n=[e.offsetX,e.offsetY];
  if(ptrs.size===1){view.cx-=(n[0]-o[0])/S();view.cy-=(n[1]-o[1])/S();moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1])}
  else if(ptrs.size===2){ptrs.set(e.pointerId,n);const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,view.z+Math.log2(d/pinch));pinch=d;moved+=10}
  ptrs.set(e.pointerId,n)});
const up=e=>{if(ptrs.size===1&&moved<6&&startPt)pick(startPt[0],startPt[1]);ptrs.delete(e.pointerId);pinch=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=0});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons||ptrs.size)return;hov=busAt(e.offsetX,e.offsetY);cv.style.cursor=hov?'pointer':''});
cv.addEventListener('pointerleave',()=>{hov=null;cv.style.cursor=''});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,view.z-e.deltaY*.0018)},{passive:false});
function pick(px,py){if(!D)return;const bb=busAt(px,py);if(bb){pinned=pinned&&pinned.tr===bb.tr&&pinned.k===bb.k?null:bb;return}pinned=null;let best=9,bi=-1;D.routes.forEach((r,i)=>{if(sel>=0&&sel!==i)return;r.shapes.forEach(si=>{const s=D.shW[si];
  for(let k=1;k<s.x.length;k++){const ax=sx(s.x[k-1]),ay=sy(s.y[k-1]),bx=sx(s.x[k]),by=sy(s.y[k]),dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L)):0,d=Math.hypot(px-ax-t*dx,py-ay-t*dy);if(d<best){best=d;bi=i}}})});
  select(bi>=0?bi:-1)}
$('zi').onclick=()=>zoomAt(W/2,H/2,view.z+.7);$('zo').onclick=()=>zoomAt(W/2,H/2,view.z-.7);$('zh').onclick=()=>select(-1);
addEventListener('keydown',e=>{if(e.key==='Escape'){pinned=null;select(-1)}});
const PLAY='<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',PAUSE='<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx=".6"/><rect x="9.5" y="2.5" width="3" height="11" rx=".6"/></svg>';
function setPlay(p){playing=p;$('play').innerHTML=p?PAUSE:PLAY;$('play').setAttribute('aria-label',p?'Pause':'Play')}
$('play').onclick=()=>setPlay(!playing);
// clock: viewer's own time zone by default, click to flip to MTA time (ET)
const ETF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
const etParts=ms=>{const o={};ETF.formatToParts(ms).forEach(p=>o[p.type]=+p.value);return o};
const P0=etParts(Date.now()),DAY0=Date.UTC(P0.year,P0.month-1,P0.day),OFF=Date.UTC(P0.year,P0.month-1,P0.day,P0.hour,P0.minute,P0.second)-Math.floor(Date.now()/1000)*1000;
const sameTz=OFF===-new Date().getTimezoneOffset()*60000;let lastClock='';
const fmtET=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',timeZoneName:'short'}),fmtLoc=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
function clockText(){const ms=DAY0+Math.floor(simT)*1000-OFF,o={};(sameTz||__clk.agency?fmtET:fmtLoc).formatToParts(ms).forEach(p=>o[p.type]=p.value);
  const html=__clk.cells(o.hour+':'+o.minute)+'<small>'+(o.dayPeriod?o.dayPeriod.toUpperCase():'')+'</small><em>'+(o.timeZoneName||'')+'</em>';if(html!==lastClock){lastClock=html;$('clock').innerHTML=html}}

window.addEventListener('clkmode',()=>{lastClock=''});
function syncLive(){$('live').classList.toggle('on',speed===1);$('live').title=speed===1?'Live: running at the current time':'Back to live (1×)'}
$('live').onclick=()=>{speed=1;$('spd').textContent='1×';const p=etParts(Date.now());simT=p.hour*3600+p.minute*60+p.second;
  const wd=new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();loadDay(wd===0?'sun':wd===6?'sat':'wkd');setPlay(true);syncLive()};
syncLive();
$('spd').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];syncLive();$('spd').textContent=speed+'\u00d7'};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>loadDay(b.dataset.d));
function scrub(e){simT=__hist.frac(hist,e.clientX)*86399}
let scrubbing=false;hist.addEventListener('pointerdown',e=>{scrubbing=true;hist.setPointerCapture(e.pointerId);scrub(e)});hist.addEventListener('pointermove',e=>{if(scrubbing)scrub(e)});hist.addEventListener('pointerup',()=>scrubbing=false);
window.__setTheme=()=>{readTheme();if(D)paintDots()};
addEventListener('resize',resize);new ResizeObserver(resize).observe($('map'));
// ---- boot
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing&&D)simT=(simT+dt*speed)%86400;draw();requestAnimationFrame(frame)}
readTheme();setPlay(true);resize();
const ny=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
simT=ny.getHours()*3600+ny.getMinutes()*60;const wd=ny.getDay();const today=wd===0?'sun':wd===6?'sat':'wkd';
Promise.all([fetch('static.json').then(r=>r.json()),fetch('land.json').then(r=>r.json())]).then(([d,l])=>{D=d;LAND=l;prep();buildList();$('msg').remove();resize();fit(D.bb,50);loadDay(today);loadGrid();requestAnimationFrame(frame)})
 .catch(()=>{$('msg').textContent='Could not load data'});
})();
