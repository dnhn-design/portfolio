<style>
/* Layout: the user's diagram fills the width as the stage; one slim dark control bar underneath (play, clock, speed, day-load timeline, day type). */
:root{
  --paper:#eef0f6; --stage:#ffffff; --pink:#cd3cec; --blue:#676df8; --focus:#8fa6ff;
  --bar:#0e1117; --bar-ink:#f2f4f8; --bar-mute:#7d8494; --bar-dim:#4a5060; --bar-hi:#d6dae4; --bar-seg:#1a1e27; --bar-line:#232834;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#07090d;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#07090d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--bar-ink);
  padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:grid;gap:10px}
.scroller{overflow-x:auto;border-radius:12px;background:var(--stage)}
.stage{position:relative;min-width:900px;aspect-ratio:2000/1352;background:var(--stage);--k:1}
.stage img{display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.busin{opacity:0;transition:opacity .5s;transform:scale(var(--k))}
.busin.on{opacity:1}
.bus{cursor:pointer}
.bus .halo{fill:none;stroke:#15171f;stroke-width:2.5;opacity:0;transition:opacity .15s}
.bus:hover .halo,.bus.sel .halo,.bus:focus-visible .halo{opacity:.9}
.bus:focus-visible{outline:none}
.tip{position:absolute;z-index:3;pointer-events:none;background:#0e1117;color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;transform:translate(-50%,calc(-100% - 22px))}
.tip b{font-weight:600}
.tip .c{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tip .m{color:#aab0c0;font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}
.bar{display:flex;align-items:center;gap:clamp(10px,2vw,22px);background:var(--bar);border-radius:14px;padding:10px 12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.hist:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.play{width:44px;height:44px;border-radius:50%;background:var(--bar-ink);color:var(--bar);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.clk{display:flex;align-items:baseline;gap:4px;padding:6px 4px;border-radius:6px;font-variant-numeric:tabular-nums;flex:none}
.clk .t{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.clk .ap{font-size:13px;color:var(--bar-mute)}
.clk .dot{width:7px;height:7px;border-radius:50%;background:var(--bar-dim);align-self:center;margin-right:4px}
.clk.live .dot{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.22)}
.spd{min-width:48px;padding:6px 4px;color:var(--bar-mute);font-weight:600;font-variant-numeric:tabular-nums;border-radius:6px;flex:none;text-align:center}
.spd:hover,.clk:hover{color:var(--bar-ink)}
.hist{position:relative;flex:1;min-width:80px;height:44px;cursor:ew-resize;touch-action:none;border-radius:4px}
.hist svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hist .hi{clip-path:inset(0 100% 0 0)}
.hist .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;border-radius:1px;left:0;pointer-events:none}
.seg{display:inline-flex;background:var(--bar-seg);border:1px solid var(--bar-line);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{padding:8px 11px;border-radius:7px;color:var(--bar-mute);font-weight:500}
.seg button:hover{color:var(--bar-ink)}
.seg button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar)}
@media (max-width:640px){.bar{flex-wrap:wrap}.hist{order:5;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.busin{transition:none}}
</style>

    const ux=(px-cx)/l1,uy=(py-cy)/l1,vx=(nx-cx)/l2,vy=(ny-cy)/l2;
    d+='L'+(cx+ux*r)+' '+(cy+uy*r)+'Q'+cx+' '+cy+' '+(cx+vx*r)+' '+(cy+vy*r);
  }
  const e=pts[pts.length-1];
  return d+'L'+e[0]+' '+e[1];
}
// build geometry + project timepoints onto each path (monotonic along the path)
const geo=document.getElementById('geo');
for(const id in P){
  const p=P[id];
  const el=document.createElementNS(SVGNS,'path');
  el.setAttribute('d',rounded(p.pts,p.rs));el.setAttribute('fill','none');
  geo.appendChild(el);p.el=el;p.len=el.getTotalLength();
  p.L=[];let from=0;
  for(const k of ORDER[id]){
    const [mx,my]=p.mk[k];let best=from,bd=1e9;
    for(let s=from;s<=p.len;s+=1){const q=el.getPointAtLength(s);const dd=(q.x-mx)**2+(q.y-my)**2;if(dd<bd){bd=dd;best=s}}
    p.L.push(best);from=best;
  }
}

// ---- time + schedule helpers (New York wall clock carried as a UTC-labelled timestamp)
const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
function nycNow(){const o={};for(const x of fmt.formatToParts(new Date()))o[x.type]=+x.value;return Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second)+Date.now()%1000}
function nthDow(y,m,dow,n){const f=new Date(Date.UTC(y,m,1)).getUTCDay();return 1+((dow-f+7)%7)+7*(n-1)}
function lastMon(y,m){const l=new Date(Date.UTC(y,m+1,0));return l.getUTCDate()-((l.getUTCDay()+6)%7)}
function schedFor(t){
  const d=new Date(t),y=d.getUTCFullYear(),m=d.getUTCMonth(),dd=d.getUTCDate(),dow=d.getUTCDay();
  let name=null,type=null;
  if(m===0&&dd===1){name="New Year's Day";type='Sundays'}
  else if(m===4&&dd===lastMon(y,4)){name='Memorial Day';type='Sundays'}
  else if(m===8&&dd===nthDow(y,8,1,1)){name='Labor Day';type='Sundays'}
  else if(m===10&&dd===nthDow(y,10,4,4)){name='Thanksgiving Day';type='Sundays'}
  else if(m===11&&dd===25){name='Christmas Day';type='Sundays'}
  else if(m===6&&dd===4){name='Independence Day';type='Saturdays'}
  else if(m===1&&dd===nthDow(y,1,1,3)){name="Presidents Day";type='Saturdays'}
  if(!type)type=dow===0?'Sundays':dow===6?'Saturdays':'Weekdays';
  return {type,name,dow};
}
const DAYLBL={Weekdays:'Weekday',Saturdays:'Saturday',Sundays:'Sunday'};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function hm(min,sec){min=((min%1440)+1440)%1440;let h=Math.floor(min/60),m=Math.floor(min%60);const ap=h>=12?'PM':'AM';h=h%12||12;
  return h+':'+String(m).padStart(2,'0')+(sec!==undefined?':'+String(Math.floor((min%1)*60)).padStart(2,'0'):'')+' '+ap}

// ---- state
const S={live:true,paused:false,speed:1,day:'auto',t:nycNow(),routes:{M23:true,M34:true,M34A:true},sel:null,dayEff:null};
const $=id=>document.getElementById(id);
const busLayer=$('buses'),stage=$('stage'),tip=$('tip');
const active=new Map();

function makeBus(col){
  const g=document.createElementNS(SVGNS,'g');g.setAttribute('class','bus');g.setAttribute('tabindex','0');g.setAttribute('role','img');
  const inner=document.createElementNS(SVGNS,'g');inner.setAttribute('class','busin');
  const hit=document.createElementNS(SVGNS,'circle');hit.setAttribute('r',22);hit.setAttribute('fill','transparent');
  const halo=document.createElementNS(SVGNS,'circle');halo.setAttribute('r',18.5);halo.setAttribute('class','halo');
  const c=document.createElementNS(SVGNS,'circle');c.setAttribute('r',15);c.setAttribute('fill',COL[col]);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',3);
  const u=document.createElementNS(SVGNS,'use');u.setAttribute('href','#bus-glyph');u.setAttribute('x',-9);u.setAttribute('y',-9);u.setAttribute('width',18);u.setAttribute('height',18);u.setAttribute('fill','#fff');
  inner.append(hit,halo,c,u);g.appendChild(inner);return g;
}
function tipHTML(b,mm){
  const T=b.T,ord=ORDER[b.pid],p=P[b.pid];
  let next=0;while(next<T.length-1&&T[next]<=mm)next++;
  const last=ord.length-1,dest=NAMES[ord[last]];
  const arriving=mm>=T[last];
  return '<div><span class="c" style="background:'+COL[p.col]+'"></span><b>'+ROUTE_LONG[p.route]+'</b> to '+dest+'</div>'+
    '<div>'+(arriving?'Arrived at '+hm(T[last]):'Next: '+NAMES[ord[next]]+' <span class="m">'+hm(T[next])+'</span>')+'</div>'+
    '<div style="opacity:.7">Left '+NAMES[ord[0]]+' <span class="m">'+hm(T[0])+'</span></div>';
}
function placeTip(g){
  const b=g.__b;if(!b)return;
  const r=g.getBoundingClientRect(),s=stage.getBoundingClientRect();
  tip.style.left=(r.left+r.width/2-s.left)+'px';tip.style.top=(r.top+r.height/2-s.top)+'px';
}
function showTip(g){S.sel=g;tip.hidden=false;placeTip(g)}
function hideTip(g){if(S.sel===g)S.sel=null;tip.hidden=true}

function frame(){
  if(S.live)S.t=nycNow();
  const d=new Date(S.t);
  const m=d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60+d.getUTCMilliseconds()/60000;
  const sc=schedFor(S.t),prev=schedFor(S.t-864e5);
  const today=S.day==='auto'?sc.type:S.day;
  const yest=S.day==='auto'?prev.type:S.day;
  const want=new Map();
  const scan=(key,list,off,dow,tag)=>{
    for(let i=0;i<list.length;i++){
      const r=list[i],mm=m+off;
      if(r[2]>mm)break;
      const last=r[r.length-1];if(mm>last+0.4)continue;
      if(r[1]===1&&dow!==1)continue;if(r[1]===2&&dow===1)continue;
      const pid=r[0];if(!S.routes[P[pid].route])continue;
      want.set(tag+key+i,{pid,T:r.slice(2),mm});
    }
  };
  scan(today,TRIPS[today],0,sc.dow,'a');
  if(m<150)scan(yest,TRIPS[yest],1440,prev.dow,'b');
  for(const [k,g] of active){if(!want.has(k)){g.firstChild.classList.remove('on');active.delete(k);if(S.sel===g)hideTip(g);setTimeout(()=>g.remove(),520)}}
  const counts={M23:0,M34:0,M34A:0};
  for(const [k,w] of want){
    let g=active.get(k);const p=P[w.pid];
    if(!g){g=makeBus(p.col);g.__b=w;active.set(k,g);busLayer.appendChild(g);
      g.addEventListener('pointerenter',()=>showTip(g));g.addEventListener('pointerleave',()=>hideTip(g));
      g.addEventListener('focus',()=>showTip(g));g.addEventListener('blur',()=>hideTip(g));
      g.addEventListener('click',()=>showTip(g));
      requestAnimationFrame(()=>g.firstChild.classList.add('on'));}
    g.__b=w;counts[p.route]++;
    const T=w.T;let i=0;while(i<T.length-2&&T[i+1]<=w.mm)i++;
    const span=T[i+1]-T[i],f=span>0?Math.min(1,Math.max(0,(w.mm-T[i])/span)):0;
    const len=p.L[i]+f*(p.L[i+1]-p.L[i]);
    const q=p.el.getPointAtLength(len);
    g.setAttribute('transform','translate('+q.x.toFixed(1)+' '+q.y.toFixed(1)+')');
    const ord=ORDER[w.pid];
    g.setAttribute('aria-label',ROUTE_LONG[p.route]+' to '+NAMES[ord[ord.length-1]]);
    if(S.sel===g){tip.innerHTML=tipHTML(w,w.mm);placeTip(g)}
  }
  // readouts
  const ct=hm(m).split(' ');if($('clkT').textContent!==ct[0]){$('clkT').textContent=ct[0];$('clkA').textContent=ct[1]}
  if(S.dayEff!==today){S.dayEff=today;for(const b of $('daySeg').children)b.setAttribute('aria-pressed',String(b.dataset.v===today));drawHist(today)}
  const px=(m/1440*100).toFixed(2);
  if(S.px!==px){S.px=px;$('ph').style.left=px+'%';$('hiSvg').style.clipPath='inset(0 '+(100-px)+'% 0 0)';$('hist').setAttribute('aria-valuenow',Math.floor(m))}
}
let last=performance.now();
function loop(now){
  const dt=now-last;last=now;
  if(!S.live&&!S.paused)S.t+=dt*S.speed;
  frame();requestAnimationFrame(loop);
}

// ---- controls
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const SPEEDS=[1,10,60,120,300];
function syncUI(){
  $('playBtn').innerHTML=(S.paused&&!S.live)?PLAY:PAUSE;$('playBtn').setAttribute('aria-label',(S.paused&&!S.live)?'Play':'Pause');
  $('clkBtn').classList.toggle('live',S.live);$('spdBtn').textContent=S.speed+'×';
}
function goLive(){S.live=true;S.paused=false;S.speed=1;S.day='auto';syncUI()}
function leaveLive(){S.live=false}
$('clkBtn').onclick=goLive;
$('playBtn').onclick=()=>{if(S.live){leaveLive();S.paused=true}else S.paused=!S.paused;syncUI()};
$('spdBtn').onclick=()=>{const i=SPEEDS.indexOf(S.speed);S.speed=SPEEDS[(i+1)%SPEEDS.length];if(S.live){leaveLive()}S.paused=false;syncUI()};
$('daySeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.day=b.dataset.v};
// load histogram: buses on the road per 4 minutes for the chosen schedule
function drawHist(day){
  const N=360,cnt=new Array(N).fill(0);
  for(const r of TRIPS[day]){const s=r[2],e=r[r.length-1];for(let i=Math.floor(s/4);i<=Math.min(N-1,Math.floor(e/4));i++)cnt[i]++}
  for(const r of TRIPS[day]){const e=r[r.length-1];if(e>=1440)for(let i=0;i<=Math.floor((e-1440)/4);i++)cnt[i]++}
  let mx=1;for(const k of ['Weekdays','Saturdays','Sundays']){const c=new Array(N).fill(0);for(const r of TRIPS[k]){for(let i=Math.floor(r[2]/4);i<=Math.min(N-1,Math.floor(r[r.length-1]/4));i++)c[i]++}mx=Math.max(mx,...c)}
  let h='';for(let i=0;i<N;i++){const v=Math.max(1.5,cnt[i]/mx*42);h+='<rect x="'+(i+.12)+'" y="'+(44-v).toFixed(1)+'" width=".76" height="'+v.toFixed(1)+'"/>'}
  $('barsDim').innerHTML=h;$('barsHi').innerHTML=h;
}
const hist=$('hist');
function scrubTo(e){const r=hist.getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));leaveLive();const d=new Date(S.t);S.t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,Math.min(1439,Math.round(f*1440)),0);syncUI()}
hist.addEventListener('pointerdown',e=>{hist.setPointerCapture(e.pointerId);S.drag=true;scrubTo(e)});
hist.addEventListener('pointermove',e=>{if(S.drag)scrubTo(e)});
hist.addEventListener('pointerup',()=>{S.drag=false});
hist.addEventListener('keydown',e=>{const k={ArrowRight:5,ArrowLeft:-5,ArrowUp:30,ArrowDown:-30}[e.key];if(!k)return;e.preventDefault();leaveLive();const d=new Date(S.t);S.t=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,Math.min(1439,Math.max(0,d.getUTCHours()*60+d.getUTCMinutes()+k)),0);syncUI()});
syncUI();

// keep bus size readable as the stage scales
function size(){const w=stage.getBoundingClientRect().width||1000;stage.style.setProperty('--k',Math.min(1.7,Math.max(1,1467/w)).toFixed(3))}
new ResizeObserver(size).observe(stage);size();
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.bus')){tip.hidden=true;S.sel=null}});

requestAnimationFrame(loop);
})();
</script>

</body></html>
