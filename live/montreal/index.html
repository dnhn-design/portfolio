<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --hover: #10161f; --sel: #131b27; --raise: #0f151e; --glass: #0c1017ee; --glass-2: #0c1017d9;
  --soft: #ffffff10; --soft-2: #ffffff1c; --ring: #5d7fa6; --shadow: #0008;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f9fafc; --line: #dde2ea; --line-2: #cdd4de;
  --fg: #151c28; --mute: #5b6677; --dim: #8791a1;
  --chip: #151c28; --chip-fg: #f4f6fa;
  --hover: #eef1f6; --sel: #e6ebf2; --raise: #f3f5f9; --glass: #f9fafcf0; --glass-2: #f9fafce6;
  --soft: #00000010; --soft-2: #0000001a; --ring: #3b6aa6; --shadow: #2a354622;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-variant-numeric: tabular-nums;
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#selchip { flex-basis: 100%; display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
#selchip button { flex: none; background: var(--soft); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; }
#selchip button:hover { color: var(--fg); background: var(--soft-2); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 6px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 5px 16px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--ring); outline-offset: -1px; }
.row .no { font: 400 11.5px var(--sans); color: var(--mute); white-space: nowrap; }
.row .no.m { color: var(--c); font-weight: 500; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; overflow-wrap: anywhere; line-height: 1.25; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; overflow-wrap: anywhere; line-height: 1.25; }
.empty { padding: 20px 16px; color: var(--mute); font-size: 12.5px; line-height: 1.45; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--raise); padding: 10px 16px 9px; max-height: 46%; overflow-y: auto; flex: none; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 2px 8px; align-items: baseline; flex-wrap: wrap; }
#detail .t b { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
#detail .t span { color: var(--mute); font-size: 11.5px; flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
#stops li { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .nm { overflow-wrap: anywhere; line-height: 1.25; }
#stops li .tm { font-size: 11px; white-space: nowrap; }
#stops li .zc { font: 500 10px var(--sans); letter-spacing: .04em; white-space: nowrap; }
#stops li.gone { opacity: .45; }
/* key */
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: max-content; max-width: min(330px, 100%); background: var(--glass); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--soft); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.emph { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); }
#legend .emph button { padding: 4px 11px; border-radius: 6px; font-size: 11.5px; line-height: 1.2; color: var(--mute); white-space: nowrap; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.k-lines button { display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px; text-align: left; white-space: nowrap; line-height: 1.2; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--soft-2); color: var(--fg); }
#legend #zones { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; padding: 6px 8px; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; color: var(--mute); font-size: 11.5px; text-align: left; }
#zones.on { color: var(--fg); background: var(--soft); }
#zones .zk { display: inline-flex; gap: 6px; font: 600 10.5px var(--sans); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); right: 52px; top: 14px; display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
#sublegend[hidden] { display: none; }
#sublegend button { pointer-events: auto; background: var(--glass); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px/1.2 var(--sans); padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; padding: 0; background: var(--glass-2); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: var(--hover); }
#themetog { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; }
#themetog:hover { color: var(--fg); background: var(--hover); }
#themetog svg { display: block; }
#tip {
  position: absolute; pointer-events: none; background: var(--glass); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; font-size: 12px;
  color: var(--fg); width: max-content; max-width: min(260px, 70%); z-index: 5; box-shadow: 0 6px 24px var(--shadow); transform: translate(12px, 14px); line-height: 1.3; overflow-wrap: anywhere;
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#tip .z { font: 600 10.5px var(--sans); letter-spacing: .04em; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #themetog:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; min-width: 42px; text-align: center; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 100px; cursor: ew-resize; touch-action: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }
  .row { padding: 7px 16px; grid-template-columns: 56px minmax(0, 1fr); }
  .row .to { font-size: 15px; }
  #detail { padding: 10px 16px; max-height: 70%; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

/* ---------- interaction ---------- */
const tip = $('tip');

}

function lineAt(px, py) {

}

    if (s.ci >= 0) {

document.addEventListener('keydown', (e) => {

boot();

})();
