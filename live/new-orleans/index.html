/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default with a light toggle. */

  --cv-ctylbl: rgba(150,165,190,.40); --cv-core: #ffffff; --cv-ring: rgba(255,255,255,.9);
  --hist-past: rgba(214,222,234,.66); --hist-future: rgba(150,164,186,.28); --hist-head: #f4f7fb;

}
:root[data-theme="light"] {

  --glass: #ffffffee; --glass-2: #ffffffe0; --tipbg: #ffffffF2; --hover: #0000000d; --focus: #4a78b0; --shadow: #0003;
  --cv-bg: #eef1f5; --cv-ghost: 80,98,125; --cv-cty: rgba(70,90,120,.26); --cv-ctyfill: rgba(70,90,120,.045);
  --cv-water: rgba(90,150,205,.26); --cv-river: rgba(70,130,190,.50); --cv-lbl: rgba(20,26,36,.96); --cv-halo: rgba(246,248,251,.95);
  --cv-ctylbl: rgba(70,85,110,.46); --cv-core: #ffffff; --cv-ring: rgba(20,26,36,.55);
  --hist-past: rgba(40,52,72,.62); --hist-future: rgba(90,105,130,.24); --hist-head: #141a24;
  color-scheme: light;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app {

  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--cv-bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.row .no { font: 600 12px var(--sans); color: var(--c); }

.empty { padding: 20px 16px; color: var(--mute); font-size: 12.5px; line-height: 1.45; }

#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }

#stops li.nx { color: var(--fg); }
#stops li .tm { font-size: 11px; white-space: nowrap; }
#stops li span:last-child { overflow-wrap: anywhere; }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: max-content; max-width: min(340px, 100%); background: var(--glass); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 24px var(--shadow); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--hover); }
#legend button:focus-visible, #play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #theme:focus-visible, #zoomc button:focus-visible, #sublegend button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.emph { display: inline-flex; flex: 0 1 auto; max-width: 100%; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); }
#legend .emph button { flex: 0 0 auto; padding: 4px 11px; border-radius: 6px; font-size: 11.5px; line-height: 1.2; color: var(--mute); text-align: center; white-space: nowrap; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: flex; flex-wrap: wrap; gap: 3px; }

#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 140px); display: flex; gap: 4px; flex-wrap: wrap; }

#theme { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; }

  #bar { gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 42px; height: 42px; }
  #clock { font-size: 26px; }
  #clock small { font-size: 15px; }

document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
