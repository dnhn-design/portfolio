<style>
/* Layout: full-bleed map; one floating pill (play, time, speed, timeline, day); bare route rail on the right; detail lives in a slide-over drawer. */
:root{
  --bg:#edf1ef; --panel:#fafcfb; --fg:#15201d; --muted:#5a6a65; --line:#d3dbd8;
  --map:#e3e9e6; --accent:#d4600f; --live:#1c8a4a; --chip-text:#fff; --halo:#e3e9e6;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1312; --panel:#151c1b; --fg:#e5ece9; --muted:#93a39e; --line:#27322f;
  --map:#101716; --accent:#f28d4a; --live:#47c47d; --halo:#101716; --chip-text:#0d1312; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1312; --panel:#151c1b; --fg:#e5ece9; --muted:#93a39e; --line:#27322f;
  --map:#101716; --accent:#f28d4a; --live:#47c47d; --halo:#101716; --chip-text:#0d1312; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.35}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i .f{fill:currentColor;stroke:none}
svg.i[hidden]{display:none!important}
.app{height:100%}
.stage{position:relative;height:100%;background:var(--map);overflow:hidden;overflow:clip}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
.ghost{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:17px;cursor:pointer;color:var(--muted);font:600 14px var(--f-body);font-variant-numeric:tabular-nums}
.ghost:hover{color:var(--fg)}
.float{background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line)}
/* floating controls */
.bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:16px;max-width:680px;margin-inline:auto;
  display:flex;align-items:center;gap:6px 8px;padding:6px 10px 6px 6px;border-radius:999px;z-index:3}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.play svg.i{width:18px;height:18px}
.clk{display:flex;align-items:baseline;gap:3px;background:none;border:0;cursor:pointer;color:var(--fg);padding:0 4px;font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.clk small{font:500 12px var(--f-body);color:var(--muted)}
.clk .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);align-self:center;margin-right:3px}
.clk.on .dot{background:var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clk.on .dot{animation:none}}
canvas.tl{position:relative;inset:auto;width:auto;flex:1 1 120px;min-width:0;height:28px;cursor:pointer;touch-action:none;border-radius:4px}
.tools{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:2px;border-radius:999px;padding:2px;z-index:3}
.rail{position:absolute;top:60px;right:max(16px,env(safe-area-inset-right,0px));bottom:76px;width:68px;display:flex;flex-direction:column;z-index:2;max-height:max-content}
#list{overflow-y:auto;min-height:0;scrollbar-width:none;display:flex;flex-direction:column;gap:3px;padding:2px}
#list::-webkit-scrollbar{display:none}
.row{display:grid;grid-template-columns:1fr 14px;align-items:center;gap:3px;width:100%;background:none;border:0;border-radius:4px;padding:0;cursor:pointer;opacity:.92}
.row:hover,.row[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--fg)}
.row.off{opacity:.45}
.row .n{font:600 11px var(--f-body);text-align:left;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 3px var(--map),0 0 3px var(--map),0 0 3px var(--map)}
.chip{display:block;font:700 14px/1 var(--f-display);color:var(--chip-text);text-align:center;border-radius:4px;padding:5px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;max-width:240px;z-index:4}
.cap{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:76px;right:100px;max-width:420px;display:flex;align-items:center;gap:10px;border-radius:8px;padding:6px 10px;z-index:2;pointer-events:none}
.cap .chip{flex:none;min-width:44px;padding:5px 7px}
.cap div{min-width:0}
.cap b{display:block;font:600 14px var(--f-body);overflow-wrap:anywhere}
.cap div span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live)}
/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:5;
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.d-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;flex:1}
.tab{height:34px;width:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:disabled{opacity:.35;cursor:default}
.d-body{flex:1;min-height:0;overflow:auto;padding:12px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.fig{display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.fig b{color:var(--fg);display:block;font:600 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.fig b i{font-style:normal;color:var(--muted);font-weight:500}
.fig span,.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span{display:flex;align-items:center;gap:6px}
.kv svg.i,.fig svg.i,.lbl svg.i,.cap svg.i,.tbl th svg.i{width:16px;height:16px;color:var(--muted)}
.chk{display:inline-flex;gap:8px;align-items:center;margin:0 14px 14px 0;cursor:pointer;color:var(--muted)}
.info{display:inline-flex;vertical-align:top}
.notes{margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:4px 6px 6px;position:sticky;top:-12px;background:var(--panel)}
.tbl td{padding:6px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.tbl tr[data-r]{cursor:pointer}.tbl tr[data-r]:hover td{background:var(--bg)}
.tbl tr.off td{opacity:.55}
.tbl td .chip{min-width:44px}
.tbl small{display:block;color:var(--muted);font-size:11.5px}
h3{margin:0 0 8px;font:600 20px/1.15 var(--f-display)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.chips .chip{padding:3px 7px}
.dep{display:grid;grid-template-columns:50px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.dep .chip{font-size:13px;padding:3px 2px}
.dep span:last-child{color:var(--muted)}
@media (max-width:620px){
  .bar{flex-wrap:wrap;border-radius:24px;padding:8px 10px}
  canvas.tl{order:-1;flex-basis:100%}
  .play{width:36px;height:36px}
  .rail{bottom:122px}
  .cap{bottom:122px;right:92px}
}
</style>

    </section>
  </div>
</div>

const showCard=()=>renderDrawer();

/* ---------- theme ---------- */
let th={};
const dark=()=>{const a=document.documentElement.dataset.theme;return a?a==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
function readTheme(){
  const c=getComputedStyle(document.documentElement),g=n=>c.getPropertyValue(n).trim();
  th={bg:g('--map'),panel:g('--panel'),fg:g('--fg'),muted:g('--muted'),accent:g('--accent'),halo:g('--halo'),dark:dark()};
}
function tint(hex){
  if(!dark())return hex;
  const n=parseInt(hex.slice(1),16),m=v=>Math.round(v+(255-v)*.35);
  return `rgb(${m(n>>16)},${m((n>>8)&255)},${m(n&255)})`;

/* ---------- map view ---------- */
let W=0,H=0,dpr=1;const V={x:0,y:0,k:3000};
const px=x=>(x-V.x)*V.k+W/2,py=y=>(y-V.y)*V.k+H/2;
function resize(){
  const r=wrap.getBoundingClientRect();W=r.width;H=r.height;dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw();
}
function bounds(rs){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,n=0;
  rs.forEach(r=>routeStops[r].forEach(s=>{n++;x0=Math.min(x0,sx[s]);x1=Math.max(x1,sx[s]);y0=Math.min(y0,sy[s]);y1=Math.max(y1,sy[s])}));
  return n?{x0,x1,y0,y1}:null;
}
function fit(){
  const rs=S.focus!==null?[S.focus]:routes.map((_,i)=>i).filter(shown);
  const b=bounds(rs)||bounds(routes.map((_,i)=>i));
  const L=28,R=96,T=64,B=W<=620?140:100;
  const k=Math.min((W-L-R)/Math.max(b.x1-b.x0,1e-4),(H-T-B)/Math.max(b.y1-b.y0,1e-4));
  V.k=k;V.x=(b.x0+b.x1)/2-((L+W-R)/2-W/2)/k;V.y=(b.y0+b.y1)/2-((T+H-B)/2-H/2)/k;
  V.k=Math.min(V.k,200000);draw();
}
function zoomAt(f,cx,cy){
  const nk=Math.min(600000,Math.max(300,V.k*f)),wx=(cx-W/2)/V.k+V.x,wy=(cy-H/2)/V.k+V.y;
  V.k=nk;V.x=wx-(cx-W/2)/V.k;V.y=wy-(cy-H/2)/V.k;draw();
}

/* ---------- drawing ---------- */
let queued=false;
function draw(){if(!queued){queued=true;requestAnimationFrame(render)}}
const wcache=new Map();
function tw(i,font){let w=wcache.get(i);if(w===undefined){w=ctx.measureText(stops[i][0]).width;wcache.set(i,w)}return w}
function render(){
  queued=false;if(!W)return;readTheme();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
  const foc=S.focus,rs=routes.map((_,i)=>i).filter(shown);
  const dim=r=>foc!==null&&r!==foc;
  ctx.lineJoin='round';ctx.lineCap='round';
  const line=(r,w,col,alpha)=>{ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;
    routePats[r].forEach(p=>{const a=pats[p][1];ctx.beginPath();a.forEach((s,i)=>i?ctx.lineTo(px(sx[s]),py(sy[s])):ctx.moveTo(px(sx[s]),py(sy[s])));ctx.stroke()})};
  const ordered=rs.slice().sort((a,b)=>(dim(b)-dim(a)));
  ordered.forEach(r=>line(r,dim(r)?3:(r===foc?7:5),th.bg,dim(r)?.5:1));
  ordered.forEach(r=>line(r,dim(r)?1.6:(r===foc?4:2.6),tint(routes[r][3]),dim(r)?.25:(isActive(r)?1:.5)));
  ctx.globalAlpha=1;
  // stops
  const sr=V.k<5000?1.7:V.k<25000?2.6:3.6;
  const vis=[];
  const seen=new Set();rs.forEach(r=>routeStops[r].forEach(s=>seen.add(s)));
  seen.forEach(s=>{const X=px(sx[s]),Y=py(sy[s]);if(X<-20||X>W+20||Y<-20||Y>H+20)return;
    const inFoc=foc!==null&&stopRoutes[s].has(foc);vis.push({s,X,Y,inFoc})});
  ctx.lineWidth=1.2;
  const tiny=V.k<7000;
  vis.forEach(v=>{const faded=foc!==null&&!v.inFoc;
    ctx.globalAlpha=faded?.3:1;ctx.fillStyle=th.panel;ctx.strokeStyle=v.inFoc?tint(routes[foc][3]):th.fg;
    ctx.beginPath();
    if(tiny){ctx.arc(v.X,v.Y,v.inFoc?1.8:1.2,0,6.2832);ctx.fillStyle=th.fg;ctx.globalAlpha=faded?.2:.55;ctx.fill()}
    else{ctx.arc(v.X,v.Y,v.inFoc?sr+.8:sr,0,6.2832);ctx.fill();ctx.stroke()}});
  ctx.globalAlpha=1;
  // labels with collision culling
  ctx.font='500 11px Barlow, system-ui, sans-serif';ctx.textBaseline='middle';
  const placed=[],cell=48,grid=new Map();
  const hit=(x,y,w,h)=>{for(let cx=Math.floor(x/cell);cx<=Math.floor((x+w)/cell);cx++)for(let cy=Math.floor(y/cell);cy<=Math.floor((y+h)/cell);cy++){
    const l=grid.get(cx+','+cy);if(l)for(const q of l)if(x<q[0]+q[2]&&x+w>q[0]&&y<q[1]+q[3]&&y+h>q[1])return true}return false};
  const put=(x,y,w,h)=>{const q=[x,y,w,h];for(let cx=Math.floor(x/cell);cx<=Math.floor((x+w)/cell);cx++)for(let cy=Math.floor(y/cell);cy<=Math.floor((y+h)/cell);cy++){const k=cx+','+cy;(grid.get(k)||grid.set(k,[]).get(k)).push(q)}};
  vis.forEach(v=>{const r=sr+3.5;put(v.X-r,v.Y-r,r*2,r*2)});
  if(S.stop!==null){const v=vis.find(q=>q.s===S.stop);if(v){ctx.strokeStyle=th.accent;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(v.X,v.Y,sr+4,0,6.2832);ctx.stroke()}}
  const pri=vis.slice().sort((a,b)=>(b.inFoc-a.inFoc)||((S.stop===b.s)-(S.stop===a.s))||(stopRoutes[b.s].size-stopRoutes[a.s].size)||(a.s-b.s));
  pri.forEach(v=>{
    if(foc!==null&&!v.inFoc&&S.stop!==v.s)return;
    const w=tw(v.s),h=14,name=stops[v.s][0];
    const opts=[[v.X+sr+4,v.Y-h/2],[v.X-sr-4-w,v.Y-h/2],[v.X-w/2,v.Y-sr-4-h],[v.X-w/2,v.Y+sr+4]];
    for(const [x,y] of opts){
      if(x<2||x+w>W-2||y<2||y+h>H-2||hit(x-1,y,w+2,h))continue;
      put(x-1,y,w+2,h);ctx.lineWidth=3;ctx.strokeStyle=th.halo;ctx.strokeText(name,x,y+h/2);
      ctx.fillStyle=v.inFoc||foc===null?th.fg:th.muted;ctx.fillText(name,x,y+h/2);break}
  });
  // buses
  ctx.font='700 12px "Barlow Condensed", system-ui, sans-serif';
  buses.forEach(b=>{
    if(!shown(b.r))return;const X=px(b.x),Y=py(b.y);if(X<-20||X>W+20||Y<-20||Y>H+20)return;
    const f=foc===null||foc===b.r;ctx.globalAlpha=f?1:.3;
    ctx.beginPath();ctx.arc(X,Y,f&&foc===b.r?7:5.5,0,6.2832);ctx.fillStyle=tint(routes[b.r][3]);ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=th.dark?'#0d1312':'#fff';ctx.stroke();
    if(f&&(V.k>14000||foc===b.r)){const t=routes[b.r][1];ctx.lineWidth=3;ctx.strokeStyle=th.halo;ctx.strokeText(t,X+9,Y-8);ctx.fillStyle=th.fg;ctx.fillText(t,X+9,Y-8)}
  });
  ctx.globalAlpha=1;
}

/* ---------- interaction ---------- */
const ptrs=new Map();let moved=0,pinch=0,downAt=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=0;downAt={x:e.offsetX,y:e.offsetY};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){hover(e.offsetX,e.offsetY);return}
  if(ptrs.size===2){
    p.x=e.offsetX;p.y=e.offsetY;const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch)zoomAt(d/pinch,(a.x+b.x)/2,(a.y+b.y)/2);pinch=d;moved=99;return}
  const dx=e.offsetX-p.x,dy=e.offsetY-p.y;moved+=Math.abs(dx)+Math.abs(dy);
  p.x=e.offsetX;p.y=e.offsetY;V.x-=dx/V.k;V.y-=dy/V.k;hideTip();draw()});
const up=e=>{ptrs.delete(e.pointerId);pinch=0;cv.classList.remove('drag');
  if(e.type==='pointerup'&&moved<6&&downAt)click(downAt.x,downAt.y)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',hideTip);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.offsetX,e.offsetY)},{passive:false});
$('zfit').onclick=fit;

function pick(x,y){
  let best=null,bd=11*11;
  for(const b of buses){if(!shown(b.r))continue;const d=(px(b.x)-x)**2+(py(b.y)-y)**2;if(d<bd){bd=d;best={bus:b}}}
  if(best)return best;
  bd=10*10;
  const rs=routes.map((_,i)=>i).filter(shown),seen=new Set();rs.forEach(r=>routeStops[r].forEach(s=>seen.add(s)));
  seen.forEach(s=>{const d=(px(sx[s])-x)**2+(py(sy[s])-y)**2;if(d<bd){bd=d;best={stop:s}}});
  return best;
}
const tip=$('tip');
function hideTip(){tip.hidden=true}
function hover(x,y){
  const h=pick(x,y);
  if(!h){tip.hidden=true;cv.style.cursor='';return}
  cv.style.cursor='pointer';
  if(h.bus){const p=pats[h.bus.pi];tip.innerHTML=`<b>${esc(routes[p[0]][1])}</b> → ${esc(p[2]||'–')}`}
  else tip.innerHTML=`<b>${esc(stops[h.stop][0])}</b>`;
  tip.hidden=false;
  tip.style.left=Math.min(x+14,W-tip.offsetWidth-6)+'px';tip.style.top=Math.max(6,y-tip.offsetHeight-10)+'px';
}
function click(x,y){
  const h=pick(x,y);
  if(!h){S.stop=null;showCard();draw();return}
  if(h.bus){setFocus(h.bus.r,false);return}
  S.stop=h.stop;openDrawer('stop');draw();
}
function setFocus(r,doFit=true){
  S.focus=(S.focus===r&&doFit)?null:r;S.stop=null;showCard();
  listHtml='';renderList();updateCap();fit();
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)setFocus(+b.dataset.r)});

/* ---------- controls ---------- */
let playing=false,last=0,lastList=0,speed=60;
const SPEEDS=[1,10,60,300,900,3600];
function setClockUI(){
  const c=clock(S.t).split(' ');$('clkT').textContent=c[0];$('clkP').textContent=c[1];$('tl').setAttribute('aria-valuenow',Math.floor(S.t/60));drawTL();
}
function syncDays(){const b=$('daysBtn');b.textContent=['Wkd','Sat','Sun','H1','H2'][S.svc];b.setAttribute('aria-label',SVC_NAMES[S.svc])}
function setLive(on){S.live=on;$('liveBtn').classList.toggle('on',on);if(on)syncLive();refresh()}
function refresh(){
  setClockUI();syncDays();compute();renderList();renderDrawer();updateCap();draw();
}
function frame(ts){
  if(!playing)return;
  const dt=Math.min(0.25,(ts-last)/1000);last=ts;
  S.t+=dt*speed;if(S.t>=86400)S.t-=86400; // wraps to the start of the same service day

  draw();requestAnimationFrame(frame);
}
function setPlay(on){

  $('icPlay').toggleAttribute('hidden',on);$('icPause').toggleAttribute('hidden',!on);
  $('playBtn').setAttribute('aria-label',on?'Pause bus movement':'Play bus movement');

$('playBtn').onclick=()=>setPlay(!playing);
$('speedBtn').onclick=()=>{
  speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  $('speedTxt').textContent=speed+'×';$('speedBtn').setAttribute('aria-label','Playback speed '+speed+' times');renderDrawer();
};
$('liveBtn').onclick=()=>{setPlay(false);setLive(true);fit()};
function setDay(s){S.live=false;S.svc=s;S.prev=SVC_PREV[s];$('liveBtn').classList.remove('on');refresh();fit()}
$('daysBtn').onclick=()=>setDay((S.svc+1)%5);
/* timeline: bars show how many buses run through the service day */
const tl=$('tl'),tc=tl.getContext('2d');let hist=null,histKey='',tlDown=false;
function buildHist(){
  const key=S.svc+'-'+S.prev;if(key===histKey)return;histKey=key;
  const d=new Int32Array(1442);
  const add=(lo,hi)=>{lo=Math.max(0,lo);hi=Math.min(1439,hi);if(lo<=hi){d[lo]++;d[hi+1]--}};
  for(const [pi,sv,b,oi] of trips){const o=offs[oi],end=b+o[o.length-1];
    if(sv===S.svc)add(Math.floor(b/60),Math.floor(end/60));
    if(sv===S.prev&&end>=86400)add(Math.floor((b-86400)/60),Math.floor((end-86400)/60));}
  hist=new Float32Array(1440);let run=0;for(let i=0;i<1440;i++){run+=d[i];hist[i]=run}
}
function drawTL(){
  const w=tl.clientWidth,h=tl.clientHeight;if(!w)return;
  const dp=window.devicePixelRatio||1;
  if(tl.width!==Math.round(w*dp)||tl.height!==Math.round(h*dp)){tl.width=Math.round(w*dp);tl.height=Math.round(h*dp)}
  buildHist();readTheme();
  tc.setTransform(dp,0,0,dp,0,0);tc.clearRect(0,0,w,h);
  const N=Math.max(60,Math.floor(w/4)),per=1440/N;let mx=1;
  const vals=[];for(let i=0;i<N;i++){let s=0;for(let m=Math.floor(i*per);m<Math.floor((i+1)*per);m++)s+=hist[m];const v=s/Math.max(1,Math.floor((i+1)*per)-Math.floor(i*per));vals.push(v);mx=Math.max(mx,v)}
  const bw=w/N,cur=S.t/60;
  tc.fillStyle=th.fg;
  for(let i=0;i<N;i++){
    const bh=Math.max(2,vals[i]/mx*(h-6));
    tc.globalAlpha=(i+1)*per<=cur?.85:.28;
    tc.fillRect(i*bw+.5,h-bh,Math.max(1,bw-1.5),bh);
  }
  tc.globalAlpha=1;const x=Math.min(w-1,cur/1440*w);tc.fillRect(Math.round(x)-1,0,2,h);
}
function tlSet(e){
  const r=tl.getBoundingClientRect();
  S.live=false;$('liveBtn').classList.remove('on');
  S.t=Math.min(1439,Math.max(0,Math.floor((e.clientX-r.left)/r.width*1440)))*60;refresh();
}
tl.addEventListener('pointerdown',e=>{tlDown=true;tl.setPointerCapture(e.pointerId);tlSet(e)});
tl.addEventListener('pointermove',e=>{if(tlDown)tlSet(e)});
tl.addEventListener('pointerup',()=>{tlDown=false});tl.addEventListener('pointercancel',()=>{tlDown=false});
tl.addEventListener('keydown',e=>{
  const d=e.key==='ArrowRight'?5:e.key==='ArrowLeft'?-5:0;if(!d)return;e.preventDefault();
  S.live=false;$('liveBtn').classList.remove('on');S.t=Math.min(1439,Math.max(0,Math.floor(S.t/60)+d))*60;refresh()});
new ResizeObserver(()=>drawTL()).observe(tl);
$('dataBtn').onclick=()=>D.open?closeDrawer():openDrawer();
$('dClose').onclick=closeDrawer;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.disabled)return;D.tab=b.dataset.tab;D.built='';D.html='';renderDrawer()});
$('dBody').addEventListener('click',e=>{const h=e.target.closest('.hol .btn');if(h){setDay(+h.dataset.s);return}const r=e.target.closest('tr[data-r]');if(r){setFocus(+r.dataset.r);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('list').addEventListener('mouseover',e=>{const b=e.target.closest('.row');S.hoverR=b?+b.dataset.r:null;updateCap()});
$('list').addEventListener('mouseleave',()=>{S.hoverR=null;updateCap()});
setInterval(()=>{if(S.live){const n=nyNow();S.svc=DAY_SVC[n.dow];S.prev=DAY_SVC[(n.dow+6)%7];S.t=n.sec;refresh()}},5000);

new ResizeObserver(resize).observe(wrap);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{listHtml='';D.html='';refresh()});
new MutationObserver(()=>{listHtml='';D.html='';refresh()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.fonts&&document.fonts.ready.then(()=>{wcache.clear();draw()});

syncLive();resize();refresh();fit();
})();
</script>
