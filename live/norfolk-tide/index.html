<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar below. Dark by default, light via the top-right toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --card: #0c1017ee; --ctl: #0c1017d9; --ctl-hover: #131a25;
  --row-hover: #10161f; --row-sel: #131b27; --detail: #0f151e; --tip: #0f141cf2;
  --seg: #0a0d13; --focus: #5d7fa6; --shadow: #0008; --press: #ffffff14; --faint: #ffffff10;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
}
:root[data-theme="light"] {
  --bg: #e6ecf3; --panel: #f6f8fb; --line: #d9e0e9; --line-2: #c3cddb;
  --fg: #131a26; --mute: #4f5d70; --dim: #77849a;
  --chip: #16202e; --chip-fg: #f4f7fb;
  --card: #f8fafcf2; --ctl: #f8fafce6; --ctl-hover: #e8edf4;
  --row-hover: #edf1f6; --row-sel: #e1e8f1; --detail: #eef2f7; --tip: #fbfcfef5;
  --seg: #edf1f6; --focus: #3b6ea8; --shadow: #1a233a33; --press: #16202e14; --faint: #16202e0f;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans);
  font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: var(--sans); }
#app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* roster */
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex: 1 1 100%; display: flex; align-items: flex-start; gap: 7px; margin-top: 4px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 16px; height: 3px; border-radius: 2px; flex: none; margin-top: 7px; }
#selchip .nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; line-height: 1.35; padding-top: 1px; }
#selchip .hw { color: var(--mute); }
#selchip button { flex: none; background: var(--faint); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; display: grid; place-items: center; }
#selchip button:hover { color: var(--fg); background: var(--press); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 6px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 5px 16px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--row-hover); }
.row.sel { background: var(--row-sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 600 11.5px var(--sans); color: var(--c); overflow-wrap: anywhere; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; overflow-wrap: anywhere; line-height: 1.3; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; overflow-wrap: anywhere; line-height: 1.3; }
.empty { padding: 22px 18px; color: var(--mute); font-size: 12.5px; line-height: 1.45; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 16px 9px; min-width: 0; max-height: 46%; overflow-y: auto; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 2px 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; overflow-wrap: anywhere; flex: 1 1 0; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; flex: none; }
#detail .x:hover { color: var(--fg); }
#detail .sub { color: var(--mute); font-size: 11.5px; margin-top: 3px; overflow-wrap: anywhere; }
#stops { list-style: none; margin: 9px 0 0; padding: 0; display: grid; gap: 4px; }
#stops li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .tm { font-size: 11px; white-space: nowrap; }
#stops li span:last-child { overflow-wrap: anywhere; line-height: 1.3; }
#stops li.gone { opacity: .45; }

/* key card: hugs its content, wraps instead of clipping */
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: max-content; max-width: min(340px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); flex: none; }
#legend #keytog:hover { color: var(--fg); background: var(--ctl-hover); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; flex: none; }
.emph { display: inline-flex; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--seg); }
#legend .emph button { padding: 4px 10px; border-radius: 6px; font-size: 11.5px; line-height: 1.2; color: var(--mute); text-align: center; white-space: nowrap; }
#legend .emph button:hover { color: var(--fg); }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); font-weight: 500; }
.k-lines { display: flex; flex-wrap: wrap; gap: 4px; }
#legend .k-lines button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border: 1px solid var(--line-2); border-radius: 999px; line-height: 1.2; white-space: nowrap; max-width: 100%; color: var(--fg); }
#legend .k-lines button:hover { background: var(--press); }
#legend .k-lines button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend .k-lines button.off { opacity: .42; }
#legend .k-lines button.act { background: var(--press); border-color: var(--c); }
.k-note { color: var(--mute); font-size: 11px; line-height: 1.4; padding: 6px 2px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 38px); top: 14px; max-width: calc(100% - 140px); display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-start; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px/1.2 var(--sans); padding: 5px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 26px; background: var(--ctl); border: 0; color: var(--mute); font: 400 16px/1 var(--sans); cursor: pointer; padding: 0; display: grid; place-items: center; }
#zoomc button:hover { color: var(--fg); background: var(--ctl-hover); }
#theme { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; }
#theme:hover { color: var(--fg); background: var(--ctl-hover); }
#theme .sun { display: none; }
:root[data-theme="light"] #theme .sun { display: block; }
:root[data-theme="light"] #theme .moon { display: none; }
#tip {
  position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; font-size: 12px;
  color: var(--fg); width: max-content; max-width: min(260px, calc(100% - 16px)); z-index: 5; box-shadow: 0 6px 24px var(--shadow); transform: translate(12px, 14px); overflow-wrap: anywhere;
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; line-height: 1.35; }

/* transport bar */
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 8px 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #theme:focus-visible, #legend button:focus-visible, #sublegend button:focus-visible, #zoomc button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; min-width: 3.2em; text-align: center; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1 1 120px; height: 36px; min-width: 100px; cursor: ew-resize; touch-action: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--seg); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px/1.2 var(--sans); padding: 7px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-right: 0; }
  #head { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
  .row { padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); grid-template-columns: 54px minmax(0, 1fr); }
  .row .to { font-size: 15px; }
  #detail { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  #bar { flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #sublegend { max-width: calc(100% - 130px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } #legend #keytog svg { transition: none; } }

      if (x < 0 || x > W || y < 0 || y > H) return;
      const ss = stopSt[si]; if (lineSel && ss.vis && ss.on && (!ss.bus || ss.keep)) return; // already named by the line highlight
      const nm = shortName(s.n), w = g.measureText(nm).width;
      for (const sd of [[8, -7], [8, 7], [-8 - w, -7], [-8 - w, 7]]) {
        const b = [x + sd[0], y + sd[1] - 7, x + sd[0] + w, y + sd[1] + 7];

    v.sx = x; v.sy = y;
    const c = rcol(v.p.r), on = vis(v), big = routes[v.p.r].k === 'rail' ? 1.25 : 1, r = rr * big;

}

/* ---------- roster & detail ---------- */
const listEl = $('list'), countEl = $('count');

function rebuildList(force) {

}
listEl.addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(+b.dataset.k); });

function select(k) { selected = (k === selected) ? -1 : k; detSig = ''; showDetail(); lastSig = ''; }

}
let detSig = '';

  const nx = v ? v.nx : p.st.length;

  }

}

/* ---------- time bar ---------- */
const playBtn = $('play');
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {
  const g = hctx, w = hc.width, h = hc.height; g.clearRect(0, 0, w, h); if (!w || !D.hist[day]) return;
  const hs = D.hist[day], N = 480, mxv = Math.max.apply(null, hs) || 1, bw = w / N, ph = t / 86400;
  for (let i = 0; i < N; i++) {

function seekFrom(e) { const r = hist.getBoundingClientRect(); t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86399; }
let seeking = false;
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });
hist.addEventListener('pointermove', (e) => { if (seeking) seekFrom(e); });
hist.addEventListener('pointerup', () => { seeking = false; });

function drawClock() { $('clock').innerHTML = __clk.html(t, 'America/New_York'); } window.addEventListener('clkmode', () => { lastClock = ''; drawClock(); });
__clk.live({tz:'America/New_York',get:()=>t,set:v=>{t=v;speedIdx=0;$('speed').innerHTML=SPEEDS[0]+'&times;'},on:()=>playing,spd:()=>speedIdx===0});

/* ---------- key ---------- */
function renderKey() {

  const items = [];
  const chip = (attr, ri, label, title) => '<button ' + attr + ' style="--c:' + (ri >= 0 ? rcol(ri) : (T.light ? '#4a5568' : '#cfd8e6')) + '" title="' + esc(title) + '"><i></i>' + esc(label) + '</button>';
  if (emph === 'bus') items.push(chip('data-g="bus"', -1, 'All buses', 'Highlight all frequent buses'));
  routes.forEach((r, i) => { if (emph === 'all' || r.k === emph) items.push(chip('data-r="' + i + '"', i, r.kn, r.title + (hw[i] ? ' · ' + hwText(i) : ''))); });
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForBuses()));

  document.querySelectorAll('.emph button').forEach((b) => b.classList.toggle('on', b.dataset.e === emph));
  const n = $('knote'); if (n) n.textContent = 'Flat $2.00 fare on every line, no fare zones. Tide runs ' + (hw[routes.findIndex((r) => r.k === 'rail')] ? 'every ' + Math.round(hw[routes.findIndex((r) => r.k === 'rail')]) + ' min' : 'less often') + ' midday.';

}

    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on && !(b.dataset.r !== undefined && lineSel.key === 'bus' && routes[+b.dataset.r].k === 'bus'));

}
function buildLegend() {

    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus">' + FOCUS.map((f) => '<button data-e="' + f[0] + '">' + f[1] + '</button>').join('') + '</span></div>' +

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.6, Math.min(s0 * 80, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
const UI = '#zoomc,#legend,#sublegend,#theme';
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {

});
function lineAt(px, py) {
  let best = null, bd = 64;

    routeShapes[ri].forEach((si) => {
      const P = shapes[si];
      for (let i = 1; i < P.n; i++) {
        const ax = SX(P.X[i - 1]), ay = SY(P.Y[i - 1]), bx = SX(P.X[i]), by = SY(P.Y[i]);
        if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
        const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2 + (fd(ri) ? 40 : 0);
        if (d < bd) { bd = d; best = ri; }
      }
    });
  });
  return best === null ? null : lineForRoute(best);
}
function hit(px, py) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  hoverStation = null;
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.k === 'bus' ? 'Bus ' + r.s : r.s) + '</b> to ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { hoverStation = sb; tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">' + esc(hwText(l.ri)) + ' · click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(px, W - tw - 24)) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {

  h += '<div class="s">' + esc(s.routes.map((r) => routes[r].k === 'bus' ? 'Bus ' + routes[r].s : routes[r].name).join(' · ')) + '</div>';
  h += '<div class="s">' + (s.rail ? 'Tide station' : s.ferry ? 'Ferry landing' : 'Bus stop') + ' · $' + Math.max.apply(null, s.routes.map((r) => routes[r].fare)).toFixed(2) + ' flat fare</div>';
  if (s.conn.length) h += '<div class="s">Connects: ' + esc(s.conn.slice(0, 6).map((r) => routes[r].k === 'bus' ? 'Bus ' + routes[r].s : routes[r].name).join(' · ')) + '</div>';
  return h;
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) select(best.k);
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') t = (t + 600) % 86400;
  else if (e.key === 'ArrowLeft') t = (t + 86400 - 600) % 86400;
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles(); drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  let saved = null; try { saved = localStorage.getItem('tide-map-theme'); } catch (e) {}
  const pre = document.documentElement.getAttribute('data-theme');
  applyTheme(THEMES[saved] ? saved : THEMES[pre] ? pre : 'dark', false);
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  resize(); loadDay(); computeVehicles(); $('loading').remove();
  new ResizeObserver(() => resize()).observe(wrap);
  new ResizeObserver(() => sizeHist()).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
window.__tide = { setT: (s) => { t = s; }, setDay: (d) => { day = d; markDay(); loadDay(); }, setPlay, setLine: (ri) => setLine(ri === 'bus' ? lineForBuses() : lineForRoute(ri)), select, vehicles: () => vehicles, view, zoomAt, routes };
})();
