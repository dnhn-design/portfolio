<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light theme toggle top right of the map. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38; --fg: #e8edf4; --mute: #7f8a9a; --dim: #556071;
  --chip: #e9edf3; --chip-fg: #0c1017; --card: #0c1017ee; --btn: #0c1017d9; --btn-h: #131a25; --row-h: #10161f; --row-sel: #131b27; --detail: #0f151e;
  --tip: #0f141cf2; --ctl: #0a0d13; --focus: #5d7fa6; --hair: #ffffff10; --hair-h: #ffffff1c;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-map="light"] {
  --bg: #eef1f5; --panel: #f7f8fa; --line: #dde2ea; --line-2: #cbd3de; --fg: #141b26; --mute: #5b6879; --dim: #7a8697;
  --chip: #141b26; --chip-fg: #f4f6f9; --card: #f7f8faee; --btn: #f7f8fad9; --btn-h: #e6eaf0; --row-h: #eceff4; --row-sel: #e3e8ef; --detail: #eef1f5;
  --tip: #fbfcfdf2; --ctl: #eef1f5; --focus: #3f6aa0; --hair: #0000000d; --hair-h: #0000001a;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { font-variant-numeric: tabular-nums; margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; }
#selchip button { background: var(--hair); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; }
#selchip button:hover { color: var(--fg); background: var(--hair-h); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 48px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--row-h); }
.row.sel { background: var(--row-sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 28px; color: var(--mute); }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; }
#detail .t b { font-weight: 600; font-size: 13.5px; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#detail .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
#stops { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stops li .tm { font-size: 10.5px; }
#stops li .zc { font: 600 9.5px var(--sans); letter-spacing: .04em; min-width: 14px; text-align: center; border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; opacity: .9; }
#stops li.gone { opacity: .45; }
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: min(330px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--hair); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--btn); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--btn-h); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--ctl); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button i.multi { background: conic-gradient(var(--m)); }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--hair-h); }
#legend #zones { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 6px; border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; color: var(--mute); font-size: 11px; }
#zones.on { color: var(--fg); background: var(--hair-h); }
#zones .zk { display: inline-flex; gap: 6px; font: 600 10.5px var(--sans); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 120px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.sus { border-style: dashed; }
.k-note { display: flex; gap: 8px; align-items: flex-start; font-size: 10.5px; line-height: 1.4; color: var(--dim); padding: 2px 4px 0; }
.k-note i { flex: none; width: 16px; height: 0; border-top: 2px dashed var(--mute); margin-top: 6px; }
.k-note a { color: var(--mute); pointer-events: auto; }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

#theme { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--btn); color: var(--mute); cursor: pointer; display: grid; place-items: center; padding: 0; }
#theme:hover { color: var(--fg); background: var(--btn-h); }
#tip { position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--fg); max-width: 270px; z-index: 5; box-shadow: 0 6px 24px #0006; transform: translate(12px, 14px); }
#tip[hidden] { display: none; }

#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(9px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }

#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 400 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }

  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #theme { right: max(14px, env(safe-area-inset-right, 0px)); }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {
  const g = hctx, w = hc.width, h = hc.height; g.clearRect(0, 0, w, h); if (!w) return;
  const hs = D.hist[day], N = 480, ph = t / 86400; let mxv = 1; for (let i = 0; i < hs.length; i++) if (hs[i] > mxv) mxv = hs[i];
  const bw = w / N;
  for (let i = 0; i < N; i++) {
    let v = 0; for (let j = 0; j < 3; j++) v = Math.max(v, hs[i * 3 + j]);
    const bh = Math.max(2 * dpr, (v / mxv) * (h - 6 * dpr));
    g.fillStyle = (i + 0.5) / N <= ph ? T.hist[0] : T.hist[1];
    g.fillRect(i * bw + bw * 0.12, h - bh, Math.max(1, bw * 0.62), bh);
  }
  g.fillStyle = T.hist[2]; g.fillRect(Math.round(ph * w) - dpr, 0, 2 * dpr, h);
}
function seekFrom(e) { const r = hist.getBoundingClientRect(); t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86399; }
let seeking = false;
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });
hist.addEventListener('pointermove', (e) => { if (seeking) seekFrom(e); });
hist.addEventListener('pointerup', () => { seeking = false; });
hist.addEventListener('pointercancel', () => { seeking = false; });
function drawClock() { $('clock').innerHTML = __clk.html(t, 'America/Denver'); } window.addEventListener('clkmode', () => { lastClock = ''; drawClock(); });
__clk.live({tz:'America/Denver',get:()=>t,set:v=>{t=v;speedIdx=0;$('speed').innerHTML=SPEEDS[0]+'&times;'},on:()=>playing,spd:()=>speedIdx===0});

/* ---------- key ---------- */
const MULTI = () => routes.filter((r) => r.g === 1 && r.ext === undefined).map((r) => rcol(routes.indexOf(r))).map((c, i, a) => c + ' ' + (i / a.length * 360) + 'deg ' + ((i + 1) / a.length * 360) + 'deg').join(',');
function renderKey() {
  const box = $('klines'); if (!box) return; const items = [];
  const grp = (i) => '<button data-g="' + i + '" style="--c:' + (i === 1 ? '#888' : gcol(i)) + ';--m:' + (i === 1 ? MULTI() : '') + '" title="Highlight ' + GROUPS[i].n + '"><i class="' + (i === 1 ? 'multi' : '') + '"></i>' + GROUPS[i].n + '</button>';
  if (emph === 'rail') {
    items.push(grp(0));
    routes.forEach((r, i) => { if (r.g === 0) items.push('<button data-r="' + i + '" style="--c:' + rcol(i) + '" title="' + esc(r.n) + '"><i></i>' + esc(r.n) + '</button>'); });
  } else GROUPS.forEach((g, i) => { if (emph === 'metro' && i === 0) return; items.push(grp(i)); });
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForGroup(+b.dataset.g)));
  box.querySelectorAll('button[data-r]').forEach((b) => b.onclick = () => setLine(lineForRoute(+b.dataset.r)));
  const z = $('zones'); if (z) z.querySelector('.zk').innerHTML = ZCH.map((c, i) => '<b style="color:' + ZC[i] + '" title="' + ZNAME[i] + '">' + c + '</b>').join('');
  const kn = $('knote'); if (kn) kn.style.display = emph === 'rail' ? 'none' : '';
  markKey();
}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    const on = !!lineSel && (b.dataset.r !== undefined ? lineSel.key === 'r' + b.dataset.r : lineSel.g === +b.dataset.g);
    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on);
  });
}
function buildLegend() {
  const el = $('legend');
  el.innerHTML = '<button id="keytog" aria-label="Collapse key" title="Collapse key"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="keybody">' +
    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="rail">Rail</button><button data-e="metro">Metro</button></span></div>' +
    '<div class="k-lines" id="klines"></div>' +
    '<div class="k-note" id="knote"><i></i><span>Dashed lines are estimated. H, L and the downtown part of D are suspended during the <a href="https://www.rtd-denver.com/railproject" target="_blank" rel="noopener">Downtown Rail Reconstruction Project</a> (May 2024 to Q1 2027). Routes follow RTD system maps; stations come from the feed.</span></div>' +
    '<button id="zones" title="Colour lines and stations by fare zone"><span>Fare zones</span><span class="zk"></span></button></div>';
  renderKey();
  el.querySelectorAll('.emph button').forEach((b) => b.onclick = () => setEmph(b.dataset.e));
  $('zones').onclick = () => { zonesOn = !zonesOn; $('zones').classList.toggle('on', zonesOn); baseDirty = true; };
  const tog = $('keytog');
  tog.onclick = () => { const m = el.classList.toggle('min'); tog.setAttribute('aria-label', m ? 'Expand key' : 'Collapse key'); tog.title = m ? 'Expand key' : 'Collapse key'; };
  if (window.matchMedia('(max-width: 820px)').matches) tog.onclick();
}

/* ---------- theme ---------- */
const SUN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z"/></svg>';
function setTheme(n) {
  theme = n; T = THEMES[n]; ZC = ZCOL[n]; document.documentElement.dataset.map = n;
  const b = $('theme'); b.innerHTML = n === 'dark' ? SUN : MOON; b.setAttribute('aria-label', n === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  baseDirty = true; lastSig = ''; renderKey(); buildSub(); drawHist(); if (lineSel) { const el = $('selchip'); const i = el.querySelector('i'); if (i) i.style.background = lineColor(lineSel); }
  detSig = ''; try { localStorage.setItem('rtd-map-theme', n); } catch (e) { /* storage may be blocked */ }
}
$('theme').onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.08, Math.min(s0 * 40, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
const NOCLICK = '#zoomc,#legend,#sublegend,#theme';
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(NOCLICK)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(NOCLICK)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    const o = ptrs.get(e.pointerId), dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2) { const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch0) zoomAt(d / pinch0, (a[0][0] + a[1][0]) / 2 - r.left, (a[0][1] + a[1][1]) / 2 - r.top); pinch0 = d; }
    else { userMoved = true; view.cx -= dx / view.s; view.cy -= dy / view.s; baseDirty = true; }
    return;
  }
  if (e.pointerType === 'touch' || e.target.closest(NOCLICK)) return;
  hit(px, py);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  lineShapes.forEach((L) => {
    if (fd(L.g) && !lineSel) { /* faded lines stay clickable */ }
    const P = shapes[L.si];
    for (let i = 1; i < P.n; i++) {
      const ax = SX(P.X[i - 1]), ay = SY(P.Y[i - 1]), bx = SX(P.X[i]), by = SY(P.Y[i]);
      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;
      if (d < bd || (d === bd && best && L.g < best.g)) { bd = d; best = L; }
    }
  });
  return best ? lineForRoute(Math.min(...best.rs)) : null;
}
function stationTip(s) {
  let h = '<div><b>' + esc(shortName(s.n)) + '</b></div>';
  const names = [...new Set(s.routes.map((r) => routes[r].n + (routes[r].sus ? ' (suspended)' : '')))].slice(0, 4).join(' · ');
  h += '<div class="s"><span class="z" style="color:' + ZC[s.z] + '">' + ZNAME[s.z].toUpperCase() + '</span></div><div class="s">' + esc(names) + '</div>';
  if (s.susOnly) h += '<div class="s">No trains scheduled: Downtown Rail Reconstruction Project</div>';
  if (s.z === 0) h += '<div class="s">' + (s.st ? '$2.75 local fare, 3-hour pass' : '$2.75 to or from Union Station · 3-hour pass') + '</div>';
  else if (s.z === 1) h += '<div class="s">$10.00 airport day pass to or from downtown ($7.25 upgrade from a local pass)</div>';
  else if (s.z === 2) h += '<div class="s">Free ride</div>';
  else h += '<div class="s">' + esc(s.a || '') + (s.f ? ' · $' + s.f.toFixed(2) + ' to or from Denver' : ' · Denver stop') + '</div>';
  return h;
}
function hit(px, py) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  hoverStation = null;
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer'; const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(best.p.h)) + '</div><div class="s">' + esc(r.n) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { hoverStation = sb; tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else { const l = lineAt(px, py); if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">' + (routes[l.ri].sus ? 'Suspended through Q1 2027 · estimated route' : 'Click to highlight') + '</div>'; } else { tip.hidden = true; return; } }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.min(px, W - tw - 24) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) select(best.k);
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') t = (t + 600) % 86400; else if (e.key === 'ArrowLeft') t = (t + 86400 - 600) % 86400;
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles(); drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  let th = 'dark'; try { th = localStorage.getItem('rtd-map-theme') === 'light' ? 'light' : 'dark'; } catch (e) { th = 'dark'; }
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  setTheme(th); resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => resize()).observe(wrap);
  new ResizeObserver(() => { const hr = hist.getBoundingClientRect(); hc.width = Math.round(hr.width * dpr); hc.height = Math.round(hr.height * dpr); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
</script>
