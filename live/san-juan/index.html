<title>San Juan Live Map</title>

<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via the toggle. */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38; --fg: #e8edf4; --mute: #8792a3; --dim: #5d697b;
  --chip: #e9edf3; --chip-fg: #0c1017; --card: #0c1017ee; --hover: #10161f; --sel: #131b27; --detail: #0f151e; --ctl: #0c1017d9; --ctl-h: #131a25;
  --tipbg: #0f141cf2; --focus: #5d7fa6; --wash: #ffffff10;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-mt="light"] {
  --bg: #eef1f6; --panel: #ffffff; --line: #dde2ea; --line-2: #c9d0db; --fg: #17202c; --mute: #566275; --dim: #7a8697;
  --chip: #17202c; --chip-fg: #ffffff; --card: #ffffffee; --hover: #f3f5f9; --sel: #e9eef6; --detail: #f6f8fb; --ctl: #ffffffe6; --ctl-h: #eef2f7;
  --tipbg: #ffffffF5; --focus: #3b6ea8; --wash: #17202c12;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "map side" "bar bar"; }
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#selchip { flex-basis: 100%; display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; overflow-wrap: anywhere; }
#selchip button { flex: none; background: var(--wash); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 6px; width: 100%; text-align: left; background: none; border: 0; color: inherit; font: inherit; padding: 5px 16px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .no { font: 500 11.5px var(--sans); color: var(--c); white-space: nowrap; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; overflow-wrap: anywhere; line-height: 1.25; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; overflow-wrap: anywhere; line-height: 1.25; }
.empty { padding: 24px 20px; color: var(--mute); }
#foot { padding: 8px 16px 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 10.5px; line-height: 1.4; }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 16px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
#detail .t b { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
#detail .t span { color: var(--mute); font-size: 11.5px; min-width: 0; flex: 1 1 80px; overflow-wrap: anywhere; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; max-height: 210px; overflow: auto; }
#stops li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 11.5px; color: var(--mute); align-items: baseline; line-height: 1.3; }
#stops li.nx { color: var(--fg); }
#stops li .tm { font-size: 11px; white-space: nowrap; }
#stops li span:last-child { overflow-wrap: anywhere; }
#stops li.gone { opacity: .45; }
/* key card: hugs its content */
#legend { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px; max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none; }
#keybody { pointer-events: auto; width: max-content; max-width: min(330px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(6px); }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--ctl-h); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.emph { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); }
#legend .emph button { padding: 3px 10px; border-radius: 6px; font-size: 11px; color: var(--mute); text-align: center; white-space: nowrap; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: flex; flex-wrap: wrap; gap: 4px; }
.k-lines button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 8px; border: 1px solid var(--line-2); border-radius: 999px; white-space: nowrap; line-height: 1.2; }
.k-lines button:hover { background: var(--wash); color: var(--fg); }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend .k-lines button.off { opacity: .45; }
#legend .k-lines button.act { background: var(--wash); color: var(--fg); border-color: var(--c); }
.k-note { color: var(--dim); font-size: 10.5px; line-height: 1.35; max-width: 250px; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 36px); top: 14px; right: calc(max(14px, env(safe-area-inset-right, 0px)) + 40px); display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
#sublegend[hidden] { display: none; }
#sublegend button { pointer-events: auto; background: var(--ctl); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--ctl); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; padding: 0; }
#zoomc button:hover { color: var(--fg); background: var(--ctl-h); }
#themebtn { position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; }
#themebtn:hover { color: var(--fg); background: var(--ctl-h); }
#themebtn svg { display: block; }
#themebtn .sun { display: none; }
:root[data-mt="light"] #themebtn .sun { display: block; }
:root[data-mt="light"] #themebtn .moon { display: none; }
#tip { position: absolute; pointer-events: none; background: var(--tipbg); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; font-size: 12px; color: var(--fg); width: max-content; max-width: 250px; z-index: 5; box-shadow: 0 6px 24px #0006; transform: translate(12px, 14px); overflow-wrap: anywhere; }
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar { grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 8px max(18px, env(safe-area-inset-right, 0px)) 9px max(18px, env(safe-area-inset-left, 0px)); min-width: 0; }
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
#play:focus-visible, .seg button:focus-visible, #speed:focus-visible, #themebtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 1px solid var(--line-2); border-radius: 8px; font: 500 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 10px; flex: none; white-space: nowrap; min-width: 52px; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1 1 160px; height: 36px; min-width: 0; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding-right: 0; }
  #head { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 6px; }
  #list .row, #foot, #detail { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .row { padding-top: 7px; padding-bottom: 7px; }
  .row .to { font-size: 14.5px; }
  #bar { gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock em { display: none; }
  #hist { order: 5; flex: 1 1 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } #legend #keytog svg { transition: none; } }
</style>
