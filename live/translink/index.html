<style>
/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default with a light toggle (top right of the map). */
:root {
  --bg: #0a0d13; --panel: #0c1017; --line: #161d28; --line-2: #212a38;
  --fg: #e8edf4; --mute: #8490a1; --dim: #667284;
  --chip: #e9edf3; --chip-fg: #0c1017;
  --hov: #10161f; --sel: #131b27; --detail: #0f151e;
  --card: rgba(12,16,23,.93); --cardbtn: rgba(12,16,23,.86); --cardhov: #131a25; --inset: #0a0d13;
  --tip: rgba(15,20,28,.96); --shadow: 0 6px 24px rgba(0,0,0,.53); --ring: #5d7fa6; --faint: rgba(255,255,255,.08);
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-map="light"] {
  --bg: #eaedf1; --panel: #ffffff; --line: #e0e5ed; --line-2: #ccd4e0;
  --fg: #121a26; --mute: #566275; --dim: #7a8596;
  --chip: #141a24; --chip-fg: #ffffff;
  --hov: #f1f4f8; --sel: #e8eef6; --detail: #f5f7fa;
  --card: rgba(255,255,255,.95); --cardbtn: rgba(255,255,255,.92); --cardhov: #eef2f7; --inset: #f2f5f9;
  --tip: rgba(255,255,255,.98); --shadow: 0 6px 24px rgba(26,38,58,.2); --ring: #3b6fb0; --faint: rgba(0,0,0,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%; display: grid; grid-template-columns: 1fr clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 18px 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#selchip { flex-basis: 100%; display: inline-flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); min-width: 0; }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#selchip button { background: var(--faint); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; flex: none; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {
  display: grid; grid-template-columns: 50px 1fr; gap: 0 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  font: inherit; padding: 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--hov); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }
.row:focus-visible { outline: 1px solid var(--ring); outline-offset: -1px; }
.row .no { font: 400 11.5px var(--sans); color: var(--mute); letter-spacing: .02em; }
.row .no.m { color: var(--c); font-weight: 600; }
.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 24px 28px; color: var(--mute); }
#detail { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--detail); padding: 10px 18px 9px; }
#detail[hidden] { display: none; }
#detail .t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
#detail .t b { font-weight: 600; font-size: 13.5px; flex: none; }
#detail .t span { color: var(--mute); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 3px; max-height: 190px; overflow: hidden; }
#stops li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11.5px; color: var(--mute); align-items: baseline; }
#stops li.nx { color: var(--fg); }
#stops li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stops li .tm { font-size: 10.5px; }
#stops li .zc { display: inline-flex; gap: 3px; }
#stops li .zc i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: block; }
#stops li.gone { opacity: .45; }
#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;
  max-width: calc(100% - 28px); font-size: 11.5px; color: var(--mute); pointer-events: none;
}
#keybody { pointer-events: auto; width: min(320px, 100%); background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; max-height: 46vh; overflow-y: auto; scrollbar-width: thin; }
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 6px; }
#legend button:hover { background: var(--faint); }
#legend #keytog { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; background: var(--cardbtn); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--cardhov); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; gap: 8px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.emph { display: flex; flex: 1; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--inset); }
#legend .emph button { flex: 1; padding: 3px 0; border-radius: 5px; font-size: 11px; color: var(--mute); text-align: center; }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 4px; }
.k-lines button { display: flex; align-items: center; gap: 7px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#legend button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend button.off { opacity: .4; }
#legend button.act { background: var(--faint); color: var(--fg); }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); top: 14px; max-width: calc(100% - 130px); display: flex; gap: 4px; flex-wrap: wrap; }
#sublegend[hidden] { display: none; }
#sublegend button { background: var(--card); border: 1px solid var(--line-2); color: var(--mute); font: 500 11px var(--sans); padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#sublegend button:hover { color: var(--fg); }
#sublegend button.on { background: var(--c); border-color: var(--c); color: #0a0d13; }
#zoomc { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoomc button { width: 26px; height: 24px; background: var(--cardbtn); border: 0; color: var(--mute); font: 400 16px var(--sans); cursor: pointer; }
#zoomc button:hover { color: var(--fg); background: var(--cardhov); }
#theme { position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); width: 28px; height: 28px; display: grid; place-items: center; background: var(--cardbtn); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; padding: 0; }
#theme:hover { color: var(--fg); background: var(--cardhov); }
#theme:focus-visible, #play:focus-visible, .seg button:focus-visible, #speed:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
#tip {
  position: absolute; pointer-events: none; background: var(--tip); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12px;
  color: var(--fg); max-width: 260px; z-index: 5; box-shadow: var(--shadow); transform: translate(12px, 14px);
}
#tip[hidden] { display: none; }
#tip .s { color: var(--mute); font-size: 11px; margin-top: 2px; }
#bar {
  grid-area: bar; border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: 18px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 9px max(20px, env(safe-area-inset-left, 0px)); min-width: 0;
}
#play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--chip-fg); cursor: pointer; display: grid; place-items: center; flex: none; }
#clock { font: 500 26px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; flex: none; }
#clock small { font-size: 14px; color: var(--mute); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
#clock em { font: 400 11px var(--sans); color: var(--dim); margin-left: 8px; font-style: normal; }
#speed { background: none; border: 0; font: 500 12.5px var(--sans); color: var(--mute); cursor: pointer; padding: 6px 4px; flex: none; }
#speed:hover { color: var(--fg); }
#hist { position: relative; flex: 1; height: 36px; min-width: 120px; cursor: ew-resize; touch-action: none; }
#hist canvas { position: absolute; inset: 0; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); flex: none; }
.seg button { border: 0; background: none; color: var(--mute); font: 500 12.5px var(--sans); padding: 6px 13px; border-radius: 7px; cursor: pointer; }
.seg button.on { background: var(--chip); color: var(--chip-fg); }
.seg button:not(.on):hover { color: var(--fg); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 34%) auto; grid-template-areas: "map" "side" "bar"; }
  #side { border-left: 0; border-top: 1px solid var(--line); }
  #head { padding: 12px 16px 6px; }
  #count { font-size: 28px; }
  .row { padding: 7px 16px; grid-template-columns: 54px 1fr; }
  .row .to { font-size: 15px; }
  #detail { padding: 10px 16px; }
  #bar { flex-wrap: wrap; gap: 8px 14px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  #play { width: 44px; height: 44px; }
  #clock { font-size: 28px; }
  #clock small { font-size: 16px; }
  #clock em { display: none; }
  #hist { order: 5; flex-basis: 100%; height: 34px; }
  .seg { margin-left: auto; }
  .seg button { padding: 8px 12px; font-size: 14px; }
  #legend { bottom: 8px; }
  #sublegend { top: 52px; left: max(14px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 28px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } #legend #keytog svg { transition: none; } }

    if (v.k === selected || v.k === hover) { g.beginPath(); g.arc(x, y, rr + 6, 0, 7); g.strokeStyle = TH.core; g.lineWidth = 1.4; g.stroke(); }
  }
}

/* ---------- list & detail ---------- */
const listEl = $('list'), countEl = $('count');
let lastSig = '', lastListAt = 0;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rebuildList(force) {
  const sorted = vehicles.filter(vis).sort((a, b) => a.p.r - b.p.r || a.tr.t0 - b.tr.t0);
  const sig = sorted.map((v) => v.k).join(',') + '|' + selected + '|' + (lineSel ? lineSel.key : '') + '|' + emph;
  if (sig === lastSig && !force) return; lastSig = sig;
  if (!sorted.length) { listEl.innerHTML = '<div class="empty">' + (lineSel ? esc(lineSel.name) + ' has no trips running at this time.' : 'Nothing is scheduled at this hour. Drag the timeline to a busier time.') + '</div>'; return; }
  const sc = listEl.scrollTop;
  listEl.innerHTML = sorted.map((v) => '<button class="row' + (v.k === selected ? ' sel' : '') + '" data-k="' + v.k + '" style="--c:' + gcol(v.g) + '"><span class="no m">' + esc(labelOf(v)) + '</span><span class="to">' + esc(shortName(headOf(v))) + '</span><span class="ln">' + esc(r_(v).name) + '</span></button>').join('');
  listEl.scrollTop = sc;
}
listEl.addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(+b.dataset.k); });
listEl.addEventListener('pointerover', (e) => { const b = e.target.closest('.row'); hover = b ? +b.dataset.k : -1; });
listEl.addEventListener('pointerleave', () => { hover = -1; });

function select(k) { selected = (k === selected) ? -1 : k; showDetail(); lastSig = ''; }
function clk(sec) { sec = ((sec % 86400) + 86400) % 86400; let h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0') + ' ' + ap; }
function showDetail() {
  const el = $('detail'); detSig = '';
  if (selected < 0 || !trips[selected]) { el.hidden = true; el.innerHTML = ''; return; }
  const tr = trips[selected], p = pats[tr.p], r = routes[p.r];
  el.hidden = false;
  el.innerHTML = '<div class="t"><b style="color:' + gcol(p.g) + '">' + esc(r.s) + '</b><span>' + esc(r.name) + ' → ' + esc(shortName(p.h)) + '</span><button class="x" aria-label="Close">&times;</button></div><ul id="stops"></ul>';
  el.querySelector('.x').onclick = () => select(selected);
  updateDetail();
}
let detSig = '';
function updateDetail() {
  if (selected < 0 || !trips[selected]) return;
  const tr = trips[selected], p = pats[tr.p], v = vehicles.find((q) => q.k === selected);
  const nx = v ? v.nx : p.st.length;
  const from = Math.max(0, Math.min(nx - 1, p.st.length - 6)), sig = selected + ':' + nx; if (sig === detSig) return; detSig = sig;
  const ul = $('stops'); if (!ul) return; let h = '';
  for (let i = from; i < Math.min(p.st.length, from + 6); i++) {
    const s = stops[p.st[i]], cls = i === nx ? 'nx' : i < nx ? 'gone' : '';
    // connecting SkyTrain / rail lines at this stop
    const st = stopSt[p.st[i]], links = st.gset.filter((q) => q !== p.g && q !== G_BUS);
    const zc = links.length ? '<span class="zc">' + links.map((q) => '<i title="' + esc(GROUPS[q].n) + '" style="--c:' + gcol(q) + '"></i>').join('') + '</span>' : '<span></span>';
    h += '<li class="' + cls + '"><span class="tm">' + clk(tr.t0 + p.a[i]) + '</span><span class="nm">' + esc(shortName(s.n)) + '</span>' + zc + '</li>';
  }
  ul.innerHTML = h;
}

/* ---------- time bar ---------- */
const playBtn = $('play');
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {
  if (!hc.width) return;
  const ph = t / 86400;
  const col = (on) => { const i = 0, N = 1, ph = on ? 1 : 0; return (i + 0.5) / N <= ph ? TH.histOn : TH.histOff; };
  __hist.draw(hctx, D.hist[day], ph, { past: col(true), fut: col(false), cur: TH.histCur });
}
function seekFrom(e) { const r = hist.getBoundingClientRect(); t = __hist.frac(hc, e.clientX) * 86399; lastSig = ''; }
let seeking = false;
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });
hist.addEventListener('pointermove', (e) => { if (seeking) seekFrom(e); });
hist.addEventListener('pointerup', () => { seeking = false; });
hist.addEventListener('pointercancel', () => { seeking = false; });
function drawClock() { $('clock').innerHTML = __clk.html(t, 'America/Vancouver'); } window.addEventListener('clkmode', () => { lastClock = ''; drawClock(); });
__clk.live({tz:'America/Vancouver',get:()=>t,set:v=>{t=v;speedIdx=0;$('speed').innerHTML=SPEEDS[0]+'&times;'},on:()=>playing,spd:()=>speedIdx===0});

/* ---------- legend / key ---------- */
function renderKey() {
  const box = $('klines'); if (!box) return;
  const items = [], gbtn = (g, label) => '<button data-g="' + g + '" style="--c:' + gcol(g) + '" title="Highlight ' + esc(GROUPS[g].n) + '"><i></i>' + esc(label || GROUPS[g].n) + '</button>';
  if (emph === 'rail') items.push(gbtn(G_WCE));
  else if (emph === 'metro') [0, 1, 2].forEach((g) => items.push(gbtn(g)));
  else if (emph === 'bus') {
    items.push(gbtn(G_BUS, 'All frequent buses'));
    routes.forEach((r, i) => { if (r.g === G_BUS) items.push('<button data-r="' + i + '" style="--c:' + gcol(G_BUS) + '" title="' + esc(r.full) + '"><i></i>' + esc(r.full) + '</button>'); });
  } else GROUPS.forEach((g, i) => items.push(gbtn(i)));
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForGroup(+b.dataset.g)));
  box.querySelectorAll('button[data-r]').forEach((b) => b.onclick = () => setLine(lineForRoute(+b.dataset.r)));
  markKey();
}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    let on = false;
    if (lineSel) on = b.dataset.r !== undefined ? lineSel.key === 'r' + b.dataset.r : (lineSel.g === +b.dataset.g && (lineSel.g !== G_BUS || lineSel.key === 'g' + G_BUS));
    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on);
  });
}
function buildLegend() {
  const el = $('legend');
  el.innerHTML = '<button id="keytog" aria-label="Collapse key" title="Collapse key"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="keybody">' +
    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="rail">Rail</button><button data-e="metro">SkyTrain</button><button data-e="bus">Bus</button></span></div>' +
    '<div class="k-lines" id="klines"></div></div>';
  renderKey();
  el.querySelectorAll('.emph button').forEach((b) => b.onclick = () => setEmph(b.dataset.e));
  const tog = $('keytog');
  tog.onclick = () => { const m = el.classList.toggle('min'); tog.setAttribute('aria-label', m ? 'Expand key' : 'Collapse key'); tog.title = m ? 'Expand key' : 'Collapse key'; };
  if (window.matchMedia('(max-width: 820px)').matches) tog.onclick();
}

/* ---------- theme ---------- */
const ICON_MOON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg>';
const ICON_SUN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';
function setTheme(n, save) {
  themeName = n; TH = THEMES[n]; ROOT.setAttribute('data-map', n);
  const b = $('theme'); b.innerHTML = n === 'dark' ? ICON_SUN : ICON_MOON; b.setAttribute('aria-label', n === 'dark' ? 'Switch to light map' : 'Switch to dark map');
  baseDirty = true; renderKey(); renderSel();
  if (save) { try { localStorage.setItem('tl-map-theme', n); } catch (e) { /* storage unavailable */ } }
}
$('theme').onclick = () => setTheme(themeName === 'dark' ? 'light' : 'dark', true);

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.55, Math.min(s0 * 60, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
const UI = '#zoomc,#legend,#sublegend,#theme';
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    const o = ptrs.get(e.pointerId); const dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2) {
      const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch0) zoomAt(d / pinch0, (a[0][0] + a[1][0]) / 2 - r.left, (a[0][1] + a[1][1]) / 2 - r.top); pinch0 = d;
    } else { userMoved = true; view.cx -= dx / view.s; view.cy -= dy / view.s; baseDirty = true; }
    return;
  }
  if (e.pointerType === 'touch') return;
  hit(px, py);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  shapeIdx.forEach((si) => {
    const P = shapes[si];
    for (let i = 1; i < P.n; i++) {
      const ax = SX(P.X[i - 1]), ay = SY(P.Y[i - 1]), bx = SX(P.X[i]), by = SY(P.Y[i]);
      if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;
      if (d < bd) { bd = d; best = si; }
    }
  });
  if (best === null) return null;
  for (const p of pats) if (p.s === best) return lineForRoute(p.r);
  return null;
}
function hit(px, py) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v) && lineSel) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = r_(best);
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stops[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.min(px, W - tw - 24) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {
  let h = '<div><b>' + esc(s.n) + '</b></div>';
  const names = [...new Set(s.routes.map((r) => routes[r].g === G_BUS ? routes[r].s : routes[r].l))];
  if (s.metro || s.rail) {
    const lines = names.filter((n) => n.length > 3 || /^\d/.test(n) === false).join(' · ');
    h += '<div class="s">' + esc(s.rail && s.metro ? 'SkyTrain + West Coast Express' : s.rail ? 'West Coast Express' : 'SkyTrain') + '</div><div class="s">' + esc(lines) + '</div>';
    if (s.gset.length > 1) h += '<div class="s">Transfer between ' + s.gset.filter((g) => g !== G_BUS).length + ' lines</div>';
  } else h += '<div class="s">Bus stop · ' + esc(names.join(', ')) + '</div>';
  return h;
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) { select(best.k); }
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') { t = (t + 600) % 86400; } else if (e.key === 'ArrowLeft') { t = (t + 86400 - 600) % 86400; }
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles();
  drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  let th = 'dark'; try { th = localStorage.getItem('tl-map-theme') === 'light' ? 'light' : 'dark'; } catch (e) { /* default */ }
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  setTheme(th, false); resize(); loadDay(); $('loading').remove();
  new ResizeObserver(() => { resize(); }).observe(wrap);
  new ResizeObserver(() => { sizeHist(); drawHist(); }).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => { baseDirty = true; }); }
boot();
})();
</script>
