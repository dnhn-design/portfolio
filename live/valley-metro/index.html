/* Layout: full-bleed canvas map, right-hand roster, transport bar underneath. Dark by default, light via the toggle. */
:root {

  --hov: #10161f; --sel: #131b27; --card: rgba(12, 16, 23, .94); --card-2: #0a0d13; --detail: #0f151e; --tipbg: rgba(15, 20, 28, .96);
  --ctl: rgba(12, 16, 23, .85); --ctl-hov: #131a25; --ghost: rgba(255, 255, 255, .07); --focus: #5d7fa6; --shadow: rgba(0, 0, 0, .5);
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f5; --panel: #f8f9fb; --line: #dde2ea; --line-2: #cbd3de;
  --fg: #151c28; --mute: #586374; --dim: #7b8698;
  --chip: #151c28; --chip-fg: #f4f6fa;
  --hov: #edf0f5; --sel: #e4e9f1; --card: rgba(250, 251, 253, .95); --card-2: #eef1f5; --detail: #f1f4f8; --tipbg: rgba(252, 253, 254, .97);
  --ctl: rgba(250, 251, 253, .92); --ctl-hov: #e8ecf2; --ghost: rgba(0, 0, 0, .06); --focus: #3a6aa8; --shadow: rgba(30, 40, 60, .22);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.35 var(--sans); font-variant-numeric: tabular-nums;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
#app {
  height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(240px, 18vw, 300px); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "map side" "bar bar";
}
#mapwrap { grid-area: map; position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); }
#mapwrap.drag { cursor: grabbing; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#head { padding: 14px 16px 8px 18px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
#count { font: 500 28px/1 var(--sans); letter-spacing: -0.02em; }
#head .lbl { color: var(--mute); font-size: 12.5px; }
#head .tag { margin-left: auto; font: 500 9px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#selchip { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 12px; color: var(--fg); }
#selchip[hidden] { display: none; }
#selchip i { width: 18px; height: 3px; border-radius: 2px; flex: none; }
#selchip span { min-width: 0; overflow-wrap: anywhere; }
#selchip button { flex: none; margin-left: auto; background: var(--ghost); border: 0; color: var(--mute); border-radius: 50%; width: 20px; height: 20px; cursor: pointer; line-height: 1; font-size: 14px; padding: 0; }
#selchip button:hover { color: var(--fg); }
#list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 0 8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.row {

  font: inherit; padding: 5px 16px 5px 18px; cursor: pointer; align-items: baseline; border-left: 2px solid transparent;
}
.row:hover { background: var(--hov); }
.row.sel { background: var(--sel); border-left-color: var(--c, #fff); }

.row .to { font-size: 13px; font-weight: 500; letter-spacing: -0.005em; overflow-wrap: anywhere; min-width: 0; }
.row .ln { color: var(--mute); font-size: 11.5px; grid-column: 2; overflow-wrap: anywhere; min-width: 0; }
.empty { padding: 24px 22px; color: var(--mute); overflow-wrap: anywhere; }

#detail .x { margin-left: auto; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
#detail .x:hover { color: var(--fg); }
#stops { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; max-height: 210px; overflow-y: auto; }

#stops li .xf em { font: 600 9.5px/1 var(--sans); font-style: normal; padding: 2px 5px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }

#legend {
  position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 6px;

}

  padding: 10px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 28px var(--shadow);
}
#legend.min #keybody { display: none; }
#legend button { pointer-events: auto; font: inherit; color: inherit; cursor: pointer; }
#legend #keytog { flex: none; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); }
#legend #keytog:hover { color: var(--fg); background: var(--ctl-hov); }
#legend #keytog svg { transition: transform .2s; }
#legend.min #keytog svg { transform: rotate(180deg); }
.k-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
.emph-l { color: var(--dim); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
.emph { display: inline-flex; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card-2); }
#legend .emph button { flex: none; padding: 4px 12px; border: 0; border-radius: 6px; background: none; font-size: 11.5px; line-height: 1.2; color: var(--mute); white-space: nowrap; }
#legend .emph button:hover { color: var(--fg); }
#legend .emph button.on { background: var(--chip); color: var(--chip-fg); }
.k-lines { display: flex; flex-wrap: wrap; gap: 5px; }
#legend .k-lines button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 999px; background: none; font-size: 11.5px; line-height: 1.2; text-align: left; white-space: nowrap; color: var(--fg); }
#legend .k-lines button:hover { background: var(--ghost); }
#legend .k-lines button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; flex: none; }
#legend .k-lines button.off { opacity: .42; }
#legend .k-lines button.act { background: var(--ghost); border-color: var(--c); }
.k-note { margin: 0; padding-top: 8px; border-top: 1px solid var(--line); color: var(--dim); font-size: 10.5px; line-height: 1.4; overflow-wrap: anywhere; }
#sublegend { position: absolute; left: calc(max(14px, env(safe-area-inset-left, 0px)) + 40px); right: 56px; top: 14px; display: flex; gap: 5px; flex-wrap: wrap; pointer-events: none; }

#themebtn { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: var(--ctl); border: 1px solid var(--line-2); border-radius: 8px; color: var(--mute); cursor: pointer; }

  const sorted = vehicles.filter(vis).sort((a, b) => a.g - b.g || a.p.r - b.p.r || (parseInt(a.tr.no) || 0) - (parseInt(b.tr.no) || 0) || a.tr.t0 - b.tr.t0);
  const sig = sorted.map((v) => v.k).join(',') + '|' + selected + '|' + (lineSel ? lineSel.key : '') + '|' + emph;
  if (sig === lastSig && !force) return; lastSig = sig;
  if (!sorted.length) { listEl.innerHTML = '<div class="empty">' + (lineSel ? esc(lineSel.name) + ' has no trips running at this time.' : 'Nothing is scheduled at this hour. Drag the timeline to a busier time.') + '</div>'; return; }
  const sc = listEl.scrollTop;
  listEl.innerHTML = sorted.map((v) => {
    const r = r_(v), no = tripNo(v.tr, r);
    return '<button class="row' + (v.k === selected ? ' sel' : '') + '" data-k="' + v.k + '" style="--c:' + tc(r.col) + '"><span class="no">' + esc(r.s) + '</span><span class="to">' + esc(shortName(headOf(v))) + '</span><span class="ln">' + esc(r.name) + esc(no) + '</span></button>';
  }).join('');
  listEl.scrollTop = sc;
}
listEl.addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) select(+b.dataset.k); });
listEl.addEventListener('pointerover', (e) => { const b = e.target.closest('.row'); const k = b ? +b.dataset.k : -1; if (k !== hover) hover = k; });
listEl.addEventListener('pointerleave', () => { hover = -1; });

function select(k) { selected = (k === selected) ? -1 : k; detSig = ''; showDetail(); lastSig = ''; }
function clk(sec) { sec = ((sec % 86400) + 86400) % 86400; let h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + String(m).padStart(2, '0') + ' ' + ap; }
function showDetail() {
  const el = $('detail');
  if (selected < 0 || !trips[selected]) { el.hidden = true; el.innerHTML = ''; return; }
  const tr = trips[selected], p = pats[tr.p], r = routes[p.r];
  const no = tripNo(tr, r);
  el.hidden = false;
  el.innerHTML = '<div class="t"><b style="color:' + tc(r.col) + '">' + esc(r.s) + '</b><span>' + esc(r.name + no) + ' to ' + esc(shortName(p.h ? p.h.replace(/\+/g, ' & ') : r.name)) + '</span><button class="x" aria-label="Close">&times;</button></div><ul id="stops"></ul>';
  el.querySelector('.x').onclick = () => select(selected);
  updateDetail();
}
let detSig = '';
function updateDetail() {
  if (selected < 0 || !trips[selected]) return;
  const tr = trips[selected], p = pats[tr.p], v = vehicles.find((q) => q.k === selected);
  const nx = v ? v.nx : p.st.length;
  const from = Math.max(0, Math.min(nx - 1, p.st.length - 6)), sig = selected + ':' + nx; if (sig === detSig) return; detSig = sig;
  const ul = $('stops'); if (!ul) return; let h = '';
  for (let i = from; i < Math.min(p.st.length, from + 6); i++) {
    const s = stations[p.st[i]], cls = i === nx ? 'nx' : i < nx ? 'gone' : '';
    const seen = new Set(), chips = [];
    s.routes.concat(s.xfer).forEach((ri) => { const o = routes[ri]; if (ri === p.r || seen.has(o.s)) return; seen.add(o.s); chips.push('<em style="color:' + tc(o.col) + '">' + esc(o.s) + '</em>'); });
    h += '<li class="' + cls + '"><span class="tm">' + clk(tr.t0 + p.a[i] * tr.sc) + '</span><span class="nm">' + esc(shortName(s.n)) + '</span>' + (chips.length ? '<span class="xf">' + chips.slice(0, 5).join('') + '</span>' : '') + '</li>';
  }
  ul.innerHTML = h;
}

/* ---------- time bar ---------- */
const playBtn = $('play');
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4.5" y="3.5" width="4.2" height="15" rx="1"/><rect x="13.3" y="3.5" width="4.2" height="15" rx="1"/></svg>';
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M6 3.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/></svg>';
function setPlay(v) { playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play'); }
playBtn.onclick = () => setPlay(!playing);
$('speed').onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; $('speed').innerHTML = SPEEDS[speedIdx] + '&times;'; };
document.querySelectorAll('#days button').forEach((b) => b.onclick = () => { day = b.dataset.d; markDay(); loadDay(); });
function markDay() { document.querySelectorAll('#days button').forEach((b) => b.classList.toggle('on', b.dataset.d === day)); }
function drawHist() {
  const g = hctx, w = hc.width, h = hc.height; g.clearRect(0, 0, w, h); if (!w) return;
  const hs = D.hist[day], N = 480, mxv = Math.max.apply(null, hs) || 1, bw = w / N, ph = t / 86400;
  const lit = PAL.lift ? 'rgba(40,55,80,0.72)' : 'rgba(214,222,234,0.62)', off = PAL.lift ? 'rgba(90,110,140,0.28)' : 'rgba(150,164,186,0.26)';
  for (let i = 0; i < N; i++) {
    let v = 0; for (let j = 0; j < 3; j++) v = Math.max(v, hs[i * 3 + j]);
    const bh = Math.max(2 * dpr, (v / mxv) * (h - 6 * dpr));
    g.fillStyle = (i + 0.5) / N <= ph ? lit : off;
    g.fillRect(i * bw + bw * 0.12, h - bh, Math.max(1, bw * 0.62), bh);
  }
  g.fillStyle = PAL.lift ? '#18202e' : '#f4f7fb'; g.fillRect(Math.round(ph * w) - dpr, 0, 2 * dpr, h);
}
function seekFrom(e) { const r = hist.getBoundingClientRect(); t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86399; }
let seeking = false;
hist.addEventListener('pointerdown', (e) => { seeking = true; hist.setPointerCapture(e.pointerId); seekFrom(e); });
hist.addEventListener('pointermove', (e) => { if (seeking) seekFrom(e); });
hist.addEventListener('pointerup', () => { seeking = false; });
hist.addEventListener('pointercancel', () => { seeking = false; });
function drawClock() { $('clock').innerHTML = __clk.html(t, 'America/Phoenix'); } window.addEventListener('clkmode', () => { lastClock = ''; drawClock(); });
__clk.live({tz:'America/Phoenix',get:()=>t,set:v=>{t=v;speedIdx=0;$('speed').innerHTML=SPEEDS[0]+'&times;'},on:()=>playing,spd:()=>speedIdx===0});

/* ---------- key ---------- */
function renderKey() {
  const box = $('klines'); if (!box) return;
  const items = [];
  const chip = (attr, c, label, title) => '<button ' + attr + ' style="--c:' + c + '" title="' + esc(title || label) + '"><i></i>' + esc(label) + '</button>';
  if (emph === 'rail') {
    routes.forEach((r) => { if (r.m === 'rail') items.push(chip('data-r="' + r.i + '"', r.col, r.name)); });
  } else if (emph === 'bus') {
    items.push(chip('data-g="' + BUSG + '"', GROUPS[BUSG].c, 'All frequent buses'));
    routes.forEach((r) => { if (r.m === 'bus') items.push(chip('data-r="' + r.i + '"', r.col, r.name)); });
  } else GROUPS.forEach((g, i) => items.push(chip('data-g="' + i + '"', g.c, g.n, 'Highlight ' + g.n)));
  box.innerHTML = items.join('');
  box.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () => setLine(lineForGroup(+b.dataset.g)));
  box.querySelectorAll('button[data-r]').forEach((b) => b.onclick = () => setLine(lineForRoute(+b.dataset.r)));
  markKey();
}
function markKey() {
  document.querySelectorAll('#klines button').forEach((b) => {
    const on = !!lineSel && (b.dataset.r !== undefined ? lineSel.key === 'r' + b.dataset.r : lineSel.g === +b.dataset.g);
    b.classList.toggle('act', on); b.classList.toggle('off', !!lineSel && !on);
  });
}
function buildLegend() {
  const el = $('legend');
  el.innerHTML = '<button id="keytog" aria-label="Collapse key" title="Collapse key"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="keybody">' +
    '<div class="k-row"><span class="emph-l">Focus</span><span class="emph" role="group" aria-label="Focus"><button data-e="all" class="on">All</button><button data-e="rail">Rail</button><button data-e="bus">Bus</button></span></div>' +
    '<div class="k-lines" id="klines"></div>' +
    '<p class="k-note">Rail is every train in the feed. Buses are the frequent routes: every 15 min or better on weekday middays.</p></div>';
  renderKey();
  el.querySelectorAll('.emph button').forEach((b) => b.onclick = () => setEmph(b.dataset.e));
  const tog = $('keytog');
  tog.onclick = () => { const m = el.classList.toggle('min'); tog.setAttribute('aria-label', m ? 'Expand key' : 'Collapse key'); tog.title = m ? 'Expand key' : 'Collapse key'; };
  if (window.matchMedia('(max-width: 820px)').matches) tog.onclick();
}

/* ---------- theme ---------- */
function setTheme(n) {
  theme = n; PAL = PALS[n]; document.documentElement.dataset.theme = n;
  const b = $('themebtn'); b.setAttribute('aria-label', n === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  try { localStorage.setItem('vm-theme', n); } catch (e) {}
  baseDirty = true; lastSig = ''; drawHist(); renderKey(); buildSub();
}
$('themebtn').onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');

/* ---------- interaction ---------- */
const tip = $('tip');
function zoomAt(f, px, py) {
  const ns = Math.max(s0 * 0.55, Math.min(s0 * 40, view.s * f)); f = ns / view.s;
  const wx = view.cx + (px - W / 2) / view.s, wy = view.cy + (py - H / 2) / view.s;
  userMoved = true; view.s = ns; view.cx = wx - (px - W / 2) / ns; view.cy = wy - (py - H / 2) / ns; baseDirty = true;
}
wrap.addEventListener('wheel', (e) => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
$('zin').onclick = () => zoomAt(1.5, W / 2, H / 2); $('zout').onclick = () => zoomAt(1 / 1.5, W / 2, H / 2); $('zfit').onclick = () => { userMoved = false; fit(); baseDirty = true; };
const UI = '#zoomc,#legend,#sublegend,#themebtn';
wrap.addEventListener('dblclick', (e) => { if (e.target.closest(UI)) return; const r = wrap.getBoundingClientRect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
const ptrs = new Map(); let moved = 0, pinch0 = 0, downAt = null;
wrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest(UI)) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; downAt = [e.clientX, e.clientY];
  if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch0 = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); }
  wrap.classList.add('drag'); tip.hidden = true;
});
wrap.addEventListener('pointermove', (e) => {
  const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    const o = ptrs.get(e.pointerId); const dx = e.clientX - o[0], dy = e.clientY - o[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2) { const a = [...ptrs.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch0) zoomAt(d / pinch0, (a[0][0] + a[1][0]) / 2 - r.left, (a[0][1] + a[1][1]) / 2 - r.top); pinch0 = d; }
    else { userMoved = true; view.cx -= dx / view.s; view.cy -= dy / view.s; baseDirty = true; }
    return;
  }
  if (e.pointerType === 'touch') return;
  if (e.target.closest(UI)) { tip.hidden = true; return; }
  hit(px, py);
});
function lineAt(px, py) {
  let best = null, bd = 64;
  drawOrder.forEach((ri) => {
    routeShapes[ri].forEach((si) => {
      const P = shapes[si];
      for (let i = 1; i < P.n; i++) {
        const ax = SX(P.X[i - 1]), ay = SY(P.Y[i - 1]), bx = SX(P.X[i]), by = SY(P.Y[i]);
        if (Math.max(ax, bx) < px - 8 || Math.min(ax, bx) > px + 8 || Math.max(ay, by) < py - 8 || Math.min(ay, by) > py + 8) continue;
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
        const d = (ax + dx * f - px) ** 2 + (ay + dy * f - py) ** 2;
        if (d <= bd) { bd = d; best = ri; }
      }
    });
  });
  return best === null ? null : lineForRoute(best);
}
function hit(px, py) {
  let best = null, bd = 100;
  for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
  hoverStation = null;
  if (best) {
    hover = best.k; wrap.style.cursor = 'pointer';
    const r = r_(best), no = esc(tripNo(best.tr, r));
    tip.innerHTML = '<div><b>' + esc(r.s) + '</b> → ' + esc(shortName(headOf(best))) + '</div><div class="s">' + esc(r.name) + no + (best.nx < best.p.st.length ? ' · next ' + esc(shortName(stations[best.p.st[best.nx]].n)) : '') + '</div>';
  } else {
    hover = -1; wrap.style.cursor = '';
    let sb = null, sd = 100;
    for (const s of stations) { if (!s.vis) continue; const d = (s.sx - px) ** 2 + (s.sy - py) ** 2; if (d < sd) { sd = d; sb = s; } }
    if (sb) { hoverStation = sb; tip.innerHTML = stationTip(sb); wrap.style.cursor = 'pointer'; }
    else {
      const l = lineAt(px, py);
      if (l) { wrap.style.cursor = 'pointer'; tip.innerHTML = '<div><b>' + esc(l.name) + '</b></div><div class="s">Click to highlight</div>'; }
      else { tip.hidden = true; return; }
    }
  }
  tip.hidden = false;
  const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(px, W - tw - 24)) + 'px'; tip.style.top = Math.min(py, H - 80) + 'px';
}
function stationTip(s) {
  const names = [...new Set(s.routes.map((r) => routes[r].m === 'bus' ? 'Route ' + routes[r].s : routes[r].name))].slice(0, 6).join(' · ');
  let h = '<div><b>' + esc(s.n) + '</b></div><div class="s">' + esc(names) + '</div>';
  const xf = [...new Set(s.xfer.map((r) => routes[r].m === 'bus' ? 'Route ' + routes[r].s : routes[r].name))];
  if (xf.length) h += '<div class="s">Connects: ' + esc(xf.slice(0, 5).join(' · ')) + '</div>';
  return h;
}
wrap.addEventListener('pointerleave', () => { if (!ptrs.size) { tip.hidden = true; hover = -1; } });
function pend(e) {
  const had = ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (!ptrs.size) wrap.classList.remove('drag');
  if (had && moved < 6 && downAt) {
    const r = wrap.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; let best = null, bd = 196;
    for (const v of vehicles) { if (v.sx === undefined || !vis(v)) continue; const d = (v.sx - px) ** 2 + (v.sy - py) ** 2; if (d < bd) { bd = d; best = v; } }
    if (best) select(best.k);
    else { const l = lineAt(px, py); if (l) setLine(l); else if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
  }
}
wrap.addEventListener('pointerup', pend); wrap.addEventListener('pointercancel', pend);
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') t = (t + 600) % 86400; else if (e.key === 'ArrowLeft') t = (t + 86400 - 600) % 86400;
  else if (e.key === 'Escape') { if (selected >= 0) select(selected); else if (lineSel) setLine(null); }
});

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !seeking) { t += dt * SPEEDS[speedIdx]; if (t >= 86400) t -= 86400; }
  if (baseDirty) drawBase();
  computeVehicles();
  drawLive();
  countEl.textContent = vehicles.reduce((n, v) => n + (vis(v) ? 1 : 0), 0);
  const c = clk(t); if (c !== lastClock) { lastClock = c; drawClock(); drawHist(); }
  if (now - lastListAt > 350) { lastListAt = now; rebuildList(); updateDetail(); }
  requestAnimationFrame(frame);
}
function boot() {
  let th = 'dark'; try { if (localStorage.getItem('vm-theme') === 'light') th = 'light'; } catch (e) {}
  theme = th; PAL = PALS[th]; document.documentElement.dataset.theme = th;
  buildLegend(); markDay(); setPlay(true); $('speed').innerHTML = SPEEDS[speedIdx] + '&times;';
  resize(); loadDay(); const ld = $('loading'); if (ld) ld.remove();
  new ResizeObserver(() => resize()).observe(wrap);
  new ResizeObserver(() => sizeHist()).observe(hist);
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; });
boot();
})();
</script>
